syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntitySyncServiceProto";
option java_package = "com.acme.featurestore.v1";

// Keeps entities in step with the systems of record in other regions.
service EntitySyncService {
  // Syncs an entity.
  rpc SyncEntities(SyncEntitiesRequest) returns (SyncEntitiesResponse);

  // Pushs an entity.
  rpc PushEntity(PushEntityRequest) returns (PushEntityResponse);

  // Reconciles an entity.
  rpc ReconcileEntities(ReconcileEntitiesRequest) returns (ReconcileEntitiesResponse);

  // Exchanges changes of entities with a peer.
  rpc StreamEntityChanges(stream StreamEntityChangesRequest) returns (stream StreamEntityChangesResponse);

  // Returns an entity.
  rpc GetEntitySyncState(GetEntitySyncStateRequest) returns (GetEntitySyncStateResponse);

  // Lists entities a page at a time.
  rpc ListEntityConflicts(ListEntityConflictsRequest) returns (ListEntityConflictsResponse);
}

// The request of `SyncEntities`.
message SyncEntitiesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  SyncEntitiesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncEntities`.
message SyncEntitiesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  SyncEntitiesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushEntity`.
message PushEntityRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  PushEntityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushEntity`.
message PushEntityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  PushEntityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileEntities`.
message ReconcileEntitiesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  ReconcileEntitiesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileEntities`.
message ReconcileEntitiesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  ReconcileEntitiesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamEntityChanges`.
message StreamEntityChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Entity change = 2;
    StreamEntityChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamEntityChanges`.
message StreamEntityChangesResponse {
  Entity entity = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetEntitySyncState`.
message GetEntitySyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetEntitySyncState`.
message GetEntitySyncStateResponse {
  Entity entity = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListEntityConflicts`.
message ListEntityConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EntityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEntityConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEntityConflicts`.
message ListEntityConflictsResponse {
  repeated Entity entities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
