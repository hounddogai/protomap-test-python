syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueSyncServiceProto";
option java_package = "com.acme.featurestore.v1";

// Keeps feature values in step with the systems of record in other regions.
service FeatureValueSyncService {
  // Syncs a feature value.
  rpc SyncFeatureValues(SyncFeatureValuesRequest) returns (SyncFeatureValuesResponse);

  // Pushs a feature value.
  rpc PushFeatureValue(PushFeatureValueRequest) returns (PushFeatureValueResponse);

  // Pulls a feature value.
  rpc PullFeatureValues(PullFeatureValuesRequest) returns (PullFeatureValuesResponse);

  // Reconciles a feature value.
  rpc ReconcileFeatureValues(ReconcileFeatureValuesRequest) returns (ReconcileFeatureValuesResponse);

  // Exchanges changes of feature values with a peer.
  rpc StreamFeatureValueChanges(stream StreamFeatureValueChangesRequest) returns (stream StreamFeatureValueChangesResponse);

  // Resolves a feature value.
  rpc ResolveFeatureValueConflict(ResolveFeatureValueConflictRequest) returns (ResolveFeatureValueConflictResponse);

  // Returns a feature value.
  rpc GetFeatureValueSyncState(GetFeatureValueSyncStateRequest) returns (GetFeatureValueSyncStateResponse);

  // Lists feature values a page at a time.
  rpc ListFeatureValueConflicts(ListFeatureValueConflictsRequest) returns (ListFeatureValueConflictsResponse);
}

// The request of `SyncFeatureValues`.
message SyncFeatureValuesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  SyncFeatureValuesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFeatureValues`.
message SyncFeatureValuesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  SyncFeatureValuesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFeatureValue`.
message PushFeatureValueRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
