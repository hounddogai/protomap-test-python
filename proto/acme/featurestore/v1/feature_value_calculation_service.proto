syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueCalculationServiceProto";
option java_package = "com.acme.featurestore.v1";

// Computes the figures of a feature value, such as totals, taxes, and estimates.
service FeatureValueCalculationService {
  // Calculates a feature value.
  rpc CalculateFeatureValue(CalculateFeatureValueRequest) returns (CalculateFeatureValueResponse);

  // Estimates a feature value.
  rpc EstimateFeatureValue(EstimateFeatureValueRequest) returns (EstimateFeatureValueResponse);

  // Quotes a feature value.
  rpc QuoteFeatureValue(QuoteFeatureValueRequest) returns (QuoteFeatureValueResponse);

  // Recalculates a feature value.
  rpc RecalculateFeatureValues(RecalculateFeatureValuesRequest) returns (RecalculateFeatureValuesResponse);

  // Simulates a feature value.
  rpc SimulateFeatureValue(SimulateFeatureValueRequest) returns (SimulateFeatureValueResponse);

  // Explains a feature value.
  rpc ExplainFeatureValueCalculation(ExplainFeatureValueCalculationRequest) returns (ExplainFeatureValueCalculationResponse);

  // Returns a feature value.
  rpc GetFeatureValueRates(GetFeatureValueRatesRequest) returns (GetFeatureValueRatesResponse);
}

// The request of `CalculateFeatureValue`.
message CalculateFeatureValueRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  CalculateFeatureValueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFeatureValue`.
message CalculateFeatureValueResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFeatureValueResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FeatureValue feature_value = 1;
  CalculateFeatureValueResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

