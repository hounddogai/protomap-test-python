syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewLifecycleServiceProto";
option java_package = "com.acme.featurestore.v1";

// Moves a feature view between the states of its lifecycle.
service FeatureViewLifecycleService {
  // Activates a feature view.
  rpc ActivateFeatureView(ActivateFeatureViewRequest) returns (ActivateFeatureViewResponse);

  // Suspends a feature view.
  rpc SuspendFeatureView(SuspendFeatureViewRequest) returns (SuspendFeatureViewResponse);

  // Reinstates a feature view.
  rpc ReinstateFeatureView(ReinstateFeatureViewRequest) returns (ReinstateFeatureViewResponse);

  // Terminates a feature view.
  rpc TerminateFeatureView(TerminateFeatureViewRequest) returns (TerminateFeatureViewResponse);

  // Renews a feature view.
  rpc RenewFeatureView(RenewFeatureViewRequest) returns (RenewFeatureViewResponse);

  // Expires a feature view.
  rpc ExpireFeatureView(ExpireFeatureViewRequest) returns (ExpireFeatureViewResponse);

  // Returns a feature view.
  rpc GetFeatureViewLifecycle(GetFeatureViewLifecycleRequest) returns (GetFeatureViewLifecycleResponse);

  // Schedules a feature view.
  rpc ScheduleFeatureViewExpiry(ScheduleFeatureViewExpiryRequest) returns (ScheduleFeatureViewExpiryResponse);
}

// The request of `ActivateFeatureView`.
message ActivateFeatureViewRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  ActivateFeatureViewRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFeatureView`.
message ActivateFeatureViewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  ActivateFeatureViewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

