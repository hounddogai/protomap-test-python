syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntityApprovalServiceProto";
option java_package = "com.acme.featurestore.v1";

// Routes entities through approval, with escalation and delegation.
service EntityApprovalService {
  // Submits an entity.
  rpc SubmitEntity(SubmitEntityRequest) returns (SubmitEntityResponse);

  // Approves an entity.
  rpc ApproveEntity(ApproveEntityRequest) returns (ApproveEntityResponse);

  // Rejects an entity.
  rpc RejectEntity(RejectEntityRequest) returns (RejectEntityResponse);

  // Lists entities a page at a time.
  rpc ListPendingEntities(ListPendingEntitiesRequest) returns (ListPendingEntitiesResponse);

  // Recalls an entity.
  rpc RecallEntity(RecallEntityRequest) returns (RecallEntityResponse);

  // Comments an entity.
  rpc CommentEntityApproval(CommentEntityApprovalRequest) returns (CommentEntityApprovalResponse);
}

// The request of `SubmitEntity`.
message SubmitEntityRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  SubmitEntityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEntity`.
message SubmitEntityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  SubmitEntityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

