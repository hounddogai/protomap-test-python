syntax = "proto3";

package acme.featurestore.v1;

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.featurestore.v1";

// A reference to a feature view of the featurestore domain.
message FeatureViewRef {
  string feature_view_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a feature value of the featurestore domain.
message FeatureValueRef {
  string feature_value_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to an entity of the featurestore domain.
message EntityRef {
  string entity_id = 1;
  string display_name = 2;
  string email = 3;
}
