syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueQueryServiceProto";
option java_package = "com.acme.featurestore.v1";

// Answers read-only questions about feature values, for screens and reports.
service FeatureValueQueryService {
  // Returns a feature value.
  rpc LookupFeatureValue(LookupFeatureValueRequest) returns (LookupFeatureValueResponse);

  // Lists feature values a page at a time.
  rpc BrowseFeatureValues(BrowseFeatureValuesRequest) returns (BrowseFeatureValuesResponse);

  // Lists feature values a page at a time.
  rpc FindFeatureValues(FindFeatureValuesRequest) returns (FindFeatureValuesResponse);

  // Counts feature values by status.
  rpc CountFeatureValues(CountFeatureValuesRequest) returns (CountFeatureValuesResponse);

  // Returns several feature values at once.
  rpc ResolveFeatureValues(ResolveFeatureValuesRequest) returns (ResolveFeatureValuesResponse);

  // Streams every matching feature value.
  rpc ExportFeatureValues(ExportFeatureValuesRequest) returns (stream ExportFeatureValuesResponse);

  // Summarizes a feature value.
  rpc SummarizeFeatureValues(SummarizeFeatureValuesRequest) returns (SummarizeFeatureValuesResponse);

  // Lists feature values a page at a time.
  rpc SuggestFeatureValues(SuggestFeatureValuesRequest) returns (SuggestFeatureValuesResponse);

  // Returns a feature value.
  rpc PeekFeatureValue(PeekFeatureValueRequest) returns (PeekFeatureValueResponse);
}

// The request of `LookupFeatureValue`.
message LookupFeatureValueRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupFeatureValue`.
message LookupFeatureValueResponse {
  FeatureValue feature_value = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseFeatureValues`.
message BrowseFeatureValuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseFeatureValuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseFeatureValues`.
message BrowseFeatureValuesResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindFeatureValues`.
message FindFeatureValuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindFeatureValuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindFeatureValues`.
message FindFeatureValuesResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFeatureValues`.
message CountFeatureValuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFeatureValuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFeatureValues`.
message CountFeatureValuesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveFeatureValues`.
message ResolveFeatureValuesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string feature_value_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveFeatureValues`.
message ResolveFeatureValuesResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportFeatureValues`.
message ExportFeatureValuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportFeatureValuesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportFeatureValues`.
message ExportFeatureValuesResponse {
  FeatureValue feature_value = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeFeatureValues`.
message SummarizeFeatureValuesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  SummarizeFeatureValuesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeFeatureValues`.
message SummarizeFeatureValuesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestFeatureValues`.
message SuggestFeatureValuesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestFeatureValuesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestFeatureValues`.
message SuggestFeatureValuesResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekFeatureValue`.
message PeekFeatureValueRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekFeatureValue`.
message PeekFeatureValueResponse {
  FeatureValue feature_value = 1;
  acme.common.v1.OperationResult result = 2;
}
