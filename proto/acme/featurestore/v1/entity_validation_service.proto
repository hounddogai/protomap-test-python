syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntityValidationServiceProto";
option java_package = "com.acme.featurestore.v1";

// Checks entities against the rules before anything acts on them.
service EntityValidationService {
  // Validates an entity.
  rpc ValidateEntity(ValidateEntityRequest) returns (ValidateEntityResponse);

  // Previews an entity.
  rpc PreviewEntity(PreviewEntityRequest) returns (PreviewEntityResponse);

  // Checks an entity.
  rpc CheckEntityEligibility(CheckEntityEligibilityRequest) returns (CheckEntityEligibilityResponse);

  // Normalizes an entity.
  rpc NormalizeEntity(NormalizeEntityRequest) returns (NormalizeEntityResponse);

  // Explains an entity.
  rpc ExplainEntityDecision(ExplainEntityDecisionRequest) returns (ExplainEntityDecisionResponse);

  // Scores an entity.
  rpc ScoreEntity(ScoreEntityRequest) returns (ScoreEntityResponse);

  // Lints an entity.
  rpc LintEntities(LintEntitiesRequest) returns (LintEntitiesResponse);

  // Returns an entity.
  rpc GetEntityRules(GetEntityRulesRequest) returns (GetEntityRulesResponse);
}

// The request of `ValidateEntity`.
message ValidateEntityRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  ValidateEntityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEntity`.
message ValidateEntityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  ValidateEntityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

