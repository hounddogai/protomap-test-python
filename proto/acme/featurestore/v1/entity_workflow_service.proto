syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntityWorkflowServiceProto";
option java_package = "com.acme.featurestore.v1";

// Runs the long-lived workflow that takes an entity from start to finish.
service EntityWorkflowService {
  // Starts an entity.
  rpc StartEntityWorkflow(StartEntityWorkflowRequest) returns (StartEntityWorkflowResponse);

  // Advances an entity.
  rpc AdvanceEntityWorkflow(AdvanceEntityWorkflowRequest) returns (AdvanceEntityWorkflowResponse);

  // Retrys an entity.
  rpc RetryEntityWorkflow(RetryEntityWorkflowRequest) returns (RetryEntityWorkflowResponse);

  // Pauses an entity.
  rpc PauseEntityWorkflow(PauseEntityWorkflowRequest) returns (PauseEntityWorkflowResponse);

  // Resumes an entity.
  rpc ResumeEntityWorkflow(ResumeEntityWorkflowRequest) returns (ResumeEntityWorkflowResponse);

  // Returns an entity.
  rpc InspectEntityWorkflow(InspectEntityWorkflowRequest) returns (InspectEntityWorkflowResponse);
}

// The request of `StartEntityWorkflow`.
message StartEntityWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  StartEntityWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEntityWorkflow`.
message StartEntityWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  StartEntityWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

