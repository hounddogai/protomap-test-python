    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  ExplainEntityCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainEntityCalculation`.
message ExplainEntityCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  ExplainEntityCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetEntityRates`.
message GetEntityRatesRequest {
