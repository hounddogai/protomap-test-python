syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntityCalculationServiceProto";
option java_package = "com.acme.featurestore.v1";

// Computes the figures of an entity, such as totals, taxes, and estimates.
service EntityCalculationService {
  // Calculates an entity.
  rpc CalculateEntity(CalculateEntityRequest) returns (CalculateEntityResponse);

  // Estimates an entity.
  rpc EstimateEntity(EstimateEntityRequest) returns (EstimateEntityResponse);

  // Quotes an entity.
  rpc QuoteEntity(QuoteEntityRequest) returns (QuoteEntityResponse);

  // Compares an entity.
  rpc CompareEntityOptions(CompareEntityOptionsRequest) returns (CompareEntityOptionsResponse);

  // Explains an entity.
  rpc ExplainEntityCalculation(ExplainEntityCalculationRequest) returns (ExplainEntityCalculationResponse);

  // Returns an entity.
  rpc GetEntityRates(GetEntityRatesRequest) returns (GetEntityRatesResponse);
}

// The request of `CalculateEntity`.
message CalculateEntityRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  Entity entity = 3;
  CalculateEntityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEntity`.
message CalculateEntityResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEntityResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Entity entity = 1;
  CalculateEntityResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

