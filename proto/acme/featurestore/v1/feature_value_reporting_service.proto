syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueReportingServiceProto";
option java_package = "com.acme.featurestore.v1";

// Builds and schedules reports about feature values.
service FeatureValueReportingService {
  // Generates a feature value.
  rpc GenerateFeatureValueReport(GenerateFeatureValueReportRequest) returns (GenerateFeatureValueReportResponse);

  // Returns a feature value.
  rpc FetchFeatureValueReport(FetchFeatureValueReportRequest) returns (FetchFeatureValueReportResponse);

  // Schedules a feature value.
  rpc ScheduleFeatureValueReport(ScheduleFeatureValueReportRequest) returns (ScheduleFeatureValueReportResponse);

  // Streams the changes of feature values as they happen.
  rpc StreamFeatureValueMetrics(StreamFeatureValueMetricsRequest) returns (stream StreamFeatureValueMetricsResponse);

  // Lists feature values a page at a time.
  rpc ListFeatureValueReports(ListFeatureValueReportsRequest) returns (ListFeatureValueReportsResponse);

  // Shares a feature value.
  rpc ShareFeatureValueReport(ShareFeatureValueReportRequest) returns (ShareFeatureValueReportResponse);

  // Counts feature values by status.
  rpc CountFeatureValueTotals(CountFeatureValueTotalsRequest) returns (CountFeatureValueTotalsResponse);
}

// The request of `GenerateFeatureValueReport`.
message GenerateFeatureValueReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  GenerateFeatureValueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateFeatureValueReport`.
message GenerateFeatureValueReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchFeatureValueReport`.
message FetchFeatureValueReportRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchFeatureValueReport`.
message FetchFeatureValueReportResponse {
  FeatureValue feature_value = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleFeatureValueReport`.
message ScheduleFeatureValueReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  ScheduleFeatureValueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFeatureValueReport`.
message ScheduleFeatureValueReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamFeatureValueMetrics`.
message StreamFeatureValueMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFeatureValueMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamFeatureValueMetrics`.
message StreamFeatureValueMetricsResponse {
  FeatureValue feature_value = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListFeatureValueReports`.
message ListFeatureValueReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFeatureValueReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFeatureValueReports`.
message ListFeatureValueReportsResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFeatureValueReport`.
message ShareFeatureValueReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  ShareFeatureValueReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFeatureValueReport`.
message ShareFeatureValueReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  ShareFeatureValueReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFeatureValueTotals`.
message CountFeatureValueTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFeatureValueTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFeatureValueTotals`.
message CountFeatureValueTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
