syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueApprovalServiceProto";
option java_package = "com.acme.featurestore.v1";

// Routes feature values through approval, with escalation and delegation.
service FeatureValueApprovalService {
  // Submits a feature value.
  rpc SubmitFeatureValue(SubmitFeatureValueRequest) returns (SubmitFeatureValueResponse);

  // Approves a feature value.
  rpc ApproveFeatureValue(ApproveFeatureValueRequest) returns (ApproveFeatureValueResponse);

  // Rejects a feature value.
  rpc RejectFeatureValue(RejectFeatureValueRequest) returns (RejectFeatureValueResponse);

  // Escalates a feature value.
  rpc EscalateFeatureValue(EscalateFeatureValueRequest) returns (EscalateFeatureValueResponse);

  // Lists feature values a page at a time.
  rpc ListPendingFeatureValues(ListPendingFeatureValuesRequest) returns (ListPendingFeatureValuesResponse);

  // Delegates a feature value.
  rpc DelegateFeatureValueApproval(DelegateFeatureValueApprovalRequest) returns (DelegateFeatureValueApprovalResponse);

  // Recalls a feature value.
  rpc RecallFeatureValue(RecallFeatureValueRequest) returns (RecallFeatureValueResponse);

  // Returns a feature value.
  rpc GetFeatureValueApprovalStatus(GetFeatureValueApprovalStatusRequest) returns (GetFeatureValueApprovalStatusResponse);

  // Comments a feature value.
  rpc CommentFeatureValueApproval(CommentFeatureValueApprovalRequest) returns (CommentFeatureValueApprovalResponse);
}

// The request of `SubmitFeatureValue`.
message SubmitFeatureValueRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  SubmitFeatureValueRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFeatureValue`.
message SubmitFeatureValueResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  SubmitFeatureValueResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

