syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueImportServiceProto";
option java_package = "com.acme.featurestore.v1";

// Takes feature values in bulk from partners and legacy systems.
service FeatureValueImportService {
  // Takes a stream of feature values and answers once at the end.
  rpc ImportFeatureValues(stream ImportFeatureValuesRequest) returns (ImportFeatureValuesResponse);

  // Returns a feature value.
  rpc GetFeatureValueImportStatus(GetFeatureValueImportStatusRequest) returns (GetFeatureValueImportStatusResponse);

  // Cancels a feature value.
  rpc CancelFeatureValueImport(CancelFeatureValueImportRequest) returns (CancelFeatureValueImportResponse);

  // Validates a feature value.
  rpc ValidateFeatureValueImport(ValidateFeatureValueImportRequest) returns (ValidateFeatureValueImportResponse);

  // Lists feature values a page at a time.
  rpc ListFeatureValueImports(ListFeatureValueImportsRequest) returns (ListFeatureValueImportsResponse);

  // Retrys a feature value.
  rpc RetryFeatureValueImport(RetryFeatureValueImportRequest) returns (RetryFeatureValueImportResponse);

  // Maps a feature value.
  rpc MapFeatureValueImportColumns(MapFeatureValueImportColumnsRequest) returns (MapFeatureValueImportColumnsResponse);
}

// The request of `ImportFeatureValues`.
message ImportFeatureValuesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportFeatureValuesRequest.StreamHeader header = 2;
    FeatureValue record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportFeatureValues`.
message ImportFeatureValuesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string feature_value_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportFeatureValuesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetFeatureValueImportStatus`.
message GetFeatureValueImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFeatureValueImportStatus`.
message GetFeatureValueImportStatusResponse {
  FeatureValue feature_value = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelFeatureValueImport`.
message CancelFeatureValueImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  CancelFeatureValueImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelFeatureValueImport`.
message CancelFeatureValueImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  CancelFeatureValueImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateFeatureValueImport`.
message ValidateFeatureValueImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  ValidateFeatureValueImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFeatureValueImport`.
message ValidateFeatureValueImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  ValidateFeatureValueImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListFeatureValueImports`.
message ListFeatureValueImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureValueStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFeatureValueImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFeatureValueImports`.
message ListFeatureValueImportsResponse {
  repeated FeatureValue feature_values = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryFeatureValueImport`.
message RetryFeatureValueImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  RetryFeatureValueImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryFeatureValueImport`.
message RetryFeatureValueImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  RetryFeatureValueImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapFeatureValueImportColumns`.
message MapFeatureValueImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  MapFeatureValueImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapFeatureValueImportColumns`.
message MapFeatureValueImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  MapFeatureValueImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
