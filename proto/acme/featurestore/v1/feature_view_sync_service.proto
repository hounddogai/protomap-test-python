syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewSyncServiceProto";
option java_package = "com.acme.featurestore.v1";

// Keeps feature views in step with the systems of record in other regions.
service FeatureViewSyncService {
  // Syncs a feature view.
  rpc SyncFeatureViews(SyncFeatureViewsRequest) returns (SyncFeatureViewsResponse);

  // Pushs a feature view.
  rpc PushFeatureView(PushFeatureViewRequest) returns (PushFeatureViewResponse);

  // Reconciles a feature view.
  rpc ReconcileFeatureViews(ReconcileFeatureViewsRequest) returns (ReconcileFeatureViewsResponse);

  // Exchanges changes of feature views with a peer.
  rpc StreamFeatureViewChanges(stream StreamFeatureViewChangesRequest) returns (stream StreamFeatureViewChangesResponse);

  // Returns a feature view.
  rpc GetFeatureViewSyncState(GetFeatureViewSyncStateRequest) returns (GetFeatureViewSyncStateResponse);

  // Lists feature views a page at a time.
  rpc ListFeatureViewConflicts(ListFeatureViewConflictsRequest) returns (ListFeatureViewConflictsResponse);
}

// The request of `SyncFeatureViews`.
message SyncFeatureViewsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  SyncFeatureViewsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncFeatureViews`.
message SyncFeatureViewsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  SyncFeatureViewsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushFeatureView`.
message PushFeatureViewRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  PushFeatureViewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushFeatureView`.
message PushFeatureViewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  PushFeatureViewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileFeatureViews`.
message ReconcileFeatureViewsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  ReconcileFeatureViewsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileFeatureViews`.
message ReconcileFeatureViewsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  ReconcileFeatureViewsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamFeatureViewChanges`.
message StreamFeatureViewChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    FeatureView change = 2;
    StreamFeatureViewChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamFeatureViewChanges`.
message StreamFeatureViewChangesResponse {
  FeatureView feature_view = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetFeatureViewSyncState`.
message GetFeatureViewSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFeatureViewSyncState`.
message GetFeatureViewSyncStateResponse {
  FeatureView feature_view = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListFeatureViewConflicts`.
message ListFeatureViewConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFeatureViewConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFeatureViewConflicts`.
message ListFeatureViewConflictsResponse {
  repeated FeatureView feature_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
