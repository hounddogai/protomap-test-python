syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureValueWorkflowServiceProto";
option java_package = "com.acme.featurestore.v1";

// Runs the long-lived workflow that takes a feature value from start to finish.
service FeatureValueWorkflowService {
  // Starts a feature value.
  rpc StartFeatureValueWorkflow(StartFeatureValueWorkflowRequest) returns (StartFeatureValueWorkflowResponse);

  // Advances a feature value.
  rpc AdvanceFeatureValueWorkflow(AdvanceFeatureValueWorkflowRequest) returns (AdvanceFeatureValueWorkflowResponse);

  // Cancels a feature value.
  rpc CancelFeatureValueWorkflow(CancelFeatureValueWorkflowRequest) returns (CancelFeatureValueWorkflowResponse);

  // Retrys a feature value.
  rpc RetryFeatureValueWorkflow(RetryFeatureValueWorkflowRequest) returns (RetryFeatureValueWorkflowResponse);

  // Resumes a feature value.
  rpc ResumeFeatureValueWorkflow(ResumeFeatureValueWorkflowRequest) returns (ResumeFeatureValueWorkflowResponse);

  // Returns a feature value.
  rpc InspectFeatureValueWorkflow(InspectFeatureValueWorkflowRequest) returns (InspectFeatureValueWorkflowResponse);

  // Lists feature values a page at a time.
  rpc ListFeatureValueWorkflows(ListFeatureValueWorkflowsRequest) returns (ListFeatureValueWorkflowsResponse);

  // Signals a feature value.
  rpc SignalFeatureValueWorkflow(SignalFeatureValueWorkflowRequest) returns (SignalFeatureValueWorkflowResponse);
}

// The request of `StartFeatureValueWorkflow`.
message StartFeatureValueWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_value_id = 2;
  FeatureValue feature_value = 3;
  StartFeatureValueWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFeatureValueWorkflow`.
message StartFeatureValueWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureValue feature_value = 1;
  StartFeatureValueWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

