syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "EntityReportingServiceProto";
option java_package = "com.acme.featurestore.v1";

// Builds and schedules reports about entities.
service EntityReportingService {
  // Generates an entity.
  rpc GenerateEntityReport(GenerateEntityReportRequest) returns (GenerateEntityReportResponse);

  // Returns an entity.
  rpc FetchEntityReport(FetchEntityReportRequest) returns (FetchEntityReportResponse);

  // Schedules an entity.
  rpc ScheduleEntityReport(ScheduleEntityReportRequest) returns (ScheduleEntityReportResponse);

  // Streams the changes of entities as they happen.
  rpc StreamEntityMetrics(StreamEntityMetricsRequest) returns (stream StreamEntityMetricsResponse);

  // Lists entities a page at a time.
  rpc ListEntityReports(ListEntityReportsRequest) returns (ListEntityReportsResponse);

  // Shares an entity.
  rpc ShareEntityReport(ShareEntityReportRequest) returns (ShareEntityReportResponse);

  // Counts entities by status.
  rpc CountEntityTotals(CountEntityTotalsRequest) returns (CountEntityTotalsResponse);

  // Deletes an entity.
  rpc DeleteEntityReport(DeleteEntityReportRequest) returns (DeleteEntityReportResponse);
}

// The request of `GenerateEntityReport`.
message GenerateEntityReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  GenerateEntityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateEntityReport`.
message GenerateEntityReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchEntityReport`.
message FetchEntityReportRequest {
  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchEntityReport`.
message FetchEntityReportResponse {
  Entity entity = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleEntityReport`.
message ScheduleEntityReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  ScheduleEntityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleEntityReport`.
message ScheduleEntityReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamEntityMetrics`.
message StreamEntityMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EntityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamEntityMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamEntityMetrics`.
message StreamEntityMetricsResponse {
  Entity entity = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListEntityReports`.
message ListEntityReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EntityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEntityReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEntityReports`.
message ListEntityReportsResponse {
  repeated Entity entities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareEntityReport`.
message ShareEntityReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  ShareEntityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareEntityReport`.
message ShareEntityReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Entity entity = 1;
  ShareEntityReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEntityTotals`.
message CountEntityTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EntityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEntityTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEntityTotals`.
message CountEntityTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteEntityReport`.
message DeleteEntityReportRequest {
  acme.common.v1.RequestContext context = 1;
  string entity_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteEntityReport`.
message DeleteEntityReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
