syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewReportingServiceProto";
option java_package = "com.acme.featurestore.v1";

// Builds and schedules reports about feature views.
service FeatureViewReportingService {
  // Generates a feature view.
  rpc GenerateFeatureViewReport(GenerateFeatureViewReportRequest) returns (GenerateFeatureViewReportResponse);

  // Returns a feature view.
  rpc FetchFeatureViewReport(FetchFeatureViewReportRequest) returns (FetchFeatureViewReportResponse);

  // Schedules a feature view.
  rpc ScheduleFeatureViewReport(ScheduleFeatureViewReportRequest) returns (ScheduleFeatureViewReportResponse);

  // Streams the changes of feature views as they happen.
  rpc StreamFeatureViewMetrics(StreamFeatureViewMetricsRequest) returns (stream StreamFeatureViewMetricsResponse);

  // Lists feature views a page at a time.
  rpc ListFeatureViewReports(ListFeatureViewReportsRequest) returns (ListFeatureViewReportsResponse);

  // Shares a feature view.
  rpc ShareFeatureViewReport(ShareFeatureViewReportRequest) returns (ShareFeatureViewReportResponse);

  // Counts feature views by status.
  rpc CountFeatureViewTotals(CountFeatureViewTotalsRequest) returns (CountFeatureViewTotalsResponse);

  // Deletes a feature view.
  rpc DeleteFeatureViewReport(DeleteFeatureViewReportRequest) returns (DeleteFeatureViewReportResponse);
}

// The request of `GenerateFeatureViewReport`.
message GenerateFeatureViewReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  GenerateFeatureViewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateFeatureViewReport`.
message GenerateFeatureViewReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchFeatureViewReport`.
message FetchFeatureViewReportRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchFeatureViewReport`.
message FetchFeatureViewReportResponse {
  FeatureView feature_view = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleFeatureViewReport`.
message ScheduleFeatureViewReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  ScheduleFeatureViewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleFeatureViewReport`.
message ScheduleFeatureViewReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamFeatureViewMetrics`.
message StreamFeatureViewMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFeatureViewMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamFeatureViewMetrics`.
message StreamFeatureViewMetricsResponse {
  FeatureView feature_view = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListFeatureViewReports`.
message ListFeatureViewReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFeatureViewReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFeatureViewReports`.
message ListFeatureViewReportsResponse {
  repeated FeatureView feature_views = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareFeatureViewReport`.
message ShareFeatureViewReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  ShareFeatureViewReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareFeatureViewReport`.
message ShareFeatureViewReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  ShareFeatureViewReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFeatureViewTotals`.
message CountFeatureViewTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FeatureViewStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFeatureViewTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFeatureViewTotals`.
message CountFeatureViewTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteFeatureViewReport`.
message DeleteFeatureViewReportRequest {
  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteFeatureViewReport`.
message DeleteFeatureViewReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
