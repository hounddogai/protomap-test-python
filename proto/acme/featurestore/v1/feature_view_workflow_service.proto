syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewWorkflowServiceProto";
option java_package = "com.acme.featurestore.v1";

// Runs the long-lived workflow that takes a feature view from start to finish.
service FeatureViewWorkflowService {
  // Starts a feature view.
  rpc StartFeatureViewWorkflow(StartFeatureViewWorkflowRequest) returns (StartFeatureViewWorkflowResponse);

  // Advances a feature view.
  rpc AdvanceFeatureViewWorkflow(AdvanceFeatureViewWorkflowRequest) returns (AdvanceFeatureViewWorkflowResponse);

  // Cancels a feature view.
  rpc CancelFeatureViewWorkflow(CancelFeatureViewWorkflowRequest) returns (CancelFeatureViewWorkflowResponse);

  // Retrys a feature view.
  rpc RetryFeatureViewWorkflow(RetryFeatureViewWorkflowRequest) returns (RetryFeatureViewWorkflowResponse);

  // Pauses a feature view.
  rpc PauseFeatureViewWorkflow(PauseFeatureViewWorkflowRequest) returns (PauseFeatureViewWorkflowResponse);

  // Resumes a feature view.
  rpc ResumeFeatureViewWorkflow(ResumeFeatureViewWorkflowRequest) returns (ResumeFeatureViewWorkflowResponse);

  // Lists feature views a page at a time.
  rpc ListFeatureViewWorkflows(ListFeatureViewWorkflowsRequest) returns (ListFeatureViewWorkflowsResponse);

  // Signals a feature view.
  rpc SignalFeatureViewWorkflow(SignalFeatureViewWorkflowRequest) returns (SignalFeatureViewWorkflowResponse);
}

// The request of `StartFeatureViewWorkflow`.
message StartFeatureViewWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  StartFeatureViewWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFeatureViewWorkflow`.
message StartFeatureViewWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  StartFeatureViewWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

