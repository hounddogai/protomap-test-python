syntax = "proto3";

package acme.featurestore.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/featurestore/v1/featurestore.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Featurestore.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/featurestore/v1;featurestorev1";
option java_multiple_files = true;
option java_outer_classname = "FeatureViewValidationServiceProto";
option java_package = "com.acme.featurestore.v1";

// Checks feature views against the rules before anything acts on them.
service FeatureViewValidationService {
  // Validates a feature view.
  rpc ValidateFeatureView(ValidateFeatureViewRequest) returns (ValidateFeatureViewResponse);

  // Previews a feature view.
  rpc PreviewFeatureView(PreviewFeatureViewRequest) returns (PreviewFeatureViewResponse);

  // Checks a feature view.
  rpc CheckFeatureViewEligibility(CheckFeatureViewEligibilityRequest) returns (CheckFeatureViewEligibilityResponse);

  // Explains a feature view.
  rpc ExplainFeatureViewDecision(ExplainFeatureViewDecisionRequest) returns (ExplainFeatureViewDecisionResponse);

  // Scores a feature view.
  rpc ScoreFeatureView(ScoreFeatureViewRequest) returns (ScoreFeatureViewResponse);

  // Returns a feature view.
  rpc GetFeatureViewRules(GetFeatureViewRulesRequest) returns (GetFeatureViewRulesResponse);
}

// The request of `ValidateFeatureView`.
message ValidateFeatureViewRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string feature_view_id = 2;
  FeatureView feature_view = 3;
  ValidateFeatureViewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFeatureView`.
message ValidateFeatureViewResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FeatureView feature_view = 1;
  ValidateFeatureViewResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

