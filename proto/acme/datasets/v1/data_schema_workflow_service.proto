syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DataSchemaWorkflowServiceProto";
option java_package = "com.acme.datasets.v1";

// Runs the long-lived workflow that takes a data schema from start to finish.
service DataSchemaWorkflowService {
  // Starts a data schema.
  rpc StartDataSchemaWorkflow(StartDataSchemaWorkflowRequest) returns (StartDataSchemaWorkflowResponse);

  // Advances a data schema.
  rpc AdvanceDataSchemaWorkflow(AdvanceDataSchemaWorkflowRequest) returns (AdvanceDataSchemaWorkflowResponse);

  // Cancels a data schema.
  rpc CancelDataSchemaWorkflow(CancelDataSchemaWorkflowRequest) returns (CancelDataSchemaWorkflowResponse);

  // Retrys a data schema.
  rpc RetryDataSchemaWorkflow(RetryDataSchemaWorkflowRequest) returns (RetryDataSchemaWorkflowResponse);

  // Resumes a data schema.
  rpc ResumeDataSchemaWorkflow(ResumeDataSchemaWorkflowRequest) returns (ResumeDataSchemaWorkflowResponse);

  // Returns a data schema.
  rpc InspectDataSchemaWorkflow(InspectDataSchemaWorkflowRequest) returns (InspectDataSchemaWorkflowResponse);
}

// The request of `StartDataSchemaWorkflow`.
message StartDataSchemaWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_schema_id = 2;
  DataSchema data_schema = 3;
  StartDataSchemaWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDataSchemaWorkflow`.
message StartDataSchemaWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataSchema data_schema = 1;
  StartDataSchemaWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

