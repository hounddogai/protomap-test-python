syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DataSchemaCalculationServiceProto";
option java_package = "com.acme.datasets.v1";

// Computes the figures of a data schema, such as totals, taxes, and estimates.
service DataSchemaCalculationService {
  // Calculates a data schema.
  rpc CalculateDataSchema(CalculateDataSchemaRequest) returns (CalculateDataSchemaResponse);

  // Estimates a data schema.
  rpc EstimateDataSchema(EstimateDataSchemaRequest) returns (EstimateDataSchemaResponse);

  // Quotes a data schema.
  rpc QuoteDataSchema(QuoteDataSchemaRequest) returns (QuoteDataSchemaResponse);

  // Compares a data schema.
  rpc CompareDataSchemaOptions(CompareDataSchemaOptionsRequest) returns (CompareDataSchemaOptionsResponse);

  // Recalculates a data schema.
  rpc RecalculateDataSchemas(RecalculateDataSchemasRequest) returns (RecalculateDataSchemasResponse);

  // Explains a data schema.
  rpc ExplainDataSchemaCalculation(ExplainDataSchemaCalculationRequest) returns (ExplainDataSchemaCalculationResponse);

  // Returns a data schema.
  rpc GetDataSchemaRates(GetDataSchemaRatesRequest) returns (GetDataSchemaRatesResponse);
}

// The request of `CalculateDataSchema`.
message CalculateDataSchemaRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_schema_id = 2;
  DataSchema data_schema = 3;
  CalculateDataSchemaRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDataSchema`.
message CalculateDataSchemaResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDataSchemaResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  DataSchema data_schema = 1;
  CalculateDataSchemaResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

