syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DatasetValidationServiceProto";
option java_package = "com.acme.datasets.v1";

// Checks datasets against the rules before anything acts on them.
service DatasetValidationService {
  // Validates a dataset.
  rpc ValidateDataset(ValidateDatasetRequest) returns (ValidateDatasetResponse);

  // Previews a dataset.
  rpc PreviewDataset(PreviewDatasetRequest) returns (PreviewDatasetResponse);

  // Checks a dataset.
  rpc CheckDatasetEligibility(CheckDatasetEligibilityRequest) returns (CheckDatasetEligibilityResponse);

  // Normalizes a dataset.
  rpc NormalizeDataset(NormalizeDatasetRequest) returns (NormalizeDatasetResponse);

  // Explains a dataset.
  rpc ExplainDatasetDecision(ExplainDatasetDecisionRequest) returns (ExplainDatasetDecisionResponse);

  // Scores a dataset.
  rpc ScoreDataset(ScoreDatasetRequest) returns (ScoreDatasetResponse);

  // Lints a dataset.
  rpc LintDatasets(LintDatasetsRequest) returns (LintDatasetsResponse);

  // Returns a dataset.
  rpc GetDatasetRules(GetDatasetRulesRequest) returns (GetDatasetRulesResponse);
}

// The request of `ValidateDataset`.
message ValidateDatasetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dataset_id = 2;
  Dataset dataset = 3;
  ValidateDatasetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDataset`.
message ValidateDatasetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dataset dataset = 1;
  ValidateDatasetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

