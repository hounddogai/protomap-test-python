syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DatasetVersionValidationServiceProto";
option java_package = "com.acme.datasets.v1";

// Checks dataset versions against the rules before anything acts on them.
service DatasetVersionValidationService {
  // Validates a dataset version.
  rpc ValidateDatasetVersion(ValidateDatasetVersionRequest) returns (ValidateDatasetVersionResponse);

  // Previews a dataset version.
  rpc PreviewDatasetVersion(PreviewDatasetVersionRequest) returns (PreviewDatasetVersionResponse);

  // Checks a dataset version.
  rpc CheckDatasetVersionEligibility(CheckDatasetVersionEligibilityRequest) returns (CheckDatasetVersionEligibilityResponse);

  // Normalizes a dataset version.
  rpc NormalizeDatasetVersion(NormalizeDatasetVersionRequest) returns (NormalizeDatasetVersionResponse);

  // Explains a dataset version.
  rpc ExplainDatasetVersionDecision(ExplainDatasetVersionDecisionRequest) returns (ExplainDatasetVersionDecisionResponse);

  // Scores a dataset version.
  rpc ScoreDatasetVersion(ScoreDatasetVersionRequest) returns (ScoreDatasetVersionResponse);

  // Lints a dataset version.
  rpc LintDatasetVersions(LintDatasetVersionsRequest) returns (LintDatasetVersionsResponse);

  // Returns a dataset version.
  rpc GetDatasetVersionRules(GetDatasetVersionRulesRequest) returns (GetDatasetVersionRulesResponse);
}

// The request of `ValidateDatasetVersion`.
message ValidateDatasetVersionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dataset_version_id = 2;
  DatasetVersion dataset_version = 3;
  ValidateDatasetVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDatasetVersion`.
message ValidateDatasetVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DatasetVersion dataset_version = 1;
  ValidateDatasetVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

