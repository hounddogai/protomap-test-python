syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DataSchemaValidationServiceProto";
option java_package = "com.acme.datasets.v1";

// Checks data schemas against the rules before anything acts on them.
service DataSchemaValidationService {
  // Validates a data schema.
  rpc ValidateDataSchema(ValidateDataSchemaRequest) returns (ValidateDataSchemaResponse);

  // Previews a data schema.
  rpc PreviewDataSchema(PreviewDataSchemaRequest) returns (PreviewDataSchemaResponse);

  // Checks a data schema.
  rpc CheckDataSchemaEligibility(CheckDataSchemaEligibilityRequest) returns (CheckDataSchemaEligibilityResponse);

  // Explains a data schema.
  rpc ExplainDataSchemaDecision(ExplainDataSchemaDecisionRequest) returns (ExplainDataSchemaDecisionResponse);

  // Scores a data schema.
  rpc ScoreDataSchema(ScoreDataSchemaRequest) returns (ScoreDataSchemaResponse);

  // Returns a data schema.
  rpc GetDataSchemaRules(GetDataSchemaRulesRequest) returns (GetDataSchemaRulesResponse);
}

// The request of `ValidateDataSchema`.
message ValidateDataSchemaRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string data_schema_id = 2;
  DataSchema data_schema = 3;
  ValidateDataSchemaRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDataSchema`.
message ValidateDataSchemaResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataSchema data_schema = 1;
  ValidateDataSchemaResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewDataSchema`.
message PreviewDataSchemaRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
