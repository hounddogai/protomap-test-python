syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datasets/v1/datasets.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DatasetApprovalServiceProto";
option java_package = "com.acme.datasets.v1";

// Routes datasets through approval, with escalation and delegation.
service DatasetApprovalService {
  // Submits a dataset.
  rpc SubmitDataset(SubmitDatasetRequest) returns (SubmitDatasetResponse);

  // Approves a dataset.
  rpc ApproveDataset(ApproveDatasetRequest) returns (ApproveDatasetResponse);

  // Rejects a dataset.
  rpc RejectDataset(RejectDatasetRequest) returns (RejectDatasetResponse);

  // Escalates a dataset.
  rpc EscalateDataset(EscalateDatasetRequest) returns (EscalateDatasetResponse);

  // Lists datasets a page at a time.
  rpc ListPendingDatasets(ListPendingDatasetsRequest) returns (ListPendingDatasetsResponse);

  // Delegates a dataset.
  rpc DelegateDatasetApproval(DelegateDatasetApprovalRequest) returns (DelegateDatasetApprovalResponse);

  // Recalls a dataset.
  rpc RecallDataset(RecallDatasetRequest) returns (RecallDatasetResponse);

  // Returns a dataset.
  rpc GetDatasetApprovalStatus(GetDatasetApprovalStatusRequest) returns (GetDatasetApprovalStatusResponse);

  // Comments a dataset.
  rpc CommentDatasetApproval(CommentDatasetApprovalRequest) returns (CommentDatasetApprovalResponse);
}

// The request of `SubmitDataset`.
message SubmitDatasetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dataset_id = 2;
  Dataset dataset = 3;
  SubmitDatasetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDataset`.
message SubmitDatasetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dataset dataset = 1;
  SubmitDatasetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

