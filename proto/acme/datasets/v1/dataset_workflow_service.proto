syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datasets/v1/datasets.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DatasetWorkflowServiceProto";
option java_package = "com.acme.datasets.v1";

// Runs the long-lived workflow that takes a dataset from start to finish.
service DatasetWorkflowService {
  // Starts a dataset.
  rpc StartDatasetWorkflow(StartDatasetWorkflowRequest) returns (StartDatasetWorkflowResponse);

  // Advances a dataset.
  rpc AdvanceDatasetWorkflow(AdvanceDatasetWorkflowRequest) returns (AdvanceDatasetWorkflowResponse);

  // Cancels a dataset.
  rpc CancelDatasetWorkflow(CancelDatasetWorkflowRequest) returns (CancelDatasetWorkflowResponse);

  // Pauses a dataset.
  rpc PauseDatasetWorkflow(PauseDatasetWorkflowRequest) returns (PauseDatasetWorkflowResponse);

  // Resumes a dataset.
  rpc ResumeDatasetWorkflow(ResumeDatasetWorkflowRequest) returns (ResumeDatasetWorkflowResponse);

  // Returns a dataset.
  rpc InspectDatasetWorkflow(InspectDatasetWorkflowRequest) returns (InspectDatasetWorkflowResponse);

  // Lists datasets a page at a time.
  rpc ListDatasetWorkflows(ListDatasetWorkflowsRequest) returns (ListDatasetWorkflowsResponse);

  // Signals a dataset.
  rpc SignalDatasetWorkflow(SignalDatasetWorkflowRequest) returns (SignalDatasetWorkflowResponse);
}

// The request of `StartDatasetWorkflow`.
message StartDatasetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dataset_id = 2;
  Dataset dataset = 3;
  StartDatasetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDatasetWorkflow`.
message StartDatasetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dataset dataset = 1;
  StartDatasetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

