syntax = "proto3";

package acme.datasets.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datasets/v1/datasets.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datasets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datasets/v1;datasetsv1";
option java_multiple_files = true;
option java_outer_classname = "DataSchemaApprovalServiceProto";
option java_package = "com.acme.datasets.v1";

// Routes data schemas through approval, with escalation and delegation.
service DataSchemaApprovalService {
  // Submits a data schema.
  rpc SubmitDataSchema(SubmitDataSchemaRequest) returns (SubmitDataSchemaResponse);

  // Approves a data schema.
  rpc ApproveDataSchema(ApproveDataSchemaRequest) returns (ApproveDataSchemaResponse);

  // Rejects a data schema.
  rpc RejectDataSchema(RejectDataSchemaRequest) returns (RejectDataSchemaResponse);

  // Escalates a data schema.
  rpc EscalateDataSchema(EscalateDataSchemaRequest) returns (EscalateDataSchemaResponse);

  // Lists data schemas a page at a time.
  rpc ListPendingDataSchemas(ListPendingDataSchemasRequest) returns (ListPendingDataSchemasResponse);

  // Delegates a data schema.
  rpc DelegateDataSchemaApproval(DelegateDataSchemaApprovalRequest) returns (DelegateDataSchemaApprovalResponse);

  // Recalls a data schema.
  rpc RecallDataSchema(RecallDataSchemaRequest) returns (RecallDataSchemaResponse);

  // Returns a data schema.
  rpc GetDataSchemaApprovalStatus(GetDataSchemaApprovalStatusRequest) returns (GetDataSchemaApprovalStatusResponse);

  // Comments a data schema.
  rpc CommentDataSchemaApproval(CommentDataSchemaApprovalRequest) returns (CommentDataSchemaApprovalResponse);
}

// The request of `SubmitDataSchema`.
message SubmitDataSchemaRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_schema_id = 2;
  DataSchema data_schema = 3;
  SubmitDataSchemaRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDataSchema`.
message SubmitDataSchemaResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataSchema data_schema = 1;
  SubmitDataSchemaResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

