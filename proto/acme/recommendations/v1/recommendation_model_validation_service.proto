syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationModelValidationServiceProto";
option java_package = "com.acme.recommendations.v1";

// Checks recommendation models against the rules before anything acts on them.
service RecommendationModelValidationService {
  // Validates a recommendation model.
  rpc ValidateRecommendationModel(ValidateRecommendationModelRequest) returns (ValidateRecommendationModelResponse);

  // Previews a recommendation model.
  rpc PreviewRecommendationModel(PreviewRecommendationModelRequest) returns (PreviewRecommendationModelResponse);

  // Checks a recommendation model.
  rpc CheckRecommendationModelEligibility(CheckRecommendationModelEligibilityRequest) returns (CheckRecommendationModelEligibilityResponse);

  // Normalizes a recommendation model.
  rpc NormalizeRecommendationModel(NormalizeRecommendationModelRequest) returns (NormalizeRecommendationModelResponse);

  // Explains a recommendation model.
  rpc ExplainRecommendationModelDecision(ExplainRecommendationModelDecisionRequest) returns (ExplainRecommendationModelDecisionResponse);

  // Scores a recommendation model.
  rpc ScoreRecommendationModel(ScoreRecommendationModelRequest) returns (ScoreRecommendationModelResponse);

  // Returns a recommendation model.
  rpc GetRecommendationModelRules(GetRecommendationModelRulesRequest) returns (GetRecommendationModelRulesResponse);
}

// The request of `ValidateRecommendationModel`.
message ValidateRecommendationModelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_model_id = 2;
  RecommendationModel recommendation_model = 3;
  ValidateRecommendationModelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRecommendationModel`.
message ValidateRecommendationModelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationModel recommendation_model = 1;
  ValidateRecommendationModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

