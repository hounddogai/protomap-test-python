syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "InteractionCalculationServiceProto";
option java_package = "com.acme.recommendations.v1";

// Computes the figures of an interaction, such as totals, taxes, and estimates.
service InteractionCalculationService {
  // Calculates an interaction.
  rpc CalculateInteraction(CalculateInteractionRequest) returns (CalculateInteractionResponse);

  // Estimates an interaction.
  rpc EstimateInteraction(EstimateInteractionRequest) returns (EstimateInteractionResponse);

  // Quotes an interaction.
  rpc QuoteInteraction(QuoteInteractionRequest) returns (QuoteInteractionResponse);

  // Compares an interaction.
  rpc CompareInteractionOptions(CompareInteractionOptionsRequest) returns (CompareInteractionOptionsResponse);

  // Recalculates an interaction.
  rpc RecalculateInteractions(RecalculateInteractionsRequest) returns (RecalculateInteractionsResponse);

  // Simulates an interaction.
  rpc SimulateInteraction(SimulateInteractionRequest) returns (SimulateInteractionResponse);

  // Explains an interaction.
  rpc ExplainInteractionCalculation(ExplainInteractionCalculationRequest) returns (ExplainInteractionCalculationResponse);

  // Returns an interaction.
  rpc GetInteractionRates(GetInteractionRatesRequest) returns (GetInteractionRatesResponse);
}

// The request of `CalculateInteraction`.
message CalculateInteractionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interaction_id = 2;
  Interaction interaction = 3;
  CalculateInteractionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateInteraction`.
message CalculateInteractionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateInteractionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Interaction interaction = 1;
  CalculateInteractionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

