syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "InteractionLifecycleServiceProto";
option java_package = "com.acme.recommendations.v1";

// Moves an interaction between the states of its lifecycle.
service InteractionLifecycleService {
  // Activates an interaction.
  rpc ActivateInteraction(ActivateInteractionRequest) returns (ActivateInteractionResponse);

  // Suspends an interaction.
  rpc SuspendInteraction(SuspendInteractionRequest) returns (SuspendInteractionResponse);

  // Reinstates an interaction.
  rpc ReinstateInteraction(ReinstateInteractionRequest) returns (ReinstateInteractionResponse);

  // Terminates an interaction.
  rpc TerminateInteraction(TerminateInteractionRequest) returns (TerminateInteractionResponse);

  // Renews an interaction.
  rpc RenewInteraction(RenewInteractionRequest) returns (RenewInteractionResponse);

  // Expires an interaction.
  rpc ExpireInteraction(ExpireInteractionRequest) returns (ExpireInteractionResponse);

  // Returns an interaction.
  rpc GetInteractionLifecycle(GetInteractionLifecycleRequest) returns (GetInteractionLifecycleResponse);

  // Schedules an interaction.
  rpc ScheduleInteractionExpiry(ScheduleInteractionExpiryRequest) returns (ScheduleInteractionExpiryResponse);
}

// The request of `ActivateInteraction`.
message ActivateInteractionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string interaction_id = 2;
  ActivateInteractionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateInteraction`.
message ActivateInteractionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interaction interaction = 1;
  ActivateInteractionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

