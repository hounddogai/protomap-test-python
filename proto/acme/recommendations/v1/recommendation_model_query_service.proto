syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationModelQueryServiceProto";
option java_package = "com.acme.recommendations.v1";

// Answers read-only questions about recommendation models, for screens and reports.
service RecommendationModelQueryService {
  // Returns a recommendation model.
  rpc LookupRecommendationModel(LookupRecommendationModelRequest) returns (LookupRecommendationModelResponse);

  // Lists recommendation models a page at a time.
  rpc BrowseRecommendationModels(BrowseRecommendationModelsRequest) returns (BrowseRecommendationModelsResponse);

  // Lists recommendation models a page at a time.
  rpc FindRecommendationModels(FindRecommendationModelsRequest) returns (FindRecommendationModelsResponse);

  // Counts recommendation models by status.
  rpc CountRecommendationModels(CountRecommendationModelsRequest) returns (CountRecommendationModelsResponse);

  // Streams every matching recommendation model.
  rpc ExportRecommendationModels(ExportRecommendationModelsRequest) returns (stream ExportRecommendationModelsResponse);

  // Lists recommendation models a page at a time.
  rpc SuggestRecommendationModels(SuggestRecommendationModelsRequest) returns (SuggestRecommendationModelsResponse);

  // Returns a recommendation model.
  rpc PeekRecommendationModel(PeekRecommendationModelRequest) returns (PeekRecommendationModelResponse);
}

// The request of `LookupRecommendationModel`.
message LookupRecommendationModelRequest {
  acme.common.v1.RequestContext context = 1;
  string recommendation_model_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRecommendationModel`.
message LookupRecommendationModelResponse {
  RecommendationModel recommendation_model = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRecommendationModels`.
message BrowseRecommendationModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRecommendationModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRecommendationModels`.
message BrowseRecommendationModelsResponse {
  repeated RecommendationModel recommendation_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindRecommendationModels`.
message FindRecommendationModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindRecommendationModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindRecommendationModels`.
message FindRecommendationModelsResponse {
  repeated RecommendationModel recommendation_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRecommendationModels`.
message CountRecommendationModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRecommendationModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRecommendationModels`.
message CountRecommendationModelsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportRecommendationModels`.
message ExportRecommendationModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportRecommendationModelsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportRecommendationModels`.
message ExportRecommendationModelsResponse {
  RecommendationModel recommendation_model = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestRecommendationModels`.
message SuggestRecommendationModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestRecommendationModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestRecommendationModels`.
message SuggestRecommendationModelsResponse {
  repeated RecommendationModel recommendation_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekRecommendationModel`.
message PeekRecommendationModelRequest {
  acme.common.v1.RequestContext context = 1;
  string recommendation_model_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRecommendationModel`.
message PeekRecommendationModelResponse {
  RecommendationModel recommendation_model = 1;
  acme.common.v1.OperationResult result = 2;
}
