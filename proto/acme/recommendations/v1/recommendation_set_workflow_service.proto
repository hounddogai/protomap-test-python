option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationSetWorkflowServiceProto";
option java_package = "com.acme.recommendations.v1";

// Runs the long-lived workflow that takes a recommendation set from start to finish.
service RecommendationSetWorkflowService {
  // Starts a recommendation set.
  rpc StartRecommendationSetWorkflow(StartRecommendationSetWorkflowRequest) returns (StartRecommendationSetWorkflowResponse);

  // Advances a recommendation set.
  rpc AdvanceRecommendationSetWorkflow(AdvanceRecommendationSetWorkflowRequest) returns (AdvanceRecommendationSetWorkflowResponse);

  // Cancels a recommendation set.
  rpc CancelRecommendationSetWorkflow(CancelRecommendationSetWorkflowRequest) returns (CancelRecommendationSetWorkflowResponse);

  // Retrys a recommendation set.
  rpc RetryRecommendationSetWorkflow(RetryRecommendationSetWorkflowRequest) returns (RetryRecommendationSetWorkflowResponse);

  // Resumes a recommendation set.
  rpc ResumeRecommendationSetWorkflow(ResumeRecommendationSetWorkflowRequest) returns (ResumeRecommendationSetWorkflowResponse);

  // Returns a recommendation set.
  rpc InspectRecommendationSetWorkflow(InspectRecommendationSetWorkflowRequest) returns (InspectRecommendationSetWorkflowResponse);

  // Lists recommendation sets a page at a time.
  rpc ListRecommendationSetWorkflows(ListRecommendationSetWorkflowsRequest) returns (ListRecommendationSetWorkflowsResponse);

  // Signals a recommendation set.
  rpc SignalRecommendationSetWorkflow(SignalRecommendationSetWorkflowRequest) returns (SignalRecommendationSetWorkflowResponse);
}

// The request of `StartRecommendationSetWorkflow`.
message StartRecommendationSetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  StartRecommendationSetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRecommendationSetWorkflow`.
message StartRecommendationSetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  StartRecommendationSetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

