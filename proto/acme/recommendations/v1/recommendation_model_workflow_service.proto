syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationModelWorkflowServiceProto";
option java_package = "com.acme.recommendations.v1";

// Runs the long-lived workflow that takes a recommendation model from start to finish.
service RecommendationModelWorkflowService {
  // Starts a recommendation model.
  rpc StartRecommendationModelWorkflow(StartRecommendationModelWorkflowRequest) returns (StartRecommendationModelWorkflowResponse);

  // Advances a recommendation model.
  rpc AdvanceRecommendationModelWorkflow(AdvanceRecommendationModelWorkflowRequest) returns (AdvanceRecommendationModelWorkflowResponse);

  // Cancels a recommendation model.
  rpc CancelRecommendationModelWorkflow(CancelRecommendationModelWorkflowRequest) returns (CancelRecommendationModelWorkflowResponse);

  // Retrys a recommendation model.
  rpc RetryRecommendationModelWorkflow(RetryRecommendationModelWorkflowRequest) returns (RetryRecommendationModelWorkflowResponse);

  // Pauses a recommendation model.
  rpc PauseRecommendationModelWorkflow(PauseRecommendationModelWorkflowRequest) returns (PauseRecommendationModelWorkflowResponse);

  // Resumes a recommendation model.
  rpc ResumeRecommendationModelWorkflow(ResumeRecommendationModelWorkflowRequest) returns (ResumeRecommendationModelWorkflowResponse);

  // Returns a recommendation model.
  rpc InspectRecommendationModelWorkflow(InspectRecommendationModelWorkflowRequest) returns (InspectRecommendationModelWorkflowResponse);

  // Lists recommendation models a page at a time.
  rpc ListRecommendationModelWorkflows(ListRecommendationModelWorkflowsRequest) returns (ListRecommendationModelWorkflowsResponse);

  // Signals a recommendation model.
  rpc SignalRecommendationModelWorkflow(SignalRecommendationModelWorkflowRequest) returns (SignalRecommendationModelWorkflowResponse);
}

// The request of `StartRecommendationModelWorkflow`.
message StartRecommendationModelWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_model_id = 2;
  RecommendationModel recommendation_model = 3;
  StartRecommendationModelWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRecommendationModelWorkflow`.
message StartRecommendationModelWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationModel recommendation_model = 1;
  StartRecommendationModelWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

