syntax = "proto3";

package acme.recommendations.v1;

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.recommendations.v1";

// A reference to a recommendation set of the recommendations domain.
message RecommendationSetRef {
  string recommendation_set_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a recommendation model of the recommendations domain.
message RecommendationModelRef {
  string recommendation_model_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to an interaction of the recommendations domain.
message InteractionRef {
  string interaction_id = 1;
  string display_name = 2;
  string kind = 3;
}
