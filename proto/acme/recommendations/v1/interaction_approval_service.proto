    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interaction interaction = 1;
  ApproveInteractionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingInteractions`.
message ListPendingInteractionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InteractionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingInteractionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingInteractions`.
message ListPendingInteractionsResponse {
  repeated Interaction interactions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

