syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "InteractionApprovalServiceProto";
option java_package = "com.acme.recommendations.v1";

// Routes interactions through approval, with escalation and delegation.
service InteractionApprovalService {
  // Submits an interaction.
  rpc SubmitInteraction(SubmitInteractionRequest) returns (SubmitInteractionResponse);

  // Approves an interaction.
  rpc ApproveInteraction(ApproveInteractionRequest) returns (ApproveInteractionResponse);

  // Lists interactions a page at a time.
  rpc ListPendingInteractions(ListPendingInteractionsRequest) returns (ListPendingInteractionsResponse);

  // Delegates an interaction.
  rpc DelegateInteractionApproval(DelegateInteractionApprovalRequest) returns (DelegateInteractionApprovalResponse);

  // Recalls an interaction.
  rpc RecallInteraction(RecallInteractionRequest) returns (RecallInteractionResponse);

  // Returns an interaction.
  rpc GetInteractionApprovalStatus(GetInteractionApprovalStatusRequest) returns (GetInteractionApprovalStatusResponse);

  // Comments an interaction.
  rpc CommentInteractionApproval(CommentInteractionApprovalRequest) returns (CommentInteractionApprovalResponse);
}

// The request of `SubmitInteraction`.
message SubmitInteractionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string interaction_id = 2;
  Interaction interaction = 3;
  SubmitInteractionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInteraction`.
message SubmitInteractionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interaction interaction = 1;
  SubmitInteractionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveInteraction`.
message ApproveInteractionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
