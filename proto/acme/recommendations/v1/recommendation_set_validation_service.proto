syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationSetValidationServiceProto";
option java_package = "com.acme.recommendations.v1";

// Checks recommendation sets against the rules before anything acts on them.
service RecommendationSetValidationService {
  // Validates a recommendation set.
  rpc ValidateRecommendationSet(ValidateRecommendationSetRequest) returns (ValidateRecommendationSetResponse);

  // Previews a recommendation set.
  rpc PreviewRecommendationSet(PreviewRecommendationSetRequest) returns (PreviewRecommendationSetResponse);

  // Checks a recommendation set.
  rpc CheckRecommendationSetEligibility(CheckRecommendationSetEligibilityRequest) returns (CheckRecommendationSetEligibilityResponse);

  // Normalizes a recommendation set.
  rpc NormalizeRecommendationSet(NormalizeRecommendationSetRequest) returns (NormalizeRecommendationSetResponse);

  // Explains a recommendation set.
  rpc ExplainRecommendationSetDecision(ExplainRecommendationSetDecisionRequest) returns (ExplainRecommendationSetDecisionResponse);

  // Scores a recommendation set.
  rpc ScoreRecommendationSet(ScoreRecommendationSetRequest) returns (ScoreRecommendationSetResponse);

  // Lints a recommendation set.
  rpc LintRecommendationSets(LintRecommendationSetsRequest) returns (LintRecommendationSetsResponse);

  // Returns a recommendation set.
  rpc GetRecommendationSetRules(GetRecommendationSetRulesRequest) returns (GetRecommendationSetRulesResponse);
}

// The request of `ValidateRecommendationSet`.
message ValidateRecommendationSetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  ValidateRecommendationSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRecommendationSet`.
message ValidateRecommendationSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  ValidateRecommendationSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

