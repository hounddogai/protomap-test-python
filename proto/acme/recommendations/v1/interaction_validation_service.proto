syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "InteractionValidationServiceProto";
option java_package = "com.acme.recommendations.v1";

// Checks interactions against the rules before anything acts on them.
service InteractionValidationService {
  // Validates an interaction.
  rpc ValidateInteraction(ValidateInteractionRequest) returns (ValidateInteractionResponse);

  // Previews an interaction.
  rpc PreviewInteraction(PreviewInteractionRequest) returns (PreviewInteractionResponse);

  // Checks an interaction.
  rpc CheckInteractionEligibility(CheckInteractionEligibilityRequest) returns (CheckInteractionEligibilityResponse);

  // Normalizes an interaction.
  rpc NormalizeInteraction(NormalizeInteractionRequest) returns (NormalizeInteractionResponse);

  // Explains an interaction.
  rpc ExplainInteractionDecision(ExplainInteractionDecisionRequest) returns (ExplainInteractionDecisionResponse);

  // Scores an interaction.
  rpc ScoreInteraction(ScoreInteractionRequest) returns (ScoreInteractionResponse);

  // Lints an interaction.
  rpc LintInteractions(LintInteractionsRequest) returns (LintInteractionsResponse);

  // Returns an interaction.
  rpc GetInteractionRules(GetInteractionRulesRequest) returns (GetInteractionRulesResponse);
}

// The request of `ValidateInteraction`.
message ValidateInteractionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string interaction_id = 2;
  Interaction interaction = 3;
  ValidateInteractionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInteraction`.
message ValidateInteractionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Interaction interaction = 1;
  ValidateInteractionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

