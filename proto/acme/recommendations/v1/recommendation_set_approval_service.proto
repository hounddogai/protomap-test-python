syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationSetApprovalServiceProto";
option java_package = "com.acme.recommendations.v1";

// Routes recommendation sets through approval, with escalation and delegation.
service RecommendationSetApprovalService {
  // Submits a recommendation set.
  rpc SubmitRecommendationSet(SubmitRecommendationSetRequest) returns (SubmitRecommendationSetResponse);

  // Approves a recommendation set.
  rpc ApproveRecommendationSet(ApproveRecommendationSetRequest) returns (ApproveRecommendationSetResponse);

  // Escalates a recommendation set.
  rpc EscalateRecommendationSet(EscalateRecommendationSetRequest) returns (EscalateRecommendationSetResponse);

  // Lists recommendation sets a page at a time.
  rpc ListPendingRecommendationSets(ListPendingRecommendationSetsRequest) returns (ListPendingRecommendationSetsResponse);

  // Recalls a recommendation set.
  rpc RecallRecommendationSet(RecallRecommendationSetRequest) returns (RecallRecommendationSetResponse);

  // Returns a recommendation set.
  rpc GetRecommendationSetApprovalStatus(GetRecommendationSetApprovalStatusRequest) returns (GetRecommendationSetApprovalStatusResponse);

  // Comments a recommendation set.
  rpc CommentRecommendationSetApproval(CommentRecommendationSetApprovalRequest) returns (CommentRecommendationSetApprovalResponse);
}

// The request of `SubmitRecommendationSet`.
message SubmitRecommendationSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  SubmitRecommendationSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRecommendationSet`.
message SubmitRecommendationSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  SubmitRecommendationSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveRecommendationSet`.
message ApproveRecommendationSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  ApproveRecommendationSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveRecommendationSet`.
message ApproveRecommendationSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  ApproveRecommendationSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `EscalateRecommendationSet`.
message EscalateRecommendationSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  EscalateRecommendationSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `EscalateRecommendationSet`.
message EscalateRecommendationSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  EscalateRecommendationSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingRecommendationSets`.
message ListPendingRecommendationSetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingRecommendationSetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingRecommendationSets`.
message ListPendingRecommendationSetsResponse {
  repeated RecommendationSet recommendation_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RecallRecommendationSet`.
message RecallRecommendationSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  RecommendationSet recommendation_set = 3;
  RecallRecommendationSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecallRecommendationSet`.
message RecallRecommendationSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationSet recommendation_set = 1;
  RecallRecommendationSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRecommendationSetApprovalStatus`.
message GetRecommendationSetApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string recommendation_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRecommendationSetApprovalStatus`.
message GetRecommendationSetApprovalStatusResponse {
  RecommendationSet recommendation_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CommentRecommendationSetApproval`.
message CommentRecommendationSetApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
