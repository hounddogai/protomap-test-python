syntax = "proto3";

package acme.recommendations.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/recommendations/v1/recommendations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Recommendations.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/recommendations/v1;recommendationsv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationModelApprovalServiceProto";
option java_package = "com.acme.recommendations.v1";

// Routes recommendation models through approval, with escalation and delegation.
service RecommendationModelApprovalService {
  // Submits a recommendation model.
  rpc SubmitRecommendationModel(SubmitRecommendationModelRequest) returns (SubmitRecommendationModelResponse);

  // Approves a recommendation model.
  rpc ApproveRecommendationModel(ApproveRecommendationModelRequest) returns (ApproveRecommendationModelResponse);

  // Rejects a recommendation model.
  rpc RejectRecommendationModel(RejectRecommendationModelRequest) returns (RejectRecommendationModelResponse);

  // Escalates a recommendation model.
  rpc EscalateRecommendationModel(EscalateRecommendationModelRequest) returns (EscalateRecommendationModelResponse);

  // Lists recommendation models a page at a time.
  rpc ListPendingRecommendationModels(ListPendingRecommendationModelsRequest) returns (ListPendingRecommendationModelsResponse);

  // Delegates a recommendation model.
  rpc DelegateRecommendationModelApproval(DelegateRecommendationModelApprovalRequest) returns (DelegateRecommendationModelApprovalResponse);

  // Recalls a recommendation model.
  rpc RecallRecommendationModel(RecallRecommendationModelRequest) returns (RecallRecommendationModelResponse);

  // Returns a recommendation model.
  rpc GetRecommendationModelApprovalStatus(GetRecommendationModelApprovalStatusRequest) returns (GetRecommendationModelApprovalStatusResponse);

  // Comments a recommendation model.
  rpc CommentRecommendationModelApproval(CommentRecommendationModelApprovalRequest) returns (CommentRecommendationModelApprovalResponse);
}

// The request of `SubmitRecommendationModel`.
message SubmitRecommendationModelRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_model_id = 2;
  RecommendationModel recommendation_model = 3;
  SubmitRecommendationModelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRecommendationModel`.
message SubmitRecommendationModelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RecommendationModel recommendation_model = 1;
  SubmitRecommendationModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

