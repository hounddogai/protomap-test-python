syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeSyncServiceProto";
option java_package = "com.acme.lineage.v1";

// Keeps lineage nodes in step with the systems of record in other regions.
service LineageNodeSyncService {
  // Syncs a lineage node.
  rpc SyncLineageNodes(SyncLineageNodesRequest) returns (SyncLineageNodesResponse);

  // Pushs a lineage node.
  rpc PushLineageNode(PushLineageNodeRequest) returns (PushLineageNodeResponse);

  // Pulls a lineage node.
  rpc PullLineageNodes(PullLineageNodesRequest) returns (PullLineageNodesResponse);

  // Reconciles a lineage node.
  rpc ReconcileLineageNodes(ReconcileLineageNodesRequest) returns (ReconcileLineageNodesResponse);

  // Exchanges changes of lineage nodes with a peer.
  rpc StreamLineageNodeChanges(stream StreamLineageNodeChangesRequest) returns (stream StreamLineageNodeChangesResponse);

  // Resolves a lineage node.
  rpc ResolveLineageNodeConflict(ResolveLineageNodeConflictRequest) returns (ResolveLineageNodeConflictResponse);

  // Returns a lineage node.
  rpc GetLineageNodeSyncState(GetLineageNodeSyncStateRequest) returns (GetLineageNodeSyncStateResponse);

  // Lists lineage nodes a page at a time.
  rpc ListLineageNodeConflicts(ListLineageNodeConflictsRequest) returns (ListLineageNodeConflictsResponse);
}

// The request of `SyncLineageNodes`.
message SyncLineageNodesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  LineageNode lineage_node = 3;
  SyncLineageNodesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncLineageNodes`.
message SyncLineageNodesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageNode lineage_node = 1;
  SyncLineageNodesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushLineageNode`.
message PushLineageNodeRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  LineageNode lineage_node = 3;
  PushLineageNodeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushLineageNode`.
message PushLineageNodeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageNode lineage_node = 1;
  PushLineageNodeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullLineageNodes`.
message PullLineageNodesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  LineageNode lineage_node = 3;
  PullLineageNodesRequest.Details details = 4;
  string reason = 5;
