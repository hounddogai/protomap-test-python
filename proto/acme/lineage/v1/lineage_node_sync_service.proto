  LineageNode lineage_node = 1;
  ResolveLineageNodeConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetLineageNodeSyncState`.
message GetLineageNodeSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLineageNodeSyncState`.
message GetLineageNodeSyncStateResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListLineageNodeConflicts`.
message ListLineageNodeConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLineageNodeConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLineageNodeConflicts`.
message ListLineageNodeConflictsResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
