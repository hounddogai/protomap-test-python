// The request of `StreamLineageNodeChanges`.
message StreamLineageNodeChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    LineageNode change = 2;
    StreamLineageNodeChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamLineageNodeChanges`.
message StreamLineageNodeChangesResponse {
  LineageNode lineage_node = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

