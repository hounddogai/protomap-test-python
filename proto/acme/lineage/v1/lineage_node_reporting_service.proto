syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeReportingServiceProto";
option java_package = "com.acme.lineage.v1";

// Builds and schedules reports about lineage nodes.
service LineageNodeReportingService {
  // Generates a lineage node.
  rpc GenerateLineageNodeReport(GenerateLineageNodeReportRequest) returns (GenerateLineageNodeReportResponse);

  // Returns a lineage node.
  rpc FetchLineageNodeReport(FetchLineageNodeReportRequest) returns (FetchLineageNodeReportResponse);

  // Schedules a lineage node.
  rpc ScheduleLineageNodeReport(ScheduleLineageNodeReportRequest) returns (ScheduleLineageNodeReportResponse);

  // Lists lineage nodes a page at a time.
  rpc ListLineageNodeReports(ListLineageNodeReportsRequest) returns (ListLineageNodeReportsResponse);

  // Shares a lineage node.
  rpc ShareLineageNodeReport(ShareLineageNodeReportRequest) returns (ShareLineageNodeReportResponse);

  // Counts lineage nodes by status.
  rpc CountLineageNodeTotals(CountLineageNodeTotalsRequest) returns (CountLineageNodeTotalsResponse);

  // Deletes a lineage node.
  rpc DeleteLineageNodeReport(DeleteLineageNodeReportRequest) returns (DeleteLineageNodeReportResponse);
}

// The request of `GenerateLineageNodeReport`.
message GenerateLineageNodeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  GenerateLineageNodeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateLineageNodeReport`.
message GenerateLineageNodeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchLineageNodeReport`.
message FetchLineageNodeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchLineageNodeReport`.
message FetchLineageNodeReportResponse {
  LineageNode lineage_node = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleLineageNodeReport`.
message ScheduleLineageNodeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  ScheduleLineageNodeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleLineageNodeReport`.
message ScheduleLineageNodeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListLineageNodeReports`.
message ListLineageNodeReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLineageNodeReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLineageNodeReports`.
message ListLineageNodeReportsResponse {
  repeated LineageNode lineage_nodes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareLineageNodeReport`.
message ShareLineageNodeReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  ShareLineageNodeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareLineageNodeReport`.
message ShareLineageNodeReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageNode lineage_node = 1;
  ShareLineageNodeReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLineageNodeTotals`.
message CountLineageNodeTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageNodeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLineageNodeTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLineageNodeTotals`.
message CountLineageNodeTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteLineageNodeReport`.
message DeleteLineageNodeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLineageNodeReport`.
message DeleteLineageNodeReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
