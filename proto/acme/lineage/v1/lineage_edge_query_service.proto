syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageEdgeQueryServiceProto";
option java_package = "com.acme.lineage.v1";

// Answers read-only questions about lineage edges, for screens and reports.
service LineageEdgeQueryService {
  // Returns a lineage edge.
  rpc LookupLineageEdge(LookupLineageEdgeRequest) returns (LookupLineageEdgeResponse);

  // Lists lineage edges a page at a time.
  rpc BrowseLineageEdges(BrowseLineageEdgesRequest) returns (BrowseLineageEdgesResponse);

  // Lists lineage edges a page at a time.
  rpc FindLineageEdges(FindLineageEdgesRequest) returns (FindLineageEdgesResponse);

  // Counts lineage edges by status.
  rpc CountLineageEdges(CountLineageEdgesRequest) returns (CountLineageEdgesResponse);

  // Returns several lineage edges at once.
  rpc ResolveLineageEdges(ResolveLineageEdgesRequest) returns (ResolveLineageEdgesResponse);

  // Summarizes a lineage edge.
  rpc SummarizeLineageEdges(SummarizeLineageEdgesRequest) returns (SummarizeLineageEdgesResponse);

  // Lists lineage edges a page at a time.
  rpc SuggestLineageEdges(SuggestLineageEdgesRequest) returns (SuggestLineageEdgesResponse);

  // Returns a lineage edge.
  rpc PeekLineageEdge(PeekLineageEdgeRequest) returns (PeekLineageEdgeResponse);
}

// The request of `LookupLineageEdge`.
message LookupLineageEdgeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupLineageEdge`.
message LookupLineageEdgeResponse {
  LineageEdge lineage_edge = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseLineageEdges`.
message BrowseLineageEdgesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageEdgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseLineageEdgesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseLineageEdges`.
message BrowseLineageEdgesResponse {
  repeated LineageEdge lineage_edges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindLineageEdges`.
message FindLineageEdgesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageEdgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindLineageEdgesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindLineageEdges`.
message FindLineageEdgesResponse {
  repeated LineageEdge lineage_edges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLineageEdges`.
message CountLineageEdgesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageEdgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLineageEdgesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLineageEdges`.
message CountLineageEdgesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveLineageEdges`.
message ResolveLineageEdgesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string lineage_edge_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveLineageEdges`.
message ResolveLineageEdgesResponse {
  repeated LineageEdge lineage_edges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeLineageEdges`.
message SummarizeLineageEdgesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  SummarizeLineageEdgesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeLineageEdges`.
message SummarizeLineageEdgesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestLineageEdges`.
message SuggestLineageEdgesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LineageEdgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestLineageEdgesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestLineageEdges`.
message SuggestLineageEdgesResponse {
  repeated LineageEdge lineage_edges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekLineageEdge`.
message PeekLineageEdgeRequest {
  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekLineageEdge`.
message PeekLineageEdgeResponse {
  LineageEdge lineage_edge = 1;
  acme.common.v1.OperationResult result = 2;
}
