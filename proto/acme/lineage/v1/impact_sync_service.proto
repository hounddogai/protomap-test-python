syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "ImpactSyncServiceProto";
option java_package = "com.acme.lineage.v1";

// Keeps impacts in step with the systems of record in other regions.
service ImpactSyncService {
  // Syncs an impact.
  rpc SyncImpacts(SyncImpactsRequest) returns (SyncImpactsResponse);

  // Pushs an impact.
  rpc PushImpact(PushImpactRequest) returns (PushImpactResponse);

  // Pulls an impact.
  rpc PullImpacts(PullImpactsRequest) returns (PullImpactsResponse);

  // Reconciles an impact.
  rpc ReconcileImpacts(ReconcileImpactsRequest) returns (ReconcileImpactsResponse);

  // Exchanges changes of impacts with a peer.
  rpc StreamImpactChanges(stream StreamImpactChangesRequest) returns (stream StreamImpactChangesResponse);

  // Resolves an impact.
  rpc ResolveImpactConflict(ResolveImpactConflictRequest) returns (ResolveImpactConflictResponse);

  // Returns an impact.
  rpc GetImpactSyncState(GetImpactSyncStateRequest) returns (GetImpactSyncStateResponse);

  // Lists impacts a page at a time.
  rpc ListImpactConflicts(ListImpactConflictsRequest) returns (ListImpactConflictsResponse);
}

// The request of `SyncImpacts`.
message SyncImpactsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  Impact impact = 3;
  SyncImpactsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncImpacts`.
message SyncImpactsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Impact impact = 1;
  SyncImpactsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

