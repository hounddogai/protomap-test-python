syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageEdgeApprovalServiceProto";
option java_package = "com.acme.lineage.v1";

// Routes lineage edges through approval, with escalation and delegation.
service LineageEdgeApprovalService {
  // Submits a lineage edge.
  rpc SubmitLineageEdge(SubmitLineageEdgeRequest) returns (SubmitLineageEdgeResponse);

  // Approves a lineage edge.
  rpc ApproveLineageEdge(ApproveLineageEdgeRequest) returns (ApproveLineageEdgeResponse);

  // Rejects a lineage edge.
  rpc RejectLineageEdge(RejectLineageEdgeRequest) returns (RejectLineageEdgeResponse);

  // Escalates a lineage edge.
  rpc EscalateLineageEdge(EscalateLineageEdgeRequest) returns (EscalateLineageEdgeResponse);

  // Lists lineage edges a page at a time.
  rpc ListPendingLineageEdges(ListPendingLineageEdgesRequest) returns (ListPendingLineageEdgesResponse);

  // Delegates a lineage edge.
  rpc DelegateLineageEdgeApproval(DelegateLineageEdgeApprovalRequest) returns (DelegateLineageEdgeApprovalResponse);

  // Recalls a lineage edge.
  rpc RecallLineageEdge(RecallLineageEdgeRequest) returns (RecallLineageEdgeResponse);

  // Returns a lineage edge.
  rpc GetLineageEdgeApprovalStatus(GetLineageEdgeApprovalStatusRequest) returns (GetLineageEdgeApprovalStatusResponse);

  // Comments a lineage edge.
  rpc CommentLineageEdgeApproval(CommentLineageEdgeApprovalRequest) returns (CommentLineageEdgeApprovalResponse);
}

// The request of `SubmitLineageEdge`.
message SubmitLineageEdgeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  LineageEdge lineage_edge = 3;
  SubmitLineageEdgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLineageEdge`.
message SubmitLineageEdgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageEdge lineage_edge = 1;
  SubmitLineageEdgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

