syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeWorkflowServiceProto";
option java_package = "com.acme.lineage.v1";

// Runs the long-lived workflow that takes a lineage node from start to finish.
service LineageNodeWorkflowService {
  // Starts a lineage node.
  rpc StartLineageNodeWorkflow(StartLineageNodeWorkflowRequest) returns (StartLineageNodeWorkflowResponse);

  // Advances a lineage node.
  rpc AdvanceLineageNodeWorkflow(AdvanceLineageNodeWorkflowRequest) returns (AdvanceLineageNodeWorkflowResponse);

  // Cancels a lineage node.
  rpc CancelLineageNodeWorkflow(CancelLineageNodeWorkflowRequest) returns (CancelLineageNodeWorkflowResponse);

  // Retrys a lineage node.
  rpc RetryLineageNodeWorkflow(RetryLineageNodeWorkflowRequest) returns (RetryLineageNodeWorkflowResponse);

  // Pauses a lineage node.
  rpc PauseLineageNodeWorkflow(PauseLineageNodeWorkflowRequest) returns (PauseLineageNodeWorkflowResponse);

  // Resumes a lineage node.
  rpc ResumeLineageNodeWorkflow(ResumeLineageNodeWorkflowRequest) returns (ResumeLineageNodeWorkflowResponse);

  // Returns a lineage node.
  rpc InspectLineageNodeWorkflow(InspectLineageNodeWorkflowRequest) returns (InspectLineageNodeWorkflowResponse);

  // Lists lineage nodes a page at a time.
  rpc ListLineageNodeWorkflows(ListLineageNodeWorkflowsRequest) returns (ListLineageNodeWorkflowsResponse);
}

// The request of `StartLineageNodeWorkflow`.
message StartLineageNodeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  LineageNode lineage_node = 3;
  StartLineageNodeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLineageNodeWorkflow`.
message StartLineageNodeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageNode lineage_node = 1;
  StartLineageNodeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

