syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "ImpactCalculationServiceProto";
option java_package = "com.acme.lineage.v1";

// Computes the figures of an impact, such as totals, taxes, and estimates.
service ImpactCalculationService {
  // Calculates an impact.
  rpc CalculateImpact(CalculateImpactRequest) returns (CalculateImpactResponse);

  // Estimates an impact.
  rpc EstimateImpact(EstimateImpactRequest) returns (EstimateImpactResponse);

  // Quotes an impact.
  rpc QuoteImpact(QuoteImpactRequest) returns (QuoteImpactResponse);

  // Compares an impact.
  rpc CompareImpactOptions(CompareImpactOptionsRequest) returns (CompareImpactOptionsResponse);

  // Recalculates an impact.
  rpc RecalculateImpacts(RecalculateImpactsRequest) returns (RecalculateImpactsResponse);

  // Simulates an impact.
  rpc SimulateImpact(SimulateImpactRequest) returns (SimulateImpactResponse);

  // Explains an impact.
  rpc ExplainImpactCalculation(ExplainImpactCalculationRequest) returns (ExplainImpactCalculationResponse);

  // Returns an impact.
  rpc GetImpactRates(GetImpactRatesRequest) returns (GetImpactRatesResponse);
}

// The request of `CalculateImpact`.
message CalculateImpactRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  Impact impact = 3;
  CalculateImpactRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateImpact`.
message CalculateImpactResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateImpactResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Impact impact = 1;
  CalculateImpactResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

