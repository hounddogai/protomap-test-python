syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageEdgeValidationServiceProto";
option java_package = "com.acme.lineage.v1";

// Checks lineage edges against the rules before anything acts on them.
service LineageEdgeValidationService {
  // Validates a lineage edge.
  rpc ValidateLineageEdge(ValidateLineageEdgeRequest) returns (ValidateLineageEdgeResponse);

  // Previews a lineage edge.
  rpc PreviewLineageEdge(PreviewLineageEdgeRequest) returns (PreviewLineageEdgeResponse);

  // Checks a lineage edge.
  rpc CheckLineageEdgeEligibility(CheckLineageEdgeEligibilityRequest) returns (CheckLineageEdgeEligibilityResponse);

  // Normalizes a lineage edge.
  rpc NormalizeLineageEdge(NormalizeLineageEdgeRequest) returns (NormalizeLineageEdgeResponse);

  // Explains a lineage edge.
  rpc ExplainLineageEdgeDecision(ExplainLineageEdgeDecisionRequest) returns (ExplainLineageEdgeDecisionResponse);

  // Scores a lineage edge.
  rpc ScoreLineageEdge(ScoreLineageEdgeRequest) returns (ScoreLineageEdgeResponse);

  // Returns a lineage edge.
  rpc GetLineageEdgeRules(GetLineageEdgeRulesRequest) returns (GetLineageEdgeRulesResponse);
}

// The request of `ValidateLineageEdge`.
message ValidateLineageEdgeRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  LineageEdge lineage_edge = 3;
  ValidateLineageEdgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLineageEdge`.
message ValidateLineageEdgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageEdge lineage_edge = 1;
  ValidateLineageEdgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

