syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageEdgeCalculationServiceProto";
option java_package = "com.acme.lineage.v1";

// Computes the figures of a lineage edge, such as totals, taxes, and estimates.
service LineageEdgeCalculationService {
  // Calculates a lineage edge.
  rpc CalculateLineageEdge(CalculateLineageEdgeRequest) returns (CalculateLineageEdgeResponse);

  // Estimates a lineage edge.
  rpc EstimateLineageEdge(EstimateLineageEdgeRequest) returns (EstimateLineageEdgeResponse);

  // Quotes a lineage edge.
  rpc QuoteLineageEdge(QuoteLineageEdgeRequest) returns (QuoteLineageEdgeResponse);

  // Compares a lineage edge.
  rpc CompareLineageEdgeOptions(CompareLineageEdgeOptionsRequest) returns (CompareLineageEdgeOptionsResponse);

  // Simulates a lineage edge.
  rpc SimulateLineageEdge(SimulateLineageEdgeRequest) returns (SimulateLineageEdgeResponse);

  // Explains a lineage edge.
  rpc ExplainLineageEdgeCalculation(ExplainLineageEdgeCalculationRequest) returns (ExplainLineageEdgeCalculationResponse);

  // Returns a lineage edge.
  rpc GetLineageEdgeRates(GetLineageEdgeRatesRequest) returns (GetLineageEdgeRatesResponse);
}

// The request of `CalculateLineageEdge`.
message CalculateLineageEdgeRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  LineageEdge lineage_edge = 3;
  CalculateLineageEdgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLineageEdge`.
message CalculateLineageEdgeResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLineageEdgeResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LineageEdge lineage_edge = 1;
  CalculateLineageEdgeResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

