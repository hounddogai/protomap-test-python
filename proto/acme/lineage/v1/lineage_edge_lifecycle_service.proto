syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageEdgeLifecycleServiceProto";
option java_package = "com.acme.lineage.v1";

// Moves a lineage edge between the states of its lifecycle.
service LineageEdgeLifecycleService {
  // Activates a lineage edge.
  rpc ActivateLineageEdge(ActivateLineageEdgeRequest) returns (ActivateLineageEdgeResponse);

  // Suspends a lineage edge.
  rpc SuspendLineageEdge(SuspendLineageEdgeRequest) returns (SuspendLineageEdgeResponse);

  // Reinstates a lineage edge.
  rpc ReinstateLineageEdge(ReinstateLineageEdgeRequest) returns (ReinstateLineageEdgeResponse);

  // Renews a lineage edge.
  rpc RenewLineageEdge(RenewLineageEdgeRequest) returns (RenewLineageEdgeResponse);

  // Expires a lineage edge.
  rpc ExpireLineageEdge(ExpireLineageEdgeRequest) returns (ExpireLineageEdgeResponse);

  // Returns a lineage edge.
  rpc GetLineageEdgeLifecycle(GetLineageEdgeLifecycleRequest) returns (GetLineageEdgeLifecycleResponse);

  // Schedules a lineage edge.
  rpc ScheduleLineageEdgeExpiry(ScheduleLineageEdgeExpiryRequest) returns (ScheduleLineageEdgeExpiryResponse);
}

// The request of `ActivateLineageEdge`.
message ActivateLineageEdgeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_edge_id = 2;
  ActivateLineageEdgeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLineageEdge`.
message ActivateLineageEdgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageEdge lineage_edge = 1;
  ActivateLineageEdgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

