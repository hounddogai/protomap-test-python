syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "LineageNodeLifecycleServiceProto";
option java_package = "com.acme.lineage.v1";

// Moves a lineage node between the states of its lifecycle.
service LineageNodeLifecycleService {
  // Activates a lineage node.
  rpc ActivateLineageNode(ActivateLineageNodeRequest) returns (ActivateLineageNodeResponse);

  // Suspends a lineage node.
  rpc SuspendLineageNode(SuspendLineageNodeRequest) returns (SuspendLineageNodeResponse);

  // Reinstates a lineage node.
  rpc ReinstateLineageNode(ReinstateLineageNodeRequest) returns (ReinstateLineageNodeResponse);

  // Terminates a lineage node.
  rpc TerminateLineageNode(TerminateLineageNodeRequest) returns (TerminateLineageNodeResponse);

  // Renews a lineage node.
  rpc RenewLineageNode(RenewLineageNodeRequest) returns (RenewLineageNodeResponse);

  // Expires a lineage node.
  rpc ExpireLineageNode(ExpireLineageNodeRequest) returns (ExpireLineageNodeResponse);

  // Returns a lineage node.
  rpc GetLineageNodeLifecycle(GetLineageNodeLifecycleRequest) returns (GetLineageNodeLifecycleResponse);
}

// The request of `ActivateLineageNode`.
message ActivateLineageNodeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string lineage_node_id = 2;
  ActivateLineageNodeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLineageNode`.
message ActivateLineageNodeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LineageNode lineage_node = 1;
  ActivateLineageNodeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

