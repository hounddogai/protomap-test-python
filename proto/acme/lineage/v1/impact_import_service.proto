syntax = "proto3";

package acme.lineage.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/lineage/v1/lineage.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lineage.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lineage/v1;lineagev1";
option java_multiple_files = true;
option java_outer_classname = "ImpactImportServiceProto";
option java_package = "com.acme.lineage.v1";

// Takes impacts in bulk from partners and legacy systems.
service ImpactImportService {
  // Takes a stream of impacts and answers once at the end.
  rpc ImportImpacts(stream ImportImpactsRequest) returns (ImportImpactsResponse);

  // Returns an impact.
  rpc GetImpactImportStatus(GetImpactImportStatusRequest) returns (GetImpactImportStatusResponse);

  // Cancels an impact.
  rpc CancelImpactImport(CancelImpactImportRequest) returns (CancelImpactImportResponse);

  // Validates an impact.
  rpc ValidateImpactImport(ValidateImpactImportRequest) returns (ValidateImpactImportResponse);

  // Lists impacts a page at a time.
  rpc ListImpactImports(ListImpactImportsRequest) returns (ListImpactImportsResponse);

  // Maps an impact.
  rpc MapImpactImportColumns(MapImpactImportColumnsRequest) returns (MapImpactImportColumnsResponse);
}

// The request of `ImportImpacts`.
message ImportImpactsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportImpactsRequest.StreamHeader header = 2;
    Impact record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportImpacts`.
message ImportImpactsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string impact_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportImpactsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetImpactImportStatus`.
message GetImpactImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetImpactImportStatus`.
message GetImpactImportStatusResponse {
  Impact impact = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelImpactImport`.
message CancelImpactImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  CancelImpactImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelImpactImport`.
message CancelImpactImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Impact impact = 1;
  CancelImpactImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateImpactImport`.
message ValidateImpactImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  Impact impact = 3;
  ValidateImpactImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateImpactImport`.
message ValidateImpactImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Impact impact = 1;
  ValidateImpactImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListImpactImports`.
message ListImpactImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ImpactStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListImpactImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListImpactImports`.
message ListImpactImportsResponse {
  repeated Impact impacts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapImpactImportColumns`.
message MapImpactImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string impact_id = 2;
  Impact impact = 3;
  MapImpactImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapImpactImportColumns`.
message MapImpactImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Impact impact = 1;
  MapImpactImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
