syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "MetricAlertValidationServiceProto";
option java_package = "com.acme.metrics.v1";

// Checks metric alerts against the rules before anything acts on them.
service MetricAlertValidationService {
  // Validates a metric alert.
  rpc ValidateMetricAlert(ValidateMetricAlertRequest) returns (ValidateMetricAlertResponse);

  // Previews a metric alert.
  rpc PreviewMetricAlert(PreviewMetricAlertRequest) returns (PreviewMetricAlertResponse);

  // Normalizes a metric alert.
  rpc NormalizeMetricAlert(NormalizeMetricAlertRequest) returns (NormalizeMetricAlertResponse);

  // Explains a metric alert.
  rpc ExplainMetricAlertDecision(ExplainMetricAlertDecisionRequest) returns (ExplainMetricAlertDecisionResponse);

  // Scores a metric alert.
  rpc ScoreMetricAlert(ScoreMetricAlertRequest) returns (ScoreMetricAlertResponse);

  // Lints a metric alert.
  rpc LintMetricAlerts(LintMetricAlertsRequest) returns (LintMetricAlertsResponse);

  // Returns a metric alert.
  rpc GetMetricAlertRules(GetMetricAlertRulesRequest) returns (GetMetricAlertRulesResponse);
}

// The request of `ValidateMetricAlert`.
message ValidateMetricAlertRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  MetricAlert metric_alert = 3;
  ValidateMetricAlertRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMetricAlert`.
message ValidateMetricAlertResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MetricAlert metric_alert = 1;
  ValidateMetricAlertResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

