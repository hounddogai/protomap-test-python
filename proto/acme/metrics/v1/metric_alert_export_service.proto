syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "MetricAlertExportServiceProto";
option java_package = "com.acme.metrics.v1";

// Exports metric alerts to files and other systems.
service MetricAlertExportService {
  // Streams every matching metric alert.
  rpc StreamMetricAlertExport(StreamMetricAlertExportRequest) returns (stream StreamMetricAlertExportResponse);

  // Returns a metric alert.
  rpc GetMetricAlertExport(GetMetricAlertExportRequest) returns (GetMetricAlertExportResponse);

  // Lists metric alerts a page at a time.
  rpc ListMetricAlertExports(ListMetricAlertExportsRequest) returns (ListMetricAlertExportsResponse);

  // Schedules a metric alert.
  rpc ScheduleMetricAlertExport(ScheduleMetricAlertExportRequest) returns (ScheduleMetricAlertExportResponse);

  // Retrys a metric alert.
  rpc RetryMetricAlertExport(RetryMetricAlertExportRequest) returns (RetryMetricAlertExportResponse);

  // Shares a metric alert.
  rpc ShareMetricAlertExport(ShareMetricAlertExportRequest) returns (ShareMetricAlertExportResponse);
}

// The request of `StreamMetricAlertExport`.
message StreamMetricAlertExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MetricAlertStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamMetricAlertExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamMetricAlertExport`.
message StreamMetricAlertExportResponse {
  MetricAlert metric_alert = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetMetricAlertExport`.
message GetMetricAlertExportRequest {
  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetMetricAlertExport`.
message GetMetricAlertExportResponse {
  MetricAlert metric_alert = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListMetricAlertExports`.
message ListMetricAlertExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MetricAlertStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListMetricAlertExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListMetricAlertExports`.
message ListMetricAlertExportsResponse {
  repeated MetricAlert metric_alerts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleMetricAlertExport`.
message ScheduleMetricAlertExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  ScheduleMetricAlertExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleMetricAlertExport`.
message ScheduleMetricAlertExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryMetricAlertExport`.
message RetryMetricAlertExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  MetricAlert metric_alert = 3;
  RetryMetricAlertExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryMetricAlertExport`.
message RetryMetricAlertExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MetricAlert metric_alert = 1;
  RetryMetricAlertExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareMetricAlertExport`.
message ShareMetricAlertExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  ShareMetricAlertExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareMetricAlertExport`.
message ShareMetricAlertExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MetricAlert metric_alert = 1;
  ShareMetricAlertExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
