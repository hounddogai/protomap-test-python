message RepairDashboardRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  RepairDashboardRequest.Details details = 4;
  string reason = 5;
