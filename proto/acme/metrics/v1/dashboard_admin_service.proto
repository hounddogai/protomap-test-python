syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "DashboardAdminServiceProto";
option java_package = "com.acme.metrics.v1";

// Operator actions on dashboards that support staff run by hand.
service DashboardAdminService {
  // Archives a dashboard.
  rpc ArchiveDashboard(ArchiveDashboardRequest) returns (ArchiveDashboardResponse);

  // Restores a dashboard.
  rpc RestoreDashboard(RestoreDashboardRequest) returns (RestoreDashboardResponse);

  // Deletes a dashboard.
  rpc PurgeDashboard(PurgeDashboardRequest) returns (PurgeDashboardResponse);

  // Reassigns a dashboard.
  rpc ReassignDashboard(ReassignDashboardRequest) returns (ReassignDashboardResponse);

  // Locks a dashboard.
  rpc LockDashboard(LockDashboardRequest) returns (LockDashboardResponse);

  // Unlocks a dashboard.
  rpc UnlockDashboard(UnlockDashboardRequest) returns (UnlockDashboardResponse);

  // Transfers a dashboard.
  rpc TransferDashboard(TransferDashboardRequest) returns (TransferDashboardResponse);

  // Repairs a dashboard.
  rpc RepairDashboard(RepairDashboardRequest) returns (RepairDashboardResponse);

  // Returns a dashboard.
  rpc InspectDashboard(InspectDashboardRequest) returns (InspectDashboardResponse);
}

// The request of `ArchiveDashboard`.
message ArchiveDashboardRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  ArchiveDashboardRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveDashboard`.
message ArchiveDashboardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  ArchiveDashboardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreDashboard`.
message RestoreDashboardRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
