}

// The request of `PurgeDashboard`.
message PurgeDashboardRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeDashboard`.
message PurgeDashboardResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignDashboard`.
message ReassignDashboardRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  ReassignDashboardRequest.Details details = 3;
