// The request of `InspectDashboard`.
message InspectDashboardRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectDashboard`.
message InspectDashboardResponse {
  Dashboard dashboard = 1;
  acme.common.v1.OperationResult result = 2;
}
