syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "DashboardNotificationServiceProto";
option java_package = "com.acme.metrics.v1";

// Tells the people who follow a dashboard what changed.
service DashboardNotificationService {
  // Subscribes a dashboard.
  rpc SubscribeDashboardUpdates(SubscribeDashboardUpdatesRequest) returns (SubscribeDashboardUpdatesResponse);

  // Unsubscribes a dashboard.
  rpc UnsubscribeDashboardUpdates(UnsubscribeDashboardUpdatesRequest) returns (UnsubscribeDashboardUpdatesResponse);

  // Notifys a dashboard.
  rpc NotifyDashboardWatchers(NotifyDashboardWatchersRequest) returns (NotifyDashboardWatchersResponse);

  // Lists dashboards a page at a time.
  rpc ListDashboardSubscriptions(ListDashboardSubscriptionsRequest) returns (ListDashboardSubscriptionsResponse);

  // Sends a dashboard.
  rpc SendDashboardTestNotice(SendDashboardTestNoticeRequest) returns (SendDashboardTestNoticeResponse);

  // Returns a dashboard.
  rpc GetDashboardPreferences(GetDashboardPreferencesRequest) returns (GetDashboardPreferencesResponse);

  // Streams the changes of dashboards as they happen.
  rpc StreamDashboardNotices(StreamDashboardNoticesRequest) returns (stream StreamDashboardNoticesResponse);
}

// The request of `SubscribeDashboardUpdates`.
message SubscribeDashboardUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  SubscribeDashboardUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDashboardUpdates`.
message SubscribeDashboardUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  SubscribeDashboardUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDashboardUpdates`.
message UnsubscribeDashboardUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  UnsubscribeDashboardUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDashboardUpdates`.
message UnsubscribeDashboardUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  UnsubscribeDashboardUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDashboardWatchers`.
message NotifyDashboardWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  NotifyDashboardWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDashboardWatchers`.
message NotifyDashboardWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  NotifyDashboardWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDashboardSubscriptions`.
message ListDashboardSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DashboardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDashboardSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDashboardSubscriptions`.
message ListDashboardSubscriptionsResponse {
  repeated Dashboard dashboards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendDashboardTestNotice`.
message SendDashboardTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  SendDashboardTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendDashboardTestNotice`.
message SendDashboardTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  SendDashboardTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDashboardPreferences`.
message GetDashboardPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDashboardPreferences`.
message GetDashboardPreferencesResponse {
  Dashboard dashboard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDashboardNotices`.
message StreamDashboardNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DashboardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDashboardNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDashboardNotices`.
message StreamDashboardNoticesResponse {
  Dashboard dashboard = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
