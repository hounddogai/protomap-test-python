    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  PushDashboardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullDashboards`.
message PullDashboardsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
