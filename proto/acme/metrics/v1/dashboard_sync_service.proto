  Dashboard dashboard = 1;
  ResolveDashboardConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDashboardSyncState`.
message GetDashboardSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDashboardSyncState`.
message GetDashboardSyncStateResponse {
  Dashboard dashboard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDashboardConflicts`.
message ListDashboardConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DashboardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDashboardConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDashboardConflicts`.
message ListDashboardConflictsResponse {
  repeated Dashboard dashboards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
