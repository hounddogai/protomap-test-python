syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "DashboardHistoryServiceProto";
option java_package = "com.acme.metrics.v1";

// Keeps every version of a dashboard and restores earlier ones.
service DashboardHistoryService {
  // Records a dashboard.
  rpc RecordDashboardVersion(RecordDashboardVersionRequest) returns (RecordDashboardVersionResponse);

  // Lists dashboards a page at a time.
  rpc ListDashboardVersions(ListDashboardVersionsRequest) returns (ListDashboardVersionsResponse);

  // Returns a dashboard.
  rpc GetDashboardVersion(GetDashboardVersionRequest) returns (GetDashboardVersionResponse);

  // Compares a dashboard.
  rpc CompareDashboardVersions(CompareDashboardVersionsRequest) returns (CompareDashboardVersionsResponse);

  // Reverts a dashboard.
  rpc RevertDashboard(RevertDashboardRequest) returns (RevertDashboardResponse);

  // Annotates a dashboard.
  rpc AnnotateDashboardVersion(AnnotateDashboardVersionRequest) returns (AnnotateDashboardVersionResponse);

  // Deletes a dashboard.
  rpc PruneDashboardVersions(PruneDashboardVersionsRequest) returns (PruneDashboardVersionsResponse);
}

// The request of `RecordDashboardVersion`.
message RecordDashboardVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  RecordDashboardVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordDashboardVersion`.
message RecordDashboardVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  RecordDashboardVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDashboardVersions`.
message ListDashboardVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DashboardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDashboardVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDashboardVersions`.
message ListDashboardVersionsResponse {
  repeated Dashboard dashboards = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDashboardVersion`.
message GetDashboardVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDashboardVersion`.
message GetDashboardVersionResponse {
  Dashboard dashboard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareDashboardVersions`.
message CompareDashboardVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  CompareDashboardVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareDashboardVersions`.
message CompareDashboardVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  CompareDashboardVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertDashboard`.
message RevertDashboardRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  RevertDashboardRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertDashboard`.
message RevertDashboardResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  RevertDashboardResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateDashboardVersion`.
message AnnotateDashboardVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  AnnotateDashboardVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateDashboardVersion`.
message AnnotateDashboardVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  AnnotateDashboardVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneDashboardVersions`.
message PruneDashboardVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneDashboardVersions`.
message PruneDashboardVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
