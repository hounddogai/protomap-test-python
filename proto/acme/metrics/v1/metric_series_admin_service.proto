// The request of `RepairMetricSeries`.
message RepairMetricSeriesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_series_id = 2;
  MetricSeries metric_series = 3;
  RepairMetricSeriesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RepairMetricSeries`.
message RepairMetricSeriesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MetricSeries metric_series = 1;
  RepairMetricSeriesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `InspectMetricSeries`.
message InspectMetricSeriesRequest {
  acme.common.v1.RequestContext context = 1;
  string metric_series_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectMetricSeries`.
message InspectMetricSeriesResponse {
  MetricSeries metric_series = 1;
  acme.common.v1.OperationResult result = 2;
}
