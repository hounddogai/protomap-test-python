// The request of `PurgeMetricAlert`.
message PurgeMetricAlertRequest {
  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeMetricAlert`.
message PurgeMetricAlertResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

