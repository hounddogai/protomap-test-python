    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string metric_alert_id = 2;
  MetricAlert metric_alert = 3;
  RepairMetricAlertRequest.Details details = 4;
  string reason = 5;
