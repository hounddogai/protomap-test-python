syntax = "proto3";

package acme.metrics.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/metrics/v1/metrics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Metrics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/metrics/v1;metricsv1";
option java_multiple_files = true;
option java_outer_classname = "DashboardExportServiceProto";
option java_package = "com.acme.metrics.v1";

// Exports dashboards to files and other systems.
service DashboardExportService {
  // Streams every matching dashboard.
  rpc StreamDashboardExport(StreamDashboardExportRequest) returns (stream StreamDashboardExportResponse);

  // Returns a dashboard.
  rpc GetDashboardExport(GetDashboardExportRequest) returns (GetDashboardExportResponse);

  // Cancels a dashboard.
  rpc CancelDashboardExport(CancelDashboardExportRequest) returns (CancelDashboardExportResponse);

  // Schedules a dashboard.
  rpc ScheduleDashboardExport(ScheduleDashboardExportRequest) returns (ScheduleDashboardExportResponse);

  // Retrys a dashboard.
  rpc RetryDashboardExport(RetryDashboardExportRequest) returns (RetryDashboardExportResponse);

  // Shares a dashboard.
  rpc ShareDashboardExport(ShareDashboardExportRequest) returns (ShareDashboardExportResponse);
}

// The request of `StreamDashboardExport`.
message StreamDashboardExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DashboardStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDashboardExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamDashboardExport`.
message StreamDashboardExportResponse {
  Dashboard dashboard = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDashboardExport`.
message GetDashboardExportRequest {
  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDashboardExport`.
message GetDashboardExportResponse {
  Dashboard dashboard = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDashboardExport`.
message CancelDashboardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  CancelDashboardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDashboardExport`.
message CancelDashboardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  CancelDashboardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleDashboardExport`.
message ScheduleDashboardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  ScheduleDashboardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDashboardExport`.
message ScheduleDashboardExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryDashboardExport`.
message RetryDashboardExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  Dashboard dashboard = 3;
  RetryDashboardExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDashboardExport`.
message RetryDashboardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  RetryDashboardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDashboardExport`.
message ShareDashboardExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dashboard_id = 2;
  ShareDashboardExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDashboardExport`.
message ShareDashboardExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dashboard dashboard = 1;
  ShareDashboardExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
