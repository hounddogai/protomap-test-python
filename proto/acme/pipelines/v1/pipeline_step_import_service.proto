syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineStepImportServiceProto";
option java_package = "com.acme.pipelines.v1";

// Takes pipeline steps in bulk from partners and legacy systems.
service PipelineStepImportService {
  // Takes a stream of pipeline steps and answers once at the end.
  rpc ImportPipelineSteps(stream ImportPipelineStepsRequest) returns (ImportPipelineStepsResponse);

  // Returns a pipeline step.
  rpc GetPipelineStepImportStatus(GetPipelineStepImportStatusRequest) returns (GetPipelineStepImportStatusResponse);

  // Cancels a pipeline step.
  rpc CancelPipelineStepImport(CancelPipelineStepImportRequest) returns (CancelPipelineStepImportResponse);

  // Validates a pipeline step.
  rpc ValidatePipelineStepImport(ValidatePipelineStepImportRequest) returns (ValidatePipelineStepImportResponse);

  // Lists pipeline steps a page at a time.
  rpc ListPipelineStepImports(ListPipelineStepImportsRequest) returns (ListPipelineStepImportsResponse);

  // Retrys a pipeline step.
  rpc RetryPipelineStepImport(RetryPipelineStepImportRequest) returns (RetryPipelineStepImportResponse);

  // Maps a pipeline step.
  rpc MapPipelineStepImportColumns(MapPipelineStepImportColumnsRequest) returns (MapPipelineStepImportColumnsResponse);
}

// The request of `ImportPipelineSteps`.
message ImportPipelineStepsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportPipelineStepsRequest.StreamHeader header = 2;
    PipelineStep record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportPipelineSteps`.
message ImportPipelineStepsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string pipeline_step_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportPipelineStepsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetPipelineStepImportStatus`.
message GetPipelineStepImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPipelineStepImportStatus`.
message GetPipelineStepImportStatusResponse {
  PipelineStep pipeline_step = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelPipelineStepImport`.
message CancelPipelineStepImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  CancelPipelineStepImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelPipelineStepImport`.
message CancelPipelineStepImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  CancelPipelineStepImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidatePipelineStepImport`.
message ValidatePipelineStepImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  ValidatePipelineStepImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePipelineStepImport`.
message ValidatePipelineStepImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  ValidatePipelineStepImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPipelineStepImports`.
message ListPipelineStepImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStepStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPipelineStepImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPipelineStepImports`.
message ListPipelineStepImportsResponse {
  repeated PipelineStep pipeline_steps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryPipelineStepImport`.
message RetryPipelineStepImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  RetryPipelineStepImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryPipelineStepImport`.
message RetryPipelineStepImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  RetryPipelineStepImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapPipelineStepImportColumns`.
message MapPipelineStepImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  MapPipelineStepImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapPipelineStepImportColumns`.
message MapPipelineStepImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  MapPipelineStepImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
