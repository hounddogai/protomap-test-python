syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineWorkflowServiceProto";
option java_package = "com.acme.pipelines.v1";

// Runs the long-lived workflow that takes a pipeline from start to finish.
service PipelineWorkflowService {
  // Starts a pipeline.
  rpc StartPipelineWorkflow(StartPipelineWorkflowRequest) returns (StartPipelineWorkflowResponse);

  // Advances a pipeline.
  rpc AdvancePipelineWorkflow(AdvancePipelineWorkflowRequest) returns (AdvancePipelineWorkflowResponse);

  // Cancels a pipeline.
  rpc CancelPipelineWorkflow(CancelPipelineWorkflowRequest) returns (CancelPipelineWorkflowResponse);

  // Retrys a pipeline.
  rpc RetryPipelineWorkflow(RetryPipelineWorkflowRequest) returns (RetryPipelineWorkflowResponse);

  // Pauses a pipeline.
  rpc PausePipelineWorkflow(PausePipelineWorkflowRequest) returns (PausePipelineWorkflowResponse);

  // Resumes a pipeline.
  rpc ResumePipelineWorkflow(ResumePipelineWorkflowRequest) returns (ResumePipelineWorkflowResponse);

  // Returns a pipeline.
  rpc InspectPipelineWorkflow(InspectPipelineWorkflowRequest) returns (InspectPipelineWorkflowResponse);

  // Lists pipelines a page at a time.
  rpc ListPipelineWorkflows(ListPipelineWorkflowsRequest) returns (ListPipelineWorkflowsResponse);

  // Signals a pipeline.
  rpc SignalPipelineWorkflow(SignalPipelineWorkflowRequest) returns (SignalPipelineWorkflowResponse);
}

// The request of `StartPipelineWorkflow`.
message StartPipelineWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  Pipeline pipeline = 3;
  StartPipelineWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPipelineWorkflow`.
message StartPipelineWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Pipeline pipeline = 1;
  StartPipelineWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

