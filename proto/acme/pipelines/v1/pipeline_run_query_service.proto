syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineRunQueryServiceProto";
option java_package = "com.acme.pipelines.v1";

// Answers read-only questions about pipeline runs, for screens and reports.
service PipelineRunQueryService {
  // Returns a pipeline run.
  rpc LookupPipelineRun(LookupPipelineRunRequest) returns (LookupPipelineRunResponse);

  // Lists pipeline runs a page at a time.
  rpc BrowsePipelineRuns(BrowsePipelineRunsRequest) returns (BrowsePipelineRunsResponse);

  // Lists pipeline runs a page at a time.
  rpc FindPipelineRuns(FindPipelineRunsRequest) returns (FindPipelineRunsResponse);

  // Streams every matching pipeline run.
  rpc ExportPipelineRuns(ExportPipelineRunsRequest) returns (stream ExportPipelineRunsResponse);

  // Summarizes a pipeline run.
  rpc SummarizePipelineRuns(SummarizePipelineRunsRequest) returns (SummarizePipelineRunsResponse);

  // Lists pipeline runs a page at a time.
  rpc SuggestPipelineRuns(SuggestPipelineRunsRequest) returns (SuggestPipelineRunsResponse);
}

// The request of `LookupPipelineRun`.
message LookupPipelineRunRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPipelineRun`.
message LookupPipelineRunResponse {
  PipelineRun pipeline_run = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePipelineRuns`.
message BrowsePipelineRunsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineRunStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePipelineRunsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePipelineRuns`.
message BrowsePipelineRunsResponse {
  repeated PipelineRun pipeline_runs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPipelineRuns`.
message FindPipelineRunsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineRunStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPipelineRunsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPipelineRuns`.
message FindPipelineRunsResponse {
  repeated PipelineRun pipeline_runs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPipelineRuns`.
message ExportPipelineRunsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineRunStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPipelineRunsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPipelineRuns`.
message ExportPipelineRunsResponse {
  PipelineRun pipeline_run = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePipelineRuns`.
message SummarizePipelineRunsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  SummarizePipelineRunsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePipelineRuns`.
message SummarizePipelineRunsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPipelineRuns`.
message SuggestPipelineRunsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineRunStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPipelineRunsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPipelineRuns`.
message SuggestPipelineRunsResponse {
  repeated PipelineRun pipeline_runs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
