syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineStepExportServiceProto";
option java_package = "com.acme.pipelines.v1";

// Exports pipeline steps to files and other systems.
service PipelineStepExportService {
  // Streams every matching pipeline step.
  rpc StreamPipelineStepExport(StreamPipelineStepExportRequest) returns (stream StreamPipelineStepExportResponse);

  // Returns a pipeline step.
  rpc GetPipelineStepExport(GetPipelineStepExportRequest) returns (GetPipelineStepExportResponse);

  // Cancels a pipeline step.
  rpc CancelPipelineStepExport(CancelPipelineStepExportRequest) returns (CancelPipelineStepExportResponse);

  // Lists pipeline steps a page at a time.
  rpc ListPipelineStepExports(ListPipelineStepExportsRequest) returns (ListPipelineStepExportsResponse);

  // Schedules a pipeline step.
  rpc SchedulePipelineStepExport(SchedulePipelineStepExportRequest) returns (SchedulePipelineStepExportResponse);

  // Retrys a pipeline step.
  rpc RetryPipelineStepExport(RetryPipelineStepExportRequest) returns (RetryPipelineStepExportResponse);

  // Shares a pipeline step.
  rpc SharePipelineStepExport(SharePipelineStepExportRequest) returns (SharePipelineStepExportResponse);
}

// The request of `StreamPipelineStepExport`.
message StreamPipelineStepExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStepStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPipelineStepExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamPipelineStepExport`.
message StreamPipelineStepExportResponse {
  PipelineStep pipeline_step = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetPipelineStepExport`.
message GetPipelineStepExportRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPipelineStepExport`.
message GetPipelineStepExportResponse {
  PipelineStep pipeline_step = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelPipelineStepExport`.
message CancelPipelineStepExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  CancelPipelineStepExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelPipelineStepExport`.
message CancelPipelineStepExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  CancelPipelineStepExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPipelineStepExports`.
message ListPipelineStepExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStepStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPipelineStepExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPipelineStepExports`.
message ListPipelineStepExportsResponse {
  repeated PipelineStep pipeline_steps = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SchedulePipelineStepExport`.
message SchedulePipelineStepExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  SchedulePipelineStepExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePipelineStepExport`.
message SchedulePipelineStepExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryPipelineStepExport`.
message RetryPipelineStepExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  RetryPipelineStepExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryPipelineStepExport`.
message RetryPipelineStepExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  RetryPipelineStepExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePipelineStepExport`.
message SharePipelineStepExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  SharePipelineStepExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePipelineStepExport`.
message SharePipelineStepExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  SharePipelineStepExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
