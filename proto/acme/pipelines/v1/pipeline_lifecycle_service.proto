syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineLifecycleServiceProto";
option java_package = "com.acme.pipelines.v1";

// Moves a pipeline between the states of its lifecycle.
service PipelineLifecycleService {
  // Activates a pipeline.
  rpc ActivatePipeline(ActivatePipelineRequest) returns (ActivatePipelineResponse);

  // Suspends a pipeline.
  rpc SuspendPipeline(SuspendPipelineRequest) returns (SuspendPipelineResponse);

  // Terminates a pipeline.
  rpc TerminatePipeline(TerminatePipelineRequest) returns (TerminatePipelineResponse);

  // Renews a pipeline.
  rpc RenewPipeline(RenewPipelineRequest) returns (RenewPipelineResponse);

  // Expires a pipeline.
  rpc ExpirePipeline(ExpirePipelineRequest) returns (ExpirePipelineResponse);

  // Returns a pipeline.
  rpc GetPipelineLifecycle(GetPipelineLifecycleRequest) returns (GetPipelineLifecycleResponse);

  // Schedules a pipeline.
  rpc SchedulePipelineExpiry(SchedulePipelineExpiryRequest) returns (SchedulePipelineExpiryResponse);
}

// The request of `ActivatePipeline`.
message ActivatePipelineRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  ActivatePipelineRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePipeline`.
message ActivatePipelineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Pipeline pipeline = 1;
  ActivatePipelineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

