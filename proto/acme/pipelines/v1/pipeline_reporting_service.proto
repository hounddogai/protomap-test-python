syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineReportingServiceProto";
option java_package = "com.acme.pipelines.v1";

// Builds and schedules reports about pipelines.
service PipelineReportingService {
  // Generates a pipeline.
  rpc GeneratePipelineReport(GeneratePipelineReportRequest) returns (GeneratePipelineReportResponse);

  // Returns a pipeline.
  rpc FetchPipelineReport(FetchPipelineReportRequest) returns (FetchPipelineReportResponse);

  // Schedules a pipeline.
  rpc SchedulePipelineReport(SchedulePipelineReportRequest) returns (SchedulePipelineReportResponse);

  // Streams the changes of pipelines as they happen.
  rpc StreamPipelineMetrics(StreamPipelineMetricsRequest) returns (stream StreamPipelineMetricsResponse);

  // Lists pipelines a page at a time.
  rpc ListPipelineReports(ListPipelineReportsRequest) returns (ListPipelineReportsResponse);

  // Shares a pipeline.
  rpc SharePipelineReport(SharePipelineReportRequest) returns (SharePipelineReportResponse);

  // Counts pipelines by status.
  rpc CountPipelineTotals(CountPipelineTotalsRequest) returns (CountPipelineTotalsResponse);

  // Deletes a pipeline.
  rpc DeletePipelineReport(DeletePipelineReportRequest) returns (DeletePipelineReportResponse);
}

// The request of `GeneratePipelineReport`.
message GeneratePipelineReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  GeneratePipelineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePipelineReport`.
message GeneratePipelineReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPipelineReport`.
message FetchPipelineReportRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPipelineReport`.
message FetchPipelineReportResponse {
  Pipeline pipeline = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePipelineReport`.
message SchedulePipelineReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  SchedulePipelineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePipelineReport`.
message SchedulePipelineReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPipelineMetrics`.
message StreamPipelineMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPipelineMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPipelineMetrics`.
message StreamPipelineMetricsResponse {
  Pipeline pipeline = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPipelineReports`.
message ListPipelineReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPipelineReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPipelineReports`.
message ListPipelineReportsResponse {
  repeated Pipeline pipelines = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePipelineReport`.
message SharePipelineReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  SharePipelineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePipelineReport`.
message SharePipelineReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Pipeline pipeline = 1;
  SharePipelineReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPipelineTotals`.
message CountPipelineTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPipelineTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPipelineTotals`.
message CountPipelineTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePipelineReport`.
message DeletePipelineReportRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePipelineReport`.
message DeletePipelineReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
