syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineRunValidationServiceProto";
option java_package = "com.acme.pipelines.v1";

// Checks pipeline runs against the rules before anything acts on them.
service PipelineRunValidationService {
  // Validates a pipeline run.
  rpc ValidatePipelineRun(ValidatePipelineRunRequest) returns (ValidatePipelineRunResponse);

  // Previews a pipeline run.
  rpc PreviewPipelineRun(PreviewPipelineRunRequest) returns (PreviewPipelineRunResponse);

  // Checks a pipeline run.
  rpc CheckPipelineRunEligibility(CheckPipelineRunEligibilityRequest) returns (CheckPipelineRunEligibilityResponse);

  // Normalizes a pipeline run.
  rpc NormalizePipelineRun(NormalizePipelineRunRequest) returns (NormalizePipelineRunResponse);

  // Explains a pipeline run.
  rpc ExplainPipelineRunDecision(ExplainPipelineRunDecisionRequest) returns (ExplainPipelineRunDecisionResponse);

  // Scores a pipeline run.
  rpc ScorePipelineRun(ScorePipelineRunRequest) returns (ScorePipelineRunResponse);

  // Lints a pipeline run.
  rpc LintPipelineRuns(LintPipelineRunsRequest) returns (LintPipelineRunsResponse);

  // Returns a pipeline run.
  rpc GetPipelineRunRules(GetPipelineRunRulesRequest) returns (GetPipelineRunRulesResponse);
}

// The request of `ValidatePipelineRun`.
message ValidatePipelineRunRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  ValidatePipelineRunRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePipelineRun`.
message ValidatePipelineRunResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  ValidatePipelineRunResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

