// The request of `ReconcilePipelines`.
message ReconcilePipelinesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  Pipeline pipeline = 3;
  ReconcilePipelinesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcilePipelines`.
message ReconcilePipelinesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
