syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineValidationServiceProto";
option java_package = "com.acme.pipelines.v1";

// Checks pipelines against the rules before anything acts on them.
service PipelineValidationService {
  // Validates a pipeline.
  rpc ValidatePipeline(ValidatePipelineRequest) returns (ValidatePipelineResponse);

  // Previews a pipeline.
  rpc PreviewPipeline(PreviewPipelineRequest) returns (PreviewPipelineResponse);

  // Checks a pipeline.
  rpc CheckPipelineEligibility(CheckPipelineEligibilityRequest) returns (CheckPipelineEligibilityResponse);

  // Normalizes a pipeline.
  rpc NormalizePipeline(NormalizePipelineRequest) returns (NormalizePipelineResponse);

  // Scores a pipeline.
  rpc ScorePipeline(ScorePipelineRequest) returns (ScorePipelineResponse);

  // Returns a pipeline.
  rpc GetPipelineRules(GetPipelineRulesRequest) returns (GetPipelineRulesResponse);
}

// The request of `ValidatePipeline`.
message ValidatePipelineRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  Pipeline pipeline = 3;
  ValidatePipelineRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePipeline`.
message ValidatePipelineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Pipeline pipeline = 1;
  ValidatePipelineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

