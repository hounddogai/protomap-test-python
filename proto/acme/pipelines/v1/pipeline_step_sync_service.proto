syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineStepSyncServiceProto";
option java_package = "com.acme.pipelines.v1";

// Keeps pipeline steps in step with the systems of record in other regions.
service PipelineStepSyncService {
  // Syncs a pipeline step.
  rpc SyncPipelineSteps(SyncPipelineStepsRequest) returns (SyncPipelineStepsResponse);

  // Pushs a pipeline step.
  rpc PushPipelineStep(PushPipelineStepRequest) returns (PushPipelineStepResponse);

  // Pulls a pipeline step.
  rpc PullPipelineSteps(PullPipelineStepsRequest) returns (PullPipelineStepsResponse);

  // Reconciles a pipeline step.
  rpc ReconcilePipelineSteps(ReconcilePipelineStepsRequest) returns (ReconcilePipelineStepsResponse);

  // Exchanges changes of pipeline steps with a peer.
  rpc StreamPipelineStepChanges(stream StreamPipelineStepChangesRequest) returns (stream StreamPipelineStepChangesResponse);

  // Resolves a pipeline step.
  rpc ResolvePipelineStepConflict(ResolvePipelineStepConflictRequest) returns (ResolvePipelineStepConflictResponse);

  // Returns a pipeline step.
  rpc GetPipelineStepSyncState(GetPipelineStepSyncStateRequest) returns (GetPipelineStepSyncStateResponse);
}

// The request of `SyncPipelineSteps`.
message SyncPipelineStepsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  SyncPipelineStepsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPipelineSteps`.
message SyncPipelineStepsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  SyncPipelineStepsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPipelineStep`.
message PushPipelineStepRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  PushPipelineStepRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushPipelineStep`.
message PushPipelineStepResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  PushPipelineStepResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullPipelineSteps`.
message PullPipelineStepsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  PullPipelineStepsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
