    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  ResolvePipelineStepConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPipelineStepSyncState`.
message GetPipelineStepSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPipelineStepSyncState`.
message GetPipelineStepSyncStateResponse {
  PipelineStep pipeline_step = 1;
  acme.common.v1.OperationResult result = 2;
}
