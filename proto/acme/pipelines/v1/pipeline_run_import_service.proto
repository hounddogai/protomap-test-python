syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineRunImportServiceProto";
option java_package = "com.acme.pipelines.v1";

// Takes pipeline runs in bulk from partners and legacy systems.
service PipelineRunImportService {
  // Takes a stream of pipeline runs and answers once at the end.
  rpc ImportPipelineRuns(stream ImportPipelineRunsRequest) returns (ImportPipelineRunsResponse);

  // Returns a pipeline run.
  rpc GetPipelineRunImportStatus(GetPipelineRunImportStatusRequest) returns (GetPipelineRunImportStatusResponse);

  // Cancels a pipeline run.
  rpc CancelPipelineRunImport(CancelPipelineRunImportRequest) returns (CancelPipelineRunImportResponse);

  // Validates a pipeline run.
  rpc ValidatePipelineRunImport(ValidatePipelineRunImportRequest) returns (ValidatePipelineRunImportResponse);

  // Lists pipeline runs a page at a time.
  rpc ListPipelineRunImports(ListPipelineRunImportsRequest) returns (ListPipelineRunImportsResponse);

  // Retrys a pipeline run.
  rpc RetryPipelineRunImport(RetryPipelineRunImportRequest) returns (RetryPipelineRunImportResponse);

  // Maps a pipeline run.
  rpc MapPipelineRunImportColumns(MapPipelineRunImportColumnsRequest) returns (MapPipelineRunImportColumnsResponse);
}

// The request of `ImportPipelineRuns`.
message ImportPipelineRunsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportPipelineRunsRequest.StreamHeader header = 2;
    PipelineRun record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportPipelineRuns`.
message ImportPipelineRunsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string pipeline_run_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportPipelineRunsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetPipelineRunImportStatus`.
message GetPipelineRunImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPipelineRunImportStatus`.
message GetPipelineRunImportStatusResponse {
  PipelineRun pipeline_run = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelPipelineRunImport`.
message CancelPipelineRunImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  CancelPipelineRunImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelPipelineRunImport`.
message CancelPipelineRunImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  CancelPipelineRunImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidatePipelineRunImport`.
message ValidatePipelineRunImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  ValidatePipelineRunImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePipelineRunImport`.
message ValidatePipelineRunImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  ValidatePipelineRunImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPipelineRunImports`.
message ListPipelineRunImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PipelineRunStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPipelineRunImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPipelineRunImports`.
message ListPipelineRunImportsResponse {
  repeated PipelineRun pipeline_runs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryPipelineRunImport`.
message RetryPipelineRunImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  RetryPipelineRunImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryPipelineRunImport`.
message RetryPipelineRunImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  RetryPipelineRunImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapPipelineRunImportColumns`.
message MapPipelineRunImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  MapPipelineRunImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapPipelineRunImportColumns`.
message MapPipelineRunImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  MapPipelineRunImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
