  AdvancePipelineStepWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AdvancePipelineStepWorkflow`.
message AdvancePipelineStepWorkflowResponse {
  // What the operation decided.
  message Outcome {
