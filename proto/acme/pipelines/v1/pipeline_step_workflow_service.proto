syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineStepWorkflowServiceProto";
option java_package = "com.acme.pipelines.v1";

// Runs the long-lived workflow that takes a pipeline step from start to finish.
service PipelineStepWorkflowService {
  // Starts a pipeline step.
  rpc StartPipelineStepWorkflow(StartPipelineStepWorkflowRequest) returns (StartPipelineStepWorkflowResponse);

  // Advances a pipeline step.
  rpc AdvancePipelineStepWorkflow(AdvancePipelineStepWorkflowRequest) returns (AdvancePipelineStepWorkflowResponse);

  // Cancels a pipeline step.
  rpc CancelPipelineStepWorkflow(CancelPipelineStepWorkflowRequest) returns (CancelPipelineStepWorkflowResponse);

  // Returns a pipeline step.
  rpc InspectPipelineStepWorkflow(InspectPipelineStepWorkflowRequest) returns (InspectPipelineStepWorkflowResponse);

  // Lists pipeline steps a page at a time.
  rpc ListPipelineStepWorkflows(ListPipelineStepWorkflowsRequest) returns (ListPipelineStepWorkflowsResponse);

  // Signals a pipeline step.
  rpc SignalPipelineStepWorkflow(SignalPipelineStepWorkflowRequest) returns (SignalPipelineStepWorkflowResponse);
}

// The request of `StartPipelineStepWorkflow`.
message StartPipelineStepWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  StartPipelineStepWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPipelineStepWorkflow`.
message StartPipelineStepWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  StartPipelineStepWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AdvancePipelineStepWorkflow`.
message AdvancePipelineStepWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
