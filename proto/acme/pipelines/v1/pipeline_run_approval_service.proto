syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineRunApprovalServiceProto";
option java_package = "com.acme.pipelines.v1";

// Routes pipeline runs through approval, with escalation and delegation.
service PipelineRunApprovalService {
  // Submits a pipeline run.
  rpc SubmitPipelineRun(SubmitPipelineRunRequest) returns (SubmitPipelineRunResponse);

  // Approves a pipeline run.
  rpc ApprovePipelineRun(ApprovePipelineRunRequest) returns (ApprovePipelineRunResponse);

  // Rejects a pipeline run.
  rpc RejectPipelineRun(RejectPipelineRunRequest) returns (RejectPipelineRunResponse);

  // Escalates a pipeline run.
  rpc EscalatePipelineRun(EscalatePipelineRunRequest) returns (EscalatePipelineRunResponse);

  // Lists pipeline runs a page at a time.
  rpc ListPendingPipelineRuns(ListPendingPipelineRunsRequest) returns (ListPendingPipelineRunsResponse);

  // Delegates a pipeline run.
  rpc DelegatePipelineRunApproval(DelegatePipelineRunApprovalRequest) returns (DelegatePipelineRunApprovalResponse);

  // Recalls a pipeline run.
  rpc RecallPipelineRun(RecallPipelineRunRequest) returns (RecallPipelineRunResponse);

  // Comments a pipeline run.
  rpc CommentPipelineRunApproval(CommentPipelineRunApprovalRequest) returns (CommentPipelineRunApprovalResponse);
}

// The request of `SubmitPipelineRun`.
message SubmitPipelineRunRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  SubmitPipelineRunRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPipelineRun`.
message SubmitPipelineRunResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  SubmitPipelineRunResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

