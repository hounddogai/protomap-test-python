syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineApprovalServiceProto";
option java_package = "com.acme.pipelines.v1";

// Routes pipelines through approval, with escalation and delegation.
service PipelineApprovalService {
  // Submits a pipeline.
  rpc SubmitPipeline(SubmitPipelineRequest) returns (SubmitPipelineResponse);

  // Approves a pipeline.
  rpc ApprovePipeline(ApprovePipelineRequest) returns (ApprovePipelineResponse);

  // Rejects a pipeline.
  rpc RejectPipeline(RejectPipelineRequest) returns (RejectPipelineResponse);

  // Escalates a pipeline.
  rpc EscalatePipeline(EscalatePipelineRequest) returns (EscalatePipelineResponse);

  // Lists pipelines a page at a time.
  rpc ListPendingPipelines(ListPendingPipelinesRequest) returns (ListPendingPipelinesResponse);

  // Delegates a pipeline.
  rpc DelegatePipelineApproval(DelegatePipelineApprovalRequest) returns (DelegatePipelineApprovalResponse);

  // Returns a pipeline.
  rpc GetPipelineApprovalStatus(GetPipelineApprovalStatusRequest) returns (GetPipelineApprovalStatusResponse);
}

// The request of `SubmitPipeline`.
message SubmitPipelineRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_id = 2;
  Pipeline pipeline = 3;
  SubmitPipelineRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPipeline`.
message SubmitPipelineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Pipeline pipeline = 1;
  SubmitPipelineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

