syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineStepValidationServiceProto";
option java_package = "com.acme.pipelines.v1";

// Checks pipeline steps against the rules before anything acts on them.
service PipelineStepValidationService {
  // Validates a pipeline step.
  rpc ValidatePipelineStep(ValidatePipelineStepRequest) returns (ValidatePipelineStepResponse);

  // Previews a pipeline step.
  rpc PreviewPipelineStep(PreviewPipelineStepRequest) returns (PreviewPipelineStepResponse);

  // Checks a pipeline step.
  rpc CheckPipelineStepEligibility(CheckPipelineStepEligibilityRequest) returns (CheckPipelineStepEligibilityResponse);

  // Normalizes a pipeline step.
  rpc NormalizePipelineStep(NormalizePipelineStepRequest) returns (NormalizePipelineStepResponse);

  // Explains a pipeline step.
  rpc ExplainPipelineStepDecision(ExplainPipelineStepDecisionRequest) returns (ExplainPipelineStepDecisionResponse);

  // Scores a pipeline step.
  rpc ScorePipelineStep(ScorePipelineStepRequest) returns (ScorePipelineStepResponse);

  // Lints a pipeline step.
  rpc LintPipelineSteps(LintPipelineStepsRequest) returns (LintPipelineStepsResponse);

  // Returns a pipeline step.
  rpc GetPipelineStepRules(GetPipelineStepRulesRequest) returns (GetPipelineStepRulesResponse);
}

// The request of `ValidatePipelineStep`.
message ValidatePipelineStepRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_step_id = 2;
  PipelineStep pipeline_step = 3;
  ValidatePipelineStepRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePipelineStep`.
message ValidatePipelineStepResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineStep pipeline_step = 1;
  ValidatePipelineStepResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

