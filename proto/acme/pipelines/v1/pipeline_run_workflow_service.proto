syntax = "proto3";

package acme.pipelines.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/pipelines/v1/pipelines.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Pipelines.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/pipelines/v1;pipelinesv1";
option java_multiple_files = true;
option java_outer_classname = "PipelineRunWorkflowServiceProto";
option java_package = "com.acme.pipelines.v1";

// Runs the long-lived workflow that takes a pipeline run from start to finish.
service PipelineRunWorkflowService {
  // Starts a pipeline run.
  rpc StartPipelineRunWorkflow(StartPipelineRunWorkflowRequest) returns (StartPipelineRunWorkflowResponse);

  // Advances a pipeline run.
  rpc AdvancePipelineRunWorkflow(AdvancePipelineRunWorkflowRequest) returns (AdvancePipelineRunWorkflowResponse);

  // Cancels a pipeline run.
  rpc CancelPipelineRunWorkflow(CancelPipelineRunWorkflowRequest) returns (CancelPipelineRunWorkflowResponse);

  // Retrys a pipeline run.
  rpc RetryPipelineRunWorkflow(RetryPipelineRunWorkflowRequest) returns (RetryPipelineRunWorkflowResponse);

  // Pauses a pipeline run.
  rpc PausePipelineRunWorkflow(PausePipelineRunWorkflowRequest) returns (PausePipelineRunWorkflowResponse);

  // Resumes a pipeline run.
  rpc ResumePipelineRunWorkflow(ResumePipelineRunWorkflowRequest) returns (ResumePipelineRunWorkflowResponse);

  // Lists pipeline runs a page at a time.
  rpc ListPipelineRunWorkflows(ListPipelineRunWorkflowsRequest) returns (ListPipelineRunWorkflowsResponse);

  // Signals a pipeline run.
  rpc SignalPipelineRunWorkflow(SignalPipelineRunWorkflowRequest) returns (SignalPipelineRunWorkflowResponse);
}

// The request of `StartPipelineRunWorkflow`.
message StartPipelineRunWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pipeline_run_id = 2;
  PipelineRun pipeline_run = 3;
  StartPipelineRunWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPipelineRunWorkflow`.
message StartPipelineRunWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PipelineRun pipeline_run = 1;
  StartPipelineRunWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

