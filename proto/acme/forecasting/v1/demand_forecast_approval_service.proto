syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "DemandForecastApprovalServiceProto";
option java_package = "com.acme.forecasting.v1";

// Routes demand forecasts through approval, with escalation and delegation.
service DemandForecastApprovalService {
  // Submits a demand forecast.
  rpc SubmitDemandForecast(SubmitDemandForecastRequest) returns (SubmitDemandForecastResponse);

  // Approves a demand forecast.
  rpc ApproveDemandForecast(ApproveDemandForecastRequest) returns (ApproveDemandForecastResponse);

  // Rejects a demand forecast.
  rpc RejectDemandForecast(RejectDemandForecastRequest) returns (RejectDemandForecastResponse);

  // Escalates a demand forecast.
  rpc EscalateDemandForecast(EscalateDemandForecastRequest) returns (EscalateDemandForecastResponse);

  // Lists demand forecasts a page at a time.
  rpc ListPendingDemandForecasts(ListPendingDemandForecastsRequest) returns (ListPendingDemandForecastsResponse);

  // Comments a demand forecast.
  rpc CommentDemandForecastApproval(CommentDemandForecastApprovalRequest) returns (CommentDemandForecastApprovalResponse);
}

// The request of `SubmitDemandForecast`.
message SubmitDemandForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string demand_forecast_id = 2;
  DemandForecast demand_forecast = 3;
  SubmitDemandForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDemandForecast`.
message SubmitDemandForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DemandForecast demand_forecast = 1;
  SubmitDemandForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

