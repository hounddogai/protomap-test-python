syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastModelApprovalServiceProto";
option java_package = "com.acme.forecasting.v1";

// Routes forecast models through approval, with escalation and delegation.
service ForecastModelApprovalService {
  // Submits a forecast model.
  rpc SubmitForecastModel(SubmitForecastModelRequest) returns (SubmitForecastModelResponse);

  // Approves a forecast model.
  rpc ApproveForecastModel(ApproveForecastModelRequest) returns (ApproveForecastModelResponse);

  // Rejects a forecast model.
  rpc RejectForecastModel(RejectForecastModelRequest) returns (RejectForecastModelResponse);

  // Escalates a forecast model.
  rpc EscalateForecastModel(EscalateForecastModelRequest) returns (EscalateForecastModelResponse);

  // Lists forecast models a page at a time.
  rpc ListPendingForecastModels(ListPendingForecastModelsRequest) returns (ListPendingForecastModelsResponse);

  // Delegates a forecast model.
  rpc DelegateForecastModelApproval(DelegateForecastModelApprovalRequest) returns (DelegateForecastModelApprovalResponse);

  // Returns a forecast model.
  rpc GetForecastModelApprovalStatus(GetForecastModelApprovalStatusRequest) returns (GetForecastModelApprovalStatusResponse);

  // Comments a forecast model.
  rpc CommentForecastModelApproval(CommentForecastModelApprovalRequest) returns (CommentForecastModelApprovalResponse);
}

// The request of `SubmitForecastModel`.
message SubmitForecastModelRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  ForecastModel forecast_model = 3;
  SubmitForecastModelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitForecastModel`.
message SubmitForecastModelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ForecastModel forecast_model = 1;
  SubmitForecastModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

