syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ScenarioCalculationServiceProto";
option java_package = "com.acme.forecasting.v1";

// Computes the figures of a scenario, such as totals, taxes, and estimates.
service ScenarioCalculationService {
  // Calculates a scenario.
  rpc CalculateScenario(CalculateScenarioRequest) returns (CalculateScenarioResponse);

  // Estimates a scenario.
  rpc EstimateScenario(EstimateScenarioRequest) returns (EstimateScenarioResponse);

  // Quotes a scenario.
  rpc QuoteScenario(QuoteScenarioRequest) returns (QuoteScenarioResponse);

  // Compares a scenario.
  rpc CompareScenarioOptions(CompareScenarioOptionsRequest) returns (CompareScenarioOptionsResponse);

  // Recalculates a scenario.
  rpc RecalculateScenarios(RecalculateScenariosRequest) returns (RecalculateScenariosResponse);

  // Simulates a scenario.
  rpc SimulateScenario(SimulateScenarioRequest) returns (SimulateScenarioResponse);

  // Explains a scenario.
  rpc ExplainScenarioCalculation(ExplainScenarioCalculationRequest) returns (ExplainScenarioCalculationResponse);

  // Returns a scenario.
  rpc GetScenarioRates(GetScenarioRatesRequest) returns (GetScenarioRatesResponse);
}

// The request of `CalculateScenario`.
message CalculateScenarioRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string scenario_id = 2;
  Scenario scenario = 3;
  CalculateScenarioRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateScenario`.
message CalculateScenarioResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateScenarioResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Scenario scenario = 1;
  CalculateScenarioResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

