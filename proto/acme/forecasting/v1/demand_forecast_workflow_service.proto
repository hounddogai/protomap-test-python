syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "DemandForecastWorkflowServiceProto";
option java_package = "com.acme.forecasting.v1";

// Runs the long-lived workflow that takes a demand forecast from start to finish.
service DemandForecastWorkflowService {
  // Starts a demand forecast.
  rpc StartDemandForecastWorkflow(StartDemandForecastWorkflowRequest) returns (StartDemandForecastWorkflowResponse);

  // Advances a demand forecast.
  rpc AdvanceDemandForecastWorkflow(AdvanceDemandForecastWorkflowRequest) returns (AdvanceDemandForecastWorkflowResponse);

  // Cancels a demand forecast.
  rpc CancelDemandForecastWorkflow(CancelDemandForecastWorkflowRequest) returns (CancelDemandForecastWorkflowResponse);

  // Retrys a demand forecast.
  rpc RetryDemandForecastWorkflow(RetryDemandForecastWorkflowRequest) returns (RetryDemandForecastWorkflowResponse);

  // Pauses a demand forecast.
  rpc PauseDemandForecastWorkflow(PauseDemandForecastWorkflowRequest) returns (PauseDemandForecastWorkflowResponse);

  // Resumes a demand forecast.
  rpc ResumeDemandForecastWorkflow(ResumeDemandForecastWorkflowRequest) returns (ResumeDemandForecastWorkflowResponse);

  // Returns a demand forecast.
  rpc InspectDemandForecastWorkflow(InspectDemandForecastWorkflowRequest) returns (InspectDemandForecastWorkflowResponse);

  // Lists demand forecasts a page at a time.
  rpc ListDemandForecastWorkflows(ListDemandForecastWorkflowsRequest) returns (ListDemandForecastWorkflowsResponse);

  // Signals a demand forecast.
  rpc SignalDemandForecastWorkflow(SignalDemandForecastWorkflowRequest) returns (SignalDemandForecastWorkflowResponse);
}

// The request of `StartDemandForecastWorkflow`.
message StartDemandForecastWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string demand_forecast_id = 2;
  DemandForecast demand_forecast = 3;
  StartDemandForecastWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDemandForecastWorkflow`.
message StartDemandForecastWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DemandForecast demand_forecast = 1;
  StartDemandForecastWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

