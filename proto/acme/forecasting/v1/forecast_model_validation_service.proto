syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastModelValidationServiceProto";
option java_package = "com.acme.forecasting.v1";

// Checks forecast models against the rules before anything acts on them.
service ForecastModelValidationService {
  // Validates a forecast model.
  rpc ValidateForecastModel(ValidateForecastModelRequest) returns (ValidateForecastModelResponse);

  // Previews a forecast model.
  rpc PreviewForecastModel(PreviewForecastModelRequest) returns (PreviewForecastModelResponse);

  // Checks a forecast model.
  rpc CheckForecastModelEligibility(CheckForecastModelEligibilityRequest) returns (CheckForecastModelEligibilityResponse);

  // Normalizes a forecast model.
  rpc NormalizeForecastModel(NormalizeForecastModelRequest) returns (NormalizeForecastModelResponse);

  // Scores a forecast model.
  rpc ScoreForecastModel(ScoreForecastModelRequest) returns (ScoreForecastModelResponse);

  // Lints a forecast model.
  rpc LintForecastModels(LintForecastModelsRequest) returns (LintForecastModelsResponse);

  // Returns a forecast model.
  rpc GetForecastModelRules(GetForecastModelRulesRequest) returns (GetForecastModelRulesResponse);
}

// The request of `ValidateForecastModel`.
message ValidateForecastModelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  ForecastModel forecast_model = 3;
  ValidateForecastModelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateForecastModel`.
message ValidateForecastModelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ForecastModel forecast_model = 1;
  ValidateForecastModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

