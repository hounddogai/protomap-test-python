syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "DemandForecastValidationServiceProto";
option java_package = "com.acme.forecasting.v1";

// Checks demand forecasts against the rules before anything acts on them.
service DemandForecastValidationService {
  // Validates a demand forecast.
  rpc ValidateDemandForecast(ValidateDemandForecastRequest) returns (ValidateDemandForecastResponse);

  // Previews a demand forecast.
  rpc PreviewDemandForecast(PreviewDemandForecastRequest) returns (PreviewDemandForecastResponse);

  // Checks a demand forecast.
  rpc CheckDemandForecastEligibility(CheckDemandForecastEligibilityRequest) returns (CheckDemandForecastEligibilityResponse);

  // Normalizes a demand forecast.
  rpc NormalizeDemandForecast(NormalizeDemandForecastRequest) returns (NormalizeDemandForecastResponse);

  // Explains a demand forecast.
  rpc ExplainDemandForecastDecision(ExplainDemandForecastDecisionRequest) returns (ExplainDemandForecastDecisionResponse);

  // Lints a demand forecast.
  rpc LintDemandForecasts(LintDemandForecastsRequest) returns (LintDemandForecastsResponse);

  // Returns a demand forecast.
  rpc GetDemandForecastRules(GetDemandForecastRulesRequest) returns (GetDemandForecastRulesResponse);
}

// The request of `ValidateDemandForecast`.
message ValidateDemandForecastRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string demand_forecast_id = 2;
  DemandForecast demand_forecast = 3;
  ValidateDemandForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDemandForecast`.
message ValidateDemandForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DemandForecast demand_forecast = 1;
  ValidateDemandForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

