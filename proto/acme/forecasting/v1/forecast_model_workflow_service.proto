syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastModelWorkflowServiceProto";
option java_package = "com.acme.forecasting.v1";

// Runs the long-lived workflow that takes a forecast model from start to finish.
service ForecastModelWorkflowService {
  // Starts a forecast model.
  rpc StartForecastModelWorkflow(StartForecastModelWorkflowRequest) returns (StartForecastModelWorkflowResponse);

  // Advances a forecast model.
  rpc AdvanceForecastModelWorkflow(AdvanceForecastModelWorkflowRequest) returns (AdvanceForecastModelWorkflowResponse);

  // Cancels a forecast model.
  rpc CancelForecastModelWorkflow(CancelForecastModelWorkflowRequest) returns (CancelForecastModelWorkflowResponse);

  // Retrys a forecast model.
  rpc RetryForecastModelWorkflow(RetryForecastModelWorkflowRequest) returns (RetryForecastModelWorkflowResponse);

  // Lists forecast models a page at a time.
  rpc ListForecastModelWorkflows(ListForecastModelWorkflowsRequest) returns (ListForecastModelWorkflowsResponse);

  // Signals a forecast model.
  rpc SignalForecastModelWorkflow(SignalForecastModelWorkflowRequest) returns (SignalForecastModelWorkflowResponse);
}

// The request of `StartForecastModelWorkflow`.
message StartForecastModelWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  ForecastModel forecast_model = 3;
  StartForecastModelWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartForecastModelWorkflow`.
message StartForecastModelWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ForecastModel forecast_model = 1;
  StartForecastModelWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

