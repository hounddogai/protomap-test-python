syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastModelQueryServiceProto";
option java_package = "com.acme.forecasting.v1";

// Answers read-only questions about forecast models, for screens and reports.
service ForecastModelQueryService {
  // Returns a forecast model.
  rpc LookupForecastModel(LookupForecastModelRequest) returns (LookupForecastModelResponse);

  // Lists forecast models a page at a time.
  rpc BrowseForecastModels(BrowseForecastModelsRequest) returns (BrowseForecastModelsResponse);

  // Lists forecast models a page at a time.
  rpc FindForecastModels(FindForecastModelsRequest) returns (FindForecastModelsResponse);

  // Counts forecast models by status.
  rpc CountForecastModels(CountForecastModelsRequest) returns (CountForecastModelsResponse);

  // Returns several forecast models at once.
  rpc ResolveForecastModels(ResolveForecastModelsRequest) returns (ResolveForecastModelsResponse);

  // Streams every matching forecast model.
  rpc ExportForecastModels(ExportForecastModelsRequest) returns (stream ExportForecastModelsResponse);

  // Summarizes a forecast model.
  rpc SummarizeForecastModels(SummarizeForecastModelsRequest) returns (SummarizeForecastModelsResponse);

  // Lists forecast models a page at a time.
  rpc SuggestForecastModels(SuggestForecastModelsRequest) returns (SuggestForecastModelsResponse);

  // Returns a forecast model.
  rpc PeekForecastModel(PeekForecastModelRequest) returns (PeekForecastModelResponse);
}

// The request of `LookupForecastModel`.
message LookupForecastModelRequest {
  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupForecastModel`.
message LookupForecastModelResponse {
  ForecastModel forecast_model = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseForecastModels`.
message BrowseForecastModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseForecastModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseForecastModels`.
message BrowseForecastModelsResponse {
  repeated ForecastModel forecast_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindForecastModels`.
message FindForecastModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindForecastModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindForecastModels`.
message FindForecastModelsResponse {
  repeated ForecastModel forecast_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountForecastModels`.
message CountForecastModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountForecastModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountForecastModels`.
message CountForecastModelsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveForecastModels`.
message ResolveForecastModelsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string forecast_model_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveForecastModels`.
message ResolveForecastModelsResponse {
  repeated ForecastModel forecast_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportForecastModels`.
message ExportForecastModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportForecastModelsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportForecastModels`.
message ExportForecastModelsResponse {
  ForecastModel forecast_model = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeForecastModels`.
message SummarizeForecastModelsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  SummarizeForecastModelsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeForecastModels`.
message SummarizeForecastModelsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestForecastModels`.
message SuggestForecastModelsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestForecastModelsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestForecastModels`.
message SuggestForecastModelsResponse {
  repeated ForecastModel forecast_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekForecastModel`.
message PeekForecastModelRequest {
  acme.common.v1.RequestContext context = 1;
  string forecast_model_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekForecastModel`.
message PeekForecastModelResponse {
  ForecastModel forecast_model = 1;
  acme.common.v1.OperationResult result = 2;
}
