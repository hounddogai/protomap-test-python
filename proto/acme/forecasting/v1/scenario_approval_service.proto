syntax = "proto3";

package acme.forecasting.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forecasting/v1/forecasting.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forecasting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forecasting/v1;forecastingv1";
option java_multiple_files = true;
option java_outer_classname = "ScenarioApprovalServiceProto";
option java_package = "com.acme.forecasting.v1";

// Routes scenarios through approval, with escalation and delegation.
service ScenarioApprovalService {
  // Submits a scenario.
  rpc SubmitScenario(SubmitScenarioRequest) returns (SubmitScenarioResponse);

  // Approves a scenario.
  rpc ApproveScenario(ApproveScenarioRequest) returns (ApproveScenarioResponse);

  // Escalates a scenario.
  rpc EscalateScenario(EscalateScenarioRequest) returns (EscalateScenarioResponse);

  // Lists scenarios a page at a time.
  rpc ListPendingScenarios(ListPendingScenariosRequest) returns (ListPendingScenariosResponse);

  // Delegates a scenario.
  rpc DelegateScenarioApproval(DelegateScenarioApprovalRequest) returns (DelegateScenarioApprovalResponse);

  // Recalls a scenario.
  rpc RecallScenario(RecallScenarioRequest) returns (RecallScenarioResponse);

  // Returns a scenario.
  rpc GetScenarioApprovalStatus(GetScenarioApprovalStatusRequest) returns (GetScenarioApprovalStatusResponse);

  // Comments a scenario.
  rpc CommentScenarioApproval(CommentScenarioApprovalRequest) returns (CommentScenarioApprovalResponse);
}

// The request of `SubmitScenario`.
message SubmitScenarioRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string scenario_id = 2;
  Scenario scenario = 3;
  SubmitScenarioRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitScenario`.
message SubmitScenarioResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Scenario scenario = 1;
  SubmitScenarioResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

