syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsReportValidationServiceProto";
option java_package = "com.acme.analytics.v1";

// Checks analytics reports against the rules before anything acts on them.
service AnalyticsReportValidationService {
  // Validates an analytics report.
  rpc ValidateAnalyticsReport(ValidateAnalyticsReportRequest) returns (ValidateAnalyticsReportResponse);

  // Previews an analytics report.
  rpc PreviewAnalyticsReport(PreviewAnalyticsReportRequest) returns (PreviewAnalyticsReportResponse);

  // Normalizes an analytics report.
  rpc NormalizeAnalyticsReport(NormalizeAnalyticsReportRequest) returns (NormalizeAnalyticsReportResponse);

  // Explains an analytics report.
  rpc ExplainAnalyticsReportDecision(ExplainAnalyticsReportDecisionRequest) returns (ExplainAnalyticsReportDecisionResponse);

  // Scores an analytics report.
  rpc ScoreAnalyticsReport(ScoreAnalyticsReportRequest) returns (ScoreAnalyticsReportResponse);

  // Lints an analytics report.
  rpc LintAnalyticsReports(LintAnalyticsReportsRequest) returns (LintAnalyticsReportsResponse);

  // Returns an analytics report.
  rpc GetAnalyticsReportRules(GetAnalyticsReportRulesRequest) returns (GetAnalyticsReportRulesResponse);
}

// The request of `ValidateAnalyticsReport`.
message ValidateAnalyticsReportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_report_id = 2;
  AnalyticsReport analytics_report = 3;
  ValidateAnalyticsReportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAnalyticsReport`.
message ValidateAnalyticsReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnalyticsReport analytics_report = 1;
  ValidateAnalyticsReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

