syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "CohortWorkflowServiceProto";
option java_package = "com.acme.analytics.v1";

// Runs the long-lived workflow that takes a cohort from start to finish.
service CohortWorkflowService {
  // Starts a cohort.
  rpc StartCohortWorkflow(StartCohortWorkflowRequest) returns (StartCohortWorkflowResponse);

  // Advances a cohort.
  rpc AdvanceCohortWorkflow(AdvanceCohortWorkflowRequest) returns (AdvanceCohortWorkflowResponse);

  // Cancels a cohort.
  rpc CancelCohortWorkflow(CancelCohortWorkflowRequest) returns (CancelCohortWorkflowResponse);

  // Retrys a cohort.
  rpc RetryCohortWorkflow(RetryCohortWorkflowRequest) returns (RetryCohortWorkflowResponse);

  // Pauses a cohort.
  rpc PauseCohortWorkflow(PauseCohortWorkflowRequest) returns (PauseCohortWorkflowResponse);

  // Resumes a cohort.
  rpc ResumeCohortWorkflow(ResumeCohortWorkflowRequest) returns (ResumeCohortWorkflowResponse);

  // Returns a cohort.
  rpc InspectCohortWorkflow(InspectCohortWorkflowRequest) returns (InspectCohortWorkflowResponse);

  // Lists cohorts a page at a time.
  rpc ListCohortWorkflows(ListCohortWorkflowsRequest) returns (ListCohortWorkflowsResponse);

  // Signals a cohort.
  rpc SignalCohortWorkflow(SignalCohortWorkflowRequest) returns (SignalCohortWorkflowResponse);
}

// The request of `StartCohortWorkflow`.
message StartCohortWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  StartCohortWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCohortWorkflow`.
message StartCohortWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  StartCohortWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

