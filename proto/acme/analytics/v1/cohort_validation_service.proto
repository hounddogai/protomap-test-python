syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "CohortValidationServiceProto";
option java_package = "com.acme.analytics.v1";

// Checks cohorts against the rules before anything acts on them.
service CohortValidationService {
  // Validates a cohort.
  rpc ValidateCohort(ValidateCohortRequest) returns (ValidateCohortResponse);

  // Previews a cohort.
  rpc PreviewCohort(PreviewCohortRequest) returns (PreviewCohortResponse);

  // Checks a cohort.
  rpc CheckCohortEligibility(CheckCohortEligibilityRequest) returns (CheckCohortEligibilityResponse);

  // Normalizes a cohort.
  rpc NormalizeCohort(NormalizeCohortRequest) returns (NormalizeCohortResponse);

  // Scores a cohort.
  rpc ScoreCohort(ScoreCohortRequest) returns (ScoreCohortResponse);

  // Returns a cohort.
  rpc GetCohortRules(GetCohortRulesRequest) returns (GetCohortRulesResponse);
}

// The request of `ValidateCohort`.
message ValidateCohortRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  ValidateCohortRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCohort`.
message ValidateCohortResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  ValidateCohortResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewCohort`.
message PreviewCohortRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  PreviewCohortRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewCohort`.
message PreviewCohortResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  PreviewCohortResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CheckCohortEligibility`.
message CheckCohortEligibilityRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  CheckCohortEligibilityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CheckCohortEligibility`.
message CheckCohortEligibilityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  CheckCohortEligibilityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NormalizeCohort`.
message NormalizeCohortRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  NormalizeCohortRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeCohort`.
message NormalizeCohortResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
