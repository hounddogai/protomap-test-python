syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsReportCalculationServiceProto";
option java_package = "com.acme.analytics.v1";

// Computes the figures of an analytics report, such as totals, taxes, and estimates.
service AnalyticsReportCalculationService {
  // Calculates an analytics report.
  rpc CalculateAnalyticsReport(CalculateAnalyticsReportRequest) returns (CalculateAnalyticsReportResponse);

  // Estimates an analytics report.
  rpc EstimateAnalyticsReport(EstimateAnalyticsReportRequest) returns (EstimateAnalyticsReportResponse);

  // Quotes an analytics report.
  rpc QuoteAnalyticsReport(QuoteAnalyticsReportRequest) returns (QuoteAnalyticsReportResponse);

  // Compares an analytics report.
  rpc CompareAnalyticsReportOptions(CompareAnalyticsReportOptionsRequest) returns (CompareAnalyticsReportOptionsResponse);

  // Recalculates an analytics report.
  rpc RecalculateAnalyticsReports(RecalculateAnalyticsReportsRequest) returns (RecalculateAnalyticsReportsResponse);

  // Simulates an analytics report.
  rpc SimulateAnalyticsReport(SimulateAnalyticsReportRequest) returns (SimulateAnalyticsReportResponse);

  // Explains an analytics report.
  rpc ExplainAnalyticsReportCalculation(ExplainAnalyticsReportCalculationRequest) returns (ExplainAnalyticsReportCalculationResponse);
}

// The request of `CalculateAnalyticsReport`.
message CalculateAnalyticsReportRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_report_id = 2;
  AnalyticsReport analytics_report = 3;
  CalculateAnalyticsReportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAnalyticsReport`.
message CalculateAnalyticsReportResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAnalyticsReportResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  AnalyticsReport analytics_report = 1;
  CalculateAnalyticsReportResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

