syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "CohortApprovalServiceProto";
option java_package = "com.acme.analytics.v1";

// Routes cohorts through approval, with escalation and delegation.
service CohortApprovalService {
  // Submits a cohort.
  rpc SubmitCohort(SubmitCohortRequest) returns (SubmitCohortResponse);

  // Approves a cohort.
  rpc ApproveCohort(ApproveCohortRequest) returns (ApproveCohortResponse);

  // Rejects a cohort.
  rpc RejectCohort(RejectCohortRequest) returns (RejectCohortResponse);

  // Escalates a cohort.
  rpc EscalateCohort(EscalateCohortRequest) returns (EscalateCohortResponse);

  // Lists cohorts a page at a time.
  rpc ListPendingCohorts(ListPendingCohortsRequest) returns (ListPendingCohortsResponse);

  // Delegates a cohort.
  rpc DelegateCohortApproval(DelegateCohortApprovalRequest) returns (DelegateCohortApprovalResponse);

  // Recalls a cohort.
  rpc RecallCohort(RecallCohortRequest) returns (RecallCohortResponse);

  // Returns a cohort.
  rpc GetCohortApprovalStatus(GetCohortApprovalStatusRequest) returns (GetCohortApprovalStatusResponse);

  // Comments a cohort.
  rpc CommentCohortApproval(CommentCohortApprovalRequest) returns (CommentCohortApprovalResponse);
}

// The request of `SubmitCohort`.
message SubmitCohortRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  Cohort cohort = 3;
  SubmitCohortRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCohort`.
message SubmitCohortResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  SubmitCohortResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

