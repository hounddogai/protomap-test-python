option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsReportLifecycleServiceProto";
option java_package = "com.acme.analytics.v1";

// Moves an analytics report between the states of its lifecycle.
service AnalyticsReportLifecycleService {
  // Activates an analytics report.
  rpc ActivateAnalyticsReport(ActivateAnalyticsReportRequest) returns (ActivateAnalyticsReportResponse);

  // Suspends an analytics report.
  rpc SuspendAnalyticsReport(SuspendAnalyticsReportRequest) returns (SuspendAnalyticsReportResponse);

  // Reinstates an analytics report.
  rpc ReinstateAnalyticsReport(ReinstateAnalyticsReportRequest) returns (ReinstateAnalyticsReportResponse);

  // Terminates an analytics report.
  rpc TerminateAnalyticsReport(TerminateAnalyticsReportRequest) returns (TerminateAnalyticsReportResponse);

  // Renews an analytics report.
  rpc RenewAnalyticsReport(RenewAnalyticsReportRequest) returns (RenewAnalyticsReportResponse);

  // Expires an analytics report.
  rpc ExpireAnalyticsReport(ExpireAnalyticsReportRequest) returns (ExpireAnalyticsReportResponse);

  // Returns an analytics report.
  rpc GetAnalyticsReportLifecycle(GetAnalyticsReportLifecycleRequest) returns (GetAnalyticsReportLifecycleResponse);

  // Schedules an analytics report.
  rpc ScheduleAnalyticsReportExpiry(ScheduleAnalyticsReportExpiryRequest) returns (ScheduleAnalyticsReportExpiryResponse);
}

// The request of `ActivateAnalyticsReport`.
message ActivateAnalyticsReportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_report_id = 2;
  ActivateAnalyticsReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAnalyticsReport`.
message ActivateAnalyticsReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnalyticsReport analytics_report = 1;
  ActivateAnalyticsReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

