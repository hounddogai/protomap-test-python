syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsEventApprovalServiceProto";
option java_package = "com.acme.analytics.v1";

// Routes analytics events through approval, with escalation and delegation.
service AnalyticsEventApprovalService {
  // Submits an analytics event.
  rpc SubmitAnalyticsEvent(SubmitAnalyticsEventRequest) returns (SubmitAnalyticsEventResponse);

  // Approves an analytics event.
  rpc ApproveAnalyticsEvent(ApproveAnalyticsEventRequest) returns (ApproveAnalyticsEventResponse);

  // Rejects an analytics event.
  rpc RejectAnalyticsEvent(RejectAnalyticsEventRequest) returns (RejectAnalyticsEventResponse);

  // Escalates an analytics event.
  rpc EscalateAnalyticsEvent(EscalateAnalyticsEventRequest) returns (EscalateAnalyticsEventResponse);

  // Lists analytics events a page at a time.
  rpc ListPendingAnalyticsEvents(ListPendingAnalyticsEventsRequest) returns (ListPendingAnalyticsEventsResponse);

  // Recalls an analytics event.
  rpc RecallAnalyticsEvent(RecallAnalyticsEventRequest) returns (RecallAnalyticsEventResponse);

  // Comments an analytics event.
  rpc CommentAnalyticsEventApproval(CommentAnalyticsEventApprovalRequest) returns (CommentAnalyticsEventApprovalResponse);
}

// The request of `SubmitAnalyticsEvent`.
message SubmitAnalyticsEventRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_event_id = 2;
  AnalyticsEvent analytics_event = 3;
  SubmitAnalyticsEventRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAnalyticsEvent`.
message SubmitAnalyticsEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnalyticsEvent analytics_event = 1;
  SubmitAnalyticsEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

