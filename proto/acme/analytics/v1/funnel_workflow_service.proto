syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "FunnelWorkflowServiceProto";
option java_package = "com.acme.analytics.v1";

// Runs the long-lived workflow that takes a funnel from start to finish.
service FunnelWorkflowService {
  // Starts a funnel.
  rpc StartFunnelWorkflow(StartFunnelWorkflowRequest) returns (StartFunnelWorkflowResponse);

  // Advances a funnel.
  rpc AdvanceFunnelWorkflow(AdvanceFunnelWorkflowRequest) returns (AdvanceFunnelWorkflowResponse);

  // Cancels a funnel.
  rpc CancelFunnelWorkflow(CancelFunnelWorkflowRequest) returns (CancelFunnelWorkflowResponse);

  // Retrys a funnel.
  rpc RetryFunnelWorkflow(RetryFunnelWorkflowRequest) returns (RetryFunnelWorkflowResponse);

  // Resumes a funnel.
  rpc ResumeFunnelWorkflow(ResumeFunnelWorkflowRequest) returns (ResumeFunnelWorkflowResponse);

  // Returns a funnel.
  rpc InspectFunnelWorkflow(InspectFunnelWorkflowRequest) returns (InspectFunnelWorkflowResponse);

  // Lists funnels a page at a time.
  rpc ListFunnelWorkflows(ListFunnelWorkflowsRequest) returns (ListFunnelWorkflowsResponse);

  // Signals a funnel.
  rpc SignalFunnelWorkflow(SignalFunnelWorkflowRequest) returns (SignalFunnelWorkflowResponse);
}

// The request of `StartFunnelWorkflow`.
message StartFunnelWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string funnel_id = 2;
  Funnel funnel = 3;
  StartFunnelWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFunnelWorkflow`.
message StartFunnelWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Funnel funnel = 1;
  StartFunnelWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

