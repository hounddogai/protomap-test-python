syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "CohortLifecycleServiceProto";
option java_package = "com.acme.analytics.v1";

// Moves a cohort between the states of its lifecycle.
service CohortLifecycleService {
  // Activates a cohort.
  rpc ActivateCohort(ActivateCohortRequest) returns (ActivateCohortResponse);

  // Suspends a cohort.
  rpc SuspendCohort(SuspendCohortRequest) returns (SuspendCohortResponse);

  // Terminates a cohort.
  rpc TerminateCohort(TerminateCohortRequest) returns (TerminateCohortResponse);

  // Renews a cohort.
  rpc RenewCohort(RenewCohortRequest) returns (RenewCohortResponse);

  // Expires a cohort.
  rpc ExpireCohort(ExpireCohortRequest) returns (ExpireCohortResponse);

  // Returns a cohort.
  rpc GetCohortLifecycle(GetCohortLifecycleRequest) returns (GetCohortLifecycleResponse);
}

// The request of `ActivateCohort`.
message ActivateCohortRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cohort_id = 2;
  ActivateCohortRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCohort`.
message ActivateCohortResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Cohort cohort = 1;
  ActivateCohortResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

