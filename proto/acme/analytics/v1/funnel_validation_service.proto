syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "FunnelValidationServiceProto";
option java_package = "com.acme.analytics.v1";

// Checks funnels against the rules before anything acts on them.
service FunnelValidationService {
  // Validates a funnel.
  rpc ValidateFunnel(ValidateFunnelRequest) returns (ValidateFunnelResponse);

  // Previews a funnel.
  rpc PreviewFunnel(PreviewFunnelRequest) returns (PreviewFunnelResponse);

  // Checks a funnel.
  rpc CheckFunnelEligibility(CheckFunnelEligibilityRequest) returns (CheckFunnelEligibilityResponse);

  // Normalizes a funnel.
  rpc NormalizeFunnel(NormalizeFunnelRequest) returns (NormalizeFunnelResponse);

  // Scores a funnel.
  rpc ScoreFunnel(ScoreFunnelRequest) returns (ScoreFunnelResponse);

  // Returns a funnel.
  rpc GetFunnelRules(GetFunnelRulesRequest) returns (GetFunnelRulesResponse);
}

// The request of `ValidateFunnel`.
message ValidateFunnelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string funnel_id = 2;
  Funnel funnel = 3;
  ValidateFunnelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFunnel`.
message ValidateFunnelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Funnel funnel = 1;
  ValidateFunnelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewFunnel`.
message PreviewFunnelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
