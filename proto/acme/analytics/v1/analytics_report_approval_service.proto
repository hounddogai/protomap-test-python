syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsReportApprovalServiceProto";
option java_package = "com.acme.analytics.v1";

// Routes analytics reports through approval, with escalation and delegation.
service AnalyticsReportApprovalService {
  // Submits an analytics report.
  rpc SubmitAnalyticsReport(SubmitAnalyticsReportRequest) returns (SubmitAnalyticsReportResponse);

  // Approves an analytics report.
  rpc ApproveAnalyticsReport(ApproveAnalyticsReportRequest) returns (ApproveAnalyticsReportResponse);

  // Rejects an analytics report.
  rpc RejectAnalyticsReport(RejectAnalyticsReportRequest) returns (RejectAnalyticsReportResponse);

  // Escalates an analytics report.
  rpc EscalateAnalyticsReport(EscalateAnalyticsReportRequest) returns (EscalateAnalyticsReportResponse);

  // Lists analytics reports a page at a time.
  rpc ListPendingAnalyticsReports(ListPendingAnalyticsReportsRequest) returns (ListPendingAnalyticsReportsResponse);

  // Delegates an analytics report.
  rpc DelegateAnalyticsReportApproval(DelegateAnalyticsReportApprovalRequest) returns (DelegateAnalyticsReportApprovalResponse);

  // Recalls an analytics report.
  rpc RecallAnalyticsReport(RecallAnalyticsReportRequest) returns (RecallAnalyticsReportResponse);

  // Returns an analytics report.
  rpc GetAnalyticsReportApprovalStatus(GetAnalyticsReportApprovalStatusRequest) returns (GetAnalyticsReportApprovalStatusResponse);

  // Comments an analytics report.
  rpc CommentAnalyticsReportApproval(CommentAnalyticsReportApprovalRequest) returns (CommentAnalyticsReportApprovalResponse);
}

// The request of `SubmitAnalyticsReport`.
message SubmitAnalyticsReportRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_report_id = 2;
  AnalyticsReport analytics_report = 3;
  SubmitAnalyticsReportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAnalyticsReport`.
message SubmitAnalyticsReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnalyticsReport analytics_report = 1;
  SubmitAnalyticsReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

