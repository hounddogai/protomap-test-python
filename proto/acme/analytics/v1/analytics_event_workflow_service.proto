option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "AnalyticsEventWorkflowServiceProto";
option java_package = "com.acme.analytics.v1";

// Runs the long-lived workflow that takes an analytics event from start to finish.
service AnalyticsEventWorkflowService {
  // Starts an analytics event.
  rpc StartAnalyticsEventWorkflow(StartAnalyticsEventWorkflowRequest) returns (StartAnalyticsEventWorkflowResponse);

  // Advances an analytics event.
  rpc AdvanceAnalyticsEventWorkflow(AdvanceAnalyticsEventWorkflowRequest) returns (AdvanceAnalyticsEventWorkflowResponse);

  // Cancels an analytics event.
  rpc CancelAnalyticsEventWorkflow(CancelAnalyticsEventWorkflowRequest) returns (CancelAnalyticsEventWorkflowResponse);

  // Retrys an analytics event.
  rpc RetryAnalyticsEventWorkflow(RetryAnalyticsEventWorkflowRequest) returns (RetryAnalyticsEventWorkflowResponse);

  // Pauses an analytics event.
  rpc PauseAnalyticsEventWorkflow(PauseAnalyticsEventWorkflowRequest) returns (PauseAnalyticsEventWorkflowResponse);

  // Resumes an analytics event.
  rpc ResumeAnalyticsEventWorkflow(ResumeAnalyticsEventWorkflowRequest) returns (ResumeAnalyticsEventWorkflowResponse);

  // Returns an analytics event.
  rpc InspectAnalyticsEventWorkflow(InspectAnalyticsEventWorkflowRequest) returns (InspectAnalyticsEventWorkflowResponse);

  // Lists analytics events a page at a time.
  rpc ListAnalyticsEventWorkflows(ListAnalyticsEventWorkflowsRequest) returns (ListAnalyticsEventWorkflowsResponse);

  // Signals an analytics event.
  rpc SignalAnalyticsEventWorkflow(SignalAnalyticsEventWorkflowRequest) returns (SignalAnalyticsEventWorkflowResponse);
}

// The request of `StartAnalyticsEventWorkflow`.
message StartAnalyticsEventWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string analytics_event_id = 2;
  AnalyticsEvent analytics_event = 3;
  StartAnalyticsEventWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAnalyticsEventWorkflow`.
message StartAnalyticsEventWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnalyticsEvent analytics_event = 1;
  StartAnalyticsEventWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

