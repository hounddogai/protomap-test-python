syntax = "proto3";

package acme.analytics.v1;

import "acme/analytics/v1/analytics.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Analytics.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_outer_classname = "FunnelApprovalServiceProto";
option java_package = "com.acme.analytics.v1";

// Routes funnels through approval, with escalation and delegation.
service FunnelApprovalService {
  // Submits a funnel.
  rpc SubmitFunnel(SubmitFunnelRequest) returns (SubmitFunnelResponse);

  // Approves a funnel.
  rpc ApproveFunnel(ApproveFunnelRequest) returns (ApproveFunnelResponse);

  // Rejects a funnel.
  rpc RejectFunnel(RejectFunnelRequest) returns (RejectFunnelResponse);

  // Escalates a funnel.
  rpc EscalateFunnel(EscalateFunnelRequest) returns (EscalateFunnelResponse);

  // Lists funnels a page at a time.
  rpc ListPendingFunnels(ListPendingFunnelsRequest) returns (ListPendingFunnelsResponse);

  // Delegates a funnel.
  rpc DelegateFunnelApproval(DelegateFunnelApprovalRequest) returns (DelegateFunnelApprovalResponse);

  // Recalls a funnel.
  rpc RecallFunnel(RecallFunnelRequest) returns (RecallFunnelResponse);

  // Returns a funnel.
  rpc GetFunnelApprovalStatus(GetFunnelApprovalStatusRequest) returns (GetFunnelApprovalStatusResponse);

  // Comments a funnel.
  rpc CommentFunnelApproval(CommentFunnelApprovalRequest) returns (CommentFunnelApprovalResponse);
}

// The request of `SubmitFunnel`.
message SubmitFunnelRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string funnel_id = 2;
  Funnel funnel = 3;
  SubmitFunnelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFunnel`.
message SubmitFunnelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Funnel funnel = 1;
  SubmitFunnelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

