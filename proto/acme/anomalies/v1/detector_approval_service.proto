syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "DetectorApprovalServiceProto";
option java_package = "com.acme.anomalies.v1";

// Routes detectors through approval, with escalation and delegation.
service DetectorApprovalService {
  // Submits a detector.
  rpc SubmitDetector(SubmitDetectorRequest) returns (SubmitDetectorResponse);

  // Approves a detector.
  rpc ApproveDetector(ApproveDetectorRequest) returns (ApproveDetectorResponse);

  // Rejects a detector.
  rpc RejectDetector(RejectDetectorRequest) returns (RejectDetectorResponse);

  // Escalates a detector.
  rpc EscalateDetector(EscalateDetectorRequest) returns (EscalateDetectorResponse);

  // Lists detectors a page at a time.
  rpc ListPendingDetectors(ListPendingDetectorsRequest) returns (ListPendingDetectorsResponse);

  // Delegates a detector.
  rpc DelegateDetectorApproval(DelegateDetectorApprovalRequest) returns (DelegateDetectorApprovalResponse);

  // Recalls a detector.
  rpc RecallDetector(RecallDetectorRequest) returns (RecallDetectorResponse);

  // Returns a detector.
  rpc GetDetectorApprovalStatus(GetDetectorApprovalStatusRequest) returns (GetDetectorApprovalStatusResponse);

  // Comments a detector.
  rpc CommentDetectorApproval(CommentDetectorApprovalRequest) returns (CommentDetectorApprovalResponse);
}

// The request of `SubmitDetector`.
message SubmitDetectorRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string detector_id = 2;
  Detector detector = 3;
  SubmitDetectorRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDetector`.
message SubmitDetectorResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Detector detector = 1;
  SubmitDetectorResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

