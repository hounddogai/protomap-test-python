syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomalyWorkflowServiceProto";
option java_package = "com.acme.anomalies.v1";

// Runs the long-lived workflow that takes an anomaly from start to finish.
service AnomalyWorkflowService {
  // Starts an anomaly.
  rpc StartAnomalyWorkflow(StartAnomalyWorkflowRequest) returns (StartAnomalyWorkflowResponse);

  // Advances an anomaly.
  rpc AdvanceAnomalyWorkflow(AdvanceAnomalyWorkflowRequest) returns (AdvanceAnomalyWorkflowResponse);

  // Cancels an anomaly.
  rpc CancelAnomalyWorkflow(CancelAnomalyWorkflowRequest) returns (CancelAnomalyWorkflowResponse);

  // Retrys an anomaly.
  rpc RetryAnomalyWorkflow(RetryAnomalyWorkflowRequest) returns (RetryAnomalyWorkflowResponse);

  // Pauses an anomaly.
  rpc PauseAnomalyWorkflow(PauseAnomalyWorkflowRequest) returns (PauseAnomalyWorkflowResponse);

  // Resumes an anomaly.
  rpc ResumeAnomalyWorkflow(ResumeAnomalyWorkflowRequest) returns (ResumeAnomalyWorkflowResponse);

  // Lists anomalies a page at a time.
  rpc ListAnomalyWorkflows(ListAnomalyWorkflowsRequest) returns (ListAnomalyWorkflowsResponse);

  // Signals an anomaly.
  rpc SignalAnomalyWorkflow(SignalAnomalyWorkflowRequest) returns (SignalAnomalyWorkflowResponse);
}

// The request of `StartAnomalyWorkflow`.
message StartAnomalyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_id = 2;
  Anomaly anomaly = 3;
  StartAnomalyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAnomalyWorkflow`.
message StartAnomalyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Anomaly anomaly = 1;
  StartAnomalyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

