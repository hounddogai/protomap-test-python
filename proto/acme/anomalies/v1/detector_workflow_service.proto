syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "DetectorWorkflowServiceProto";
option java_package = "com.acme.anomalies.v1";

// Runs the long-lived workflow that takes a detector from start to finish.
service DetectorWorkflowService {
  // Starts a detector.
  rpc StartDetectorWorkflow(StartDetectorWorkflowRequest) returns (StartDetectorWorkflowResponse);

  // Advances a detector.
  rpc AdvanceDetectorWorkflow(AdvanceDetectorWorkflowRequest) returns (AdvanceDetectorWorkflowResponse);

  // Cancels a detector.
  rpc CancelDetectorWorkflow(CancelDetectorWorkflowRequest) returns (CancelDetectorWorkflowResponse);

  // Retrys a detector.
  rpc RetryDetectorWorkflow(RetryDetectorWorkflowRequest) returns (RetryDetectorWorkflowResponse);

  // Returns a detector.
  rpc InspectDetectorWorkflow(InspectDetectorWorkflowRequest) returns (InspectDetectorWorkflowResponse);

  // Lists detectors a page at a time.
  rpc ListDetectorWorkflows(ListDetectorWorkflowsRequest) returns (ListDetectorWorkflowsResponse);

  // Signals a detector.
  rpc SignalDetectorWorkflow(SignalDetectorWorkflowRequest) returns (SignalDetectorWorkflowResponse);
}

// The request of `StartDetectorWorkflow`.
message StartDetectorWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string detector_id = 2;
  Detector detector = 3;
  StartDetectorWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDetectorWorkflow`.
message StartDetectorWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Detector detector = 1;
  StartDetectorWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

