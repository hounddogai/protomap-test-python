syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "DetectorValidationServiceProto";
option java_package = "com.acme.anomalies.v1";

// Checks detectors against the rules before anything acts on them.
service DetectorValidationService {
  // Validates a detector.
  rpc ValidateDetector(ValidateDetectorRequest) returns (ValidateDetectorResponse);

  // Previews a detector.
  rpc PreviewDetector(PreviewDetectorRequest) returns (PreviewDetectorResponse);

  // Checks a detector.
  rpc CheckDetectorEligibility(CheckDetectorEligibilityRequest) returns (CheckDetectorEligibilityResponse);

  // Normalizes a detector.
  rpc NormalizeDetector(NormalizeDetectorRequest) returns (NormalizeDetectorResponse);

  // Explains a detector.
  rpc ExplainDetectorDecision(ExplainDetectorDecisionRequest) returns (ExplainDetectorDecisionResponse);

  // Scores a detector.
  rpc ScoreDetector(ScoreDetectorRequest) returns (ScoreDetectorResponse);

  // Lints a detector.
  rpc LintDetectors(LintDetectorsRequest) returns (LintDetectorsResponse);
}

// The request of `ValidateDetector`.
message ValidateDetectorRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string detector_id = 2;
  Detector detector = 3;
  ValidateDetectorRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDetector`.
message ValidateDetectorResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Detector detector = 1;
  ValidateDetectorResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

