  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAnomalyFeedbackWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAnomalyFeedbackWorkflows`.
message ListAnomalyFeedbackWorkflowsResponse {
