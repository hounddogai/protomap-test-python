syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomalyFeedbackWorkflowServiceProto";
option java_package = "com.acme.anomalies.v1";

// Runs the long-lived workflow that takes an anomaly feedback from start to finish.
service AnomalyFeedbackWorkflowService {
  // Starts an anomaly feedback.
  rpc StartAnomalyFeedbackWorkflow(StartAnomalyFeedbackWorkflowRequest) returns (StartAnomalyFeedbackWorkflowResponse);

  // Advances an anomaly feedback.
  rpc AdvanceAnomalyFeedbackWorkflow(AdvanceAnomalyFeedbackWorkflowRequest) returns (AdvanceAnomalyFeedbackWorkflowResponse);

  // Cancels an anomaly feedback.
  rpc CancelAnomalyFeedbackWorkflow(CancelAnomalyFeedbackWorkflowRequest) returns (CancelAnomalyFeedbackWorkflowResponse);

  // Retrys an anomaly feedback.
  rpc RetryAnomalyFeedbackWorkflow(RetryAnomalyFeedbackWorkflowRequest) returns (RetryAnomalyFeedbackWorkflowResponse);

  // Pauses an anomaly feedback.
  rpc PauseAnomalyFeedbackWorkflow(PauseAnomalyFeedbackWorkflowRequest) returns (PauseAnomalyFeedbackWorkflowResponse);

  // Resumes an anomaly feedback.
  rpc ResumeAnomalyFeedbackWorkflow(ResumeAnomalyFeedbackWorkflowRequest) returns (ResumeAnomalyFeedbackWorkflowResponse);

  // Returns an anomaly feedback.
  rpc InspectAnomalyFeedbackWorkflow(InspectAnomalyFeedbackWorkflowRequest) returns (InspectAnomalyFeedbackWorkflowResponse);

  // Lists anomaly feedbacks a page at a time.
  rpc ListAnomalyFeedbackWorkflows(ListAnomalyFeedbackWorkflowsRequest) returns (ListAnomalyFeedbackWorkflowsResponse);

  // Signals an anomaly feedback.
  rpc SignalAnomalyFeedbackWorkflow(SignalAnomalyFeedbackWorkflowRequest) returns (SignalAnomalyFeedbackWorkflowResponse);
}

// The request of `StartAnomalyFeedbackWorkflow`.
message StartAnomalyFeedbackWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_feedback_id = 2;
  AnomalyFeedback anomaly_feedback = 3;
  StartAnomalyFeedbackWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAnomalyFeedbackWorkflow`.
message StartAnomalyFeedbackWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnomalyFeedback anomaly_feedback = 1;
  StartAnomalyFeedbackWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

