syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomalyFeedbackValidationServiceProto";
option java_package = "com.acme.anomalies.v1";

// Checks anomaly feedbacks against the rules before anything acts on them.
service AnomalyFeedbackValidationService {
  // Validates an anomaly feedback.
  rpc ValidateAnomalyFeedback(ValidateAnomalyFeedbackRequest) returns (ValidateAnomalyFeedbackResponse);

  // Previews an anomaly feedback.
  rpc PreviewAnomalyFeedback(PreviewAnomalyFeedbackRequest) returns (PreviewAnomalyFeedbackResponse);

  // Checks an anomaly feedback.
  rpc CheckAnomalyFeedbackEligibility(CheckAnomalyFeedbackEligibilityRequest) returns (CheckAnomalyFeedbackEligibilityResponse);

  // Normalizes an anomaly feedback.
  rpc NormalizeAnomalyFeedback(NormalizeAnomalyFeedbackRequest) returns (NormalizeAnomalyFeedbackResponse);

  // Explains an anomaly feedback.
  rpc ExplainAnomalyFeedbackDecision(ExplainAnomalyFeedbackDecisionRequest) returns (ExplainAnomalyFeedbackDecisionResponse);

  // Scores an anomaly feedback.
  rpc ScoreAnomalyFeedback(ScoreAnomalyFeedbackRequest) returns (ScoreAnomalyFeedbackResponse);

  // Lints an anomaly feedback.
  rpc LintAnomalyFeedbacks(LintAnomalyFeedbacksRequest) returns (LintAnomalyFeedbacksResponse);

  // Returns an anomaly feedback.
  rpc GetAnomalyFeedbackRules(GetAnomalyFeedbackRulesRequest) returns (GetAnomalyFeedbackRulesResponse);
}

// The request of `ValidateAnomalyFeedback`.
message ValidateAnomalyFeedbackRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_feedback_id = 2;
  AnomalyFeedback anomaly_feedback = 3;
  ValidateAnomalyFeedbackRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAnomalyFeedback`.
message ValidateAnomalyFeedbackResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AnomalyFeedback anomaly_feedback = 1;
  ValidateAnomalyFeedbackResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

