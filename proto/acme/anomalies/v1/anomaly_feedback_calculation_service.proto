  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_feedback_id = 2;
  AnomalyFeedback anomaly_feedback = 3;
  ExplainAnomalyFeedbackCalculationRequest.Details details = 4;
  string reason = 5;
