syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomalyFeedbackCalculationServiceProto";
option java_package = "com.acme.anomalies.v1";

// Computes the figures of an anomaly feedback, such as totals, taxes, and estimates.
service AnomalyFeedbackCalculationService {
  // Calculates an anomaly feedback.
  rpc CalculateAnomalyFeedback(CalculateAnomalyFeedbackRequest) returns (CalculateAnomalyFeedbackResponse);

  // Estimates an anomaly feedback.
  rpc EstimateAnomalyFeedback(EstimateAnomalyFeedbackRequest) returns (EstimateAnomalyFeedbackResponse);

  // Quotes an anomaly feedback.
  rpc QuoteAnomalyFeedback(QuoteAnomalyFeedbackRequest) returns (QuoteAnomalyFeedbackResponse);

  // Compares an anomaly feedback.
  rpc CompareAnomalyFeedbackOptions(CompareAnomalyFeedbackOptionsRequest) returns (CompareAnomalyFeedbackOptionsResponse);

  // Recalculates an anomaly feedback.
  rpc RecalculateAnomalyFeedbacks(RecalculateAnomalyFeedbacksRequest) returns (RecalculateAnomalyFeedbacksResponse);

  // Simulates an anomaly feedback.
  rpc SimulateAnomalyFeedback(SimulateAnomalyFeedbackRequest) returns (SimulateAnomalyFeedbackResponse);

  // Explains an anomaly feedback.
  rpc ExplainAnomalyFeedbackCalculation(ExplainAnomalyFeedbackCalculationRequest) returns (ExplainAnomalyFeedbackCalculationResponse);

  // Returns an anomaly feedback.
  rpc GetAnomalyFeedbackRates(GetAnomalyFeedbackRatesRequest) returns (GetAnomalyFeedbackRatesResponse);
}

// The request of `CalculateAnomalyFeedback`.
message CalculateAnomalyFeedbackRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_feedback_id = 2;
  AnomalyFeedback anomaly_feedback = 3;
  CalculateAnomalyFeedbackRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAnomalyFeedback`.
message CalculateAnomalyFeedbackResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAnomalyFeedbackResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  AnomalyFeedback anomaly_feedback = 1;
  CalculateAnomalyFeedbackResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

