syntax = "proto3";

package acme.anomalies.v1;

import "acme/anomalies/v1/anomalies.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Anomalies.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/anomalies/v1;anomaliesv1";
option java_multiple_files = true;
option java_outer_classname = "AnomalyValidationServiceProto";
option java_package = "com.acme.anomalies.v1";

// Checks anomalies against the rules before anything acts on them.
service AnomalyValidationService {
  // Validates an anomaly.
  rpc ValidateAnomaly(ValidateAnomalyRequest) returns (ValidateAnomalyResponse);

  // Previews an anomaly.
  rpc PreviewAnomaly(PreviewAnomalyRequest) returns (PreviewAnomalyResponse);

  // Checks an anomaly.
  rpc CheckAnomalyEligibility(CheckAnomalyEligibilityRequest) returns (CheckAnomalyEligibilityResponse);

  // Normalizes an anomaly.
  rpc NormalizeAnomaly(NormalizeAnomalyRequest) returns (NormalizeAnomalyResponse);

  // Explains an anomaly.
  rpc ExplainAnomalyDecision(ExplainAnomalyDecisionRequest) returns (ExplainAnomalyDecisionResponse);

  // Scores an anomaly.
  rpc ScoreAnomaly(ScoreAnomalyRequest) returns (ScoreAnomalyResponse);

  // Lints an anomaly.
  rpc LintAnomalies(LintAnomaliesRequest) returns (LintAnomaliesResponse);
}

// The request of `ValidateAnomaly`.
message ValidateAnomalyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string anomaly_id = 2;
  Anomaly anomaly = 3;
  ValidateAnomalyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAnomaly`.
message ValidateAnomalyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Anomaly anomaly = 1;
  ValidateAnomalyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

