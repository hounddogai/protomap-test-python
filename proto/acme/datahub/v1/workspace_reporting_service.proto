syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "WorkspaceReportingServiceProto";
option java_package = "com.acme.datahub.v1";

// Builds and schedules reports about workspaces.
service WorkspaceReportingService {
  // Generates a workspace.
  rpc GenerateWorkspaceReport(GenerateWorkspaceReportRequest) returns (GenerateWorkspaceReportResponse);

  // Returns a workspace.
  rpc FetchWorkspaceReport(FetchWorkspaceReportRequest) returns (FetchWorkspaceReportResponse);

  // Streams the changes of workspaces as they happen.
  rpc StreamWorkspaceMetrics(StreamWorkspaceMetricsRequest) returns (stream StreamWorkspaceMetricsResponse);

  // Lists workspaces a page at a time.
  rpc ListWorkspaceReports(ListWorkspaceReportsRequest) returns (ListWorkspaceReportsResponse);

  // Shares a workspace.
  rpc ShareWorkspaceReport(ShareWorkspaceReportRequest) returns (ShareWorkspaceReportResponse);

  // Counts workspaces by status.
  rpc CountWorkspaceTotals(CountWorkspaceTotalsRequest) returns (CountWorkspaceTotalsResponse);

  // Deletes a workspace.
  rpc DeleteWorkspaceReport(DeleteWorkspaceReportRequest) returns (DeleteWorkspaceReportResponse);
}

// The request of `GenerateWorkspaceReport`.
message GenerateWorkspaceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  GenerateWorkspaceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateWorkspaceReport`.
message GenerateWorkspaceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchWorkspaceReport`.
message FetchWorkspaceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchWorkspaceReport`.
message FetchWorkspaceReportResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamWorkspaceMetrics`.
message StreamWorkspaceMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamWorkspaceMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamWorkspaceMetrics`.
message StreamWorkspaceMetricsResponse {
  Workspace workspace = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListWorkspaceReports`.
message ListWorkspaceReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWorkspaceReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWorkspaceReports`.
message ListWorkspaceReportsResponse {
  repeated Workspace workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareWorkspaceReport`.
message ShareWorkspaceReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  ShareWorkspaceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareWorkspaceReport`.
message ShareWorkspaceReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  ShareWorkspaceReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountWorkspaceTotals`.
message CountWorkspaceTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountWorkspaceTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountWorkspaceTotals`.
message CountWorkspaceTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteWorkspaceReport`.
message DeleteWorkspaceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteWorkspaceReport`.
message DeleteWorkspaceReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
