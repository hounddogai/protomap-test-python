syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/datahub/v1/datahub.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "WorkspaceApprovalServiceProto";
option java_package = "com.acme.datahub.v1";

// Routes workspaces through approval, with escalation and delegation.
service WorkspaceApprovalService {
  // Submits a workspace.
  rpc SubmitWorkspace(SubmitWorkspaceRequest) returns (SubmitWorkspaceResponse);

  // Approves a workspace.
  rpc ApproveWorkspace(ApproveWorkspaceRequest) returns (ApproveWorkspaceResponse);

  // Escalates a workspace.
  rpc EscalateWorkspace(EscalateWorkspaceRequest) returns (EscalateWorkspaceResponse);

  // Delegates a workspace.
  rpc DelegateWorkspaceApproval(DelegateWorkspaceApprovalRequest) returns (DelegateWorkspaceApprovalResponse);

  // Recalls a workspace.
  rpc RecallWorkspace(RecallWorkspaceRequest) returns (RecallWorkspaceResponse);

  // Comments a workspace.
  rpc CommentWorkspaceApproval(CommentWorkspaceApprovalRequest) returns (CommentWorkspaceApprovalResponse);
}

// The request of `SubmitWorkspace`.
message SubmitWorkspaceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  Workspace workspace = 3;
  SubmitWorkspaceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWorkspace`.
message SubmitWorkspaceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  SubmitWorkspaceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

