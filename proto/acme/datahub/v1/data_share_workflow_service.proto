syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareWorkflowServiceProto";
option java_package = "com.acme.datahub.v1";

// Runs the long-lived workflow that takes a data share from start to finish.
service DataShareWorkflowService {
  // Starts a data share.
  rpc StartDataShareWorkflow(StartDataShareWorkflowRequest) returns (StartDataShareWorkflowResponse);

  // Advances a data share.
  rpc AdvanceDataShareWorkflow(AdvanceDataShareWorkflowRequest) returns (AdvanceDataShareWorkflowResponse);

  // Cancels a data share.
  rpc CancelDataShareWorkflow(CancelDataShareWorkflowRequest) returns (CancelDataShareWorkflowResponse);

  // Retrys a data share.
  rpc RetryDataShareWorkflow(RetryDataShareWorkflowRequest) returns (RetryDataShareWorkflowResponse);

  // Pauses a data share.
  rpc PauseDataShareWorkflow(PauseDataShareWorkflowRequest) returns (PauseDataShareWorkflowResponse);

  // Resumes a data share.
  rpc ResumeDataShareWorkflow(ResumeDataShareWorkflowRequest) returns (ResumeDataShareWorkflowResponse);

  // Returns a data share.
  rpc InspectDataShareWorkflow(InspectDataShareWorkflowRequest) returns (InspectDataShareWorkflowResponse);

  // Lists data shares a page at a time.
  rpc ListDataShareWorkflows(ListDataShareWorkflowsRequest) returns (ListDataShareWorkflowsResponse);

  // Signals a data share.
  rpc SignalDataShareWorkflow(SignalDataShareWorkflowRequest) returns (SignalDataShareWorkflowResponse);
}

// The request of `StartDataShareWorkflow`.
message StartDataShareWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  DataShare data_share = 3;
  StartDataShareWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDataShareWorkflow`.
message StartDataShareWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  StartDataShareWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

