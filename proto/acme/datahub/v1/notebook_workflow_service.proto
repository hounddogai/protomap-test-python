syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "NotebookWorkflowServiceProto";
option java_package = "com.acme.datahub.v1";

// Runs the long-lived workflow that takes a notebook from start to finish.
service NotebookWorkflowService {
  // Starts a notebook.
  rpc StartNotebookWorkflow(StartNotebookWorkflowRequest) returns (StartNotebookWorkflowResponse);

  // Advances a notebook.
  rpc AdvanceNotebookWorkflow(AdvanceNotebookWorkflowRequest) returns (AdvanceNotebookWorkflowResponse);

  // Cancels a notebook.
  rpc CancelNotebookWorkflow(CancelNotebookWorkflowRequest) returns (CancelNotebookWorkflowResponse);

  // Retrys a notebook.
  rpc RetryNotebookWorkflow(RetryNotebookWorkflowRequest) returns (RetryNotebookWorkflowResponse);

  // Pauses a notebook.
  rpc PauseNotebookWorkflow(PauseNotebookWorkflowRequest) returns (PauseNotebookWorkflowResponse);

  // Resumes a notebook.
  rpc ResumeNotebookWorkflow(ResumeNotebookWorkflowRequest) returns (ResumeNotebookWorkflowResponse);

  // Lists notebooks a page at a time.
  rpc ListNotebookWorkflows(ListNotebookWorkflowsRequest) returns (ListNotebookWorkflowsResponse);

  // Signals a notebook.
  rpc SignalNotebookWorkflow(SignalNotebookWorkflowRequest) returns (SignalNotebookWorkflowResponse);
}

// The request of `StartNotebookWorkflow`.
message StartNotebookWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  Notebook notebook = 3;
  StartNotebookWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartNotebookWorkflow`.
message StartNotebookWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  StartNotebookWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

