syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "NotebookIntegrationServiceProto";
option java_package = "com.acme.datahub.v1";

// Connects external systems that send notebook events.
service NotebookIntegrationService {
  // Connects a notebook.
  rpc ConnectNotebookSource(ConnectNotebookSourceRequest) returns (ConnectNotebookSourceResponse);

  // Disconnects a notebook.
  rpc DisconnectNotebookSource(DisconnectNotebookSourceRequest) returns (DisconnectNotebookSourceResponse);

  // Takes a stream of notebooks and answers once at the end.
  rpc IngestNotebookEvents(stream IngestNotebookEventsRequest) returns (IngestNotebookEventsResponse);

  // Replays a notebook.
  rpc ReplayNotebookEvents(ReplayNotebookEventsRequest) returns (ReplayNotebookEventsResponse);

  // Acknowledges a notebook.
  rpc AcknowledgeNotebookEvent(AcknowledgeNotebookEventRequest) returns (AcknowledgeNotebookEventResponse);

  // Exchanges changes of notebooks with a peer.
  rpc RelayNotebookMessages(stream RelayNotebookMessagesRequest) returns (stream RelayNotebookMessagesResponse);
}

// The request of `ConnectNotebookSource`.
message ConnectNotebookSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  ConnectNotebookSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectNotebookSource`.
message ConnectNotebookSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  ConnectNotebookSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectNotebookSource`.
message DisconnectNotebookSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  DisconnectNotebookSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `DisconnectNotebookSource`.
message DisconnectNotebookSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  DisconnectNotebookSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `IngestNotebookEvents`.
message IngestNotebookEventsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    IngestNotebookEventsRequest.StreamHeader header = 2;
    Notebook record = 3;
  }
  int64 sequence = 4;
}

// The response of `IngestNotebookEvents`.
message IngestNotebookEventsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string notebook_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated IngestNotebookEventsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ReplayNotebookEvents`.
message ReplayNotebookEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  ReplayNotebookEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReplayNotebookEvents`.
message ReplayNotebookEventsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  ReplayNotebookEventsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AcknowledgeNotebookEvent`.
message AcknowledgeNotebookEventRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  AcknowledgeNotebookEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `AcknowledgeNotebookEvent`.
message AcknowledgeNotebookEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  AcknowledgeNotebookEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RelayNotebookMessages`.
message RelayNotebookMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Notebook change = 2;
    RelayNotebookMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayNotebookMessages`.
message RelayNotebookMessagesResponse {
  Notebook notebook = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
