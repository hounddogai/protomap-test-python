syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareNotificationServiceProto";
option java_package = "com.acme.datahub.v1";

// Tells the people who follow a data share what changed.
service DataShareNotificationService {
  // Subscribes a data share.
  rpc SubscribeDataShareUpdates(SubscribeDataShareUpdatesRequest) returns (SubscribeDataShareUpdatesResponse);

  // Unsubscribes a data share.
  rpc UnsubscribeDataShareUpdates(UnsubscribeDataShareUpdatesRequest) returns (UnsubscribeDataShareUpdatesResponse);

  // Notifys a data share.
  rpc NotifyDataShareWatchers(NotifyDataShareWatchersRequest) returns (NotifyDataShareWatchersResponse);

  // Lists data shares a page at a time.
  rpc ListDataShareSubscriptions(ListDataShareSubscriptionsRequest) returns (ListDataShareSubscriptionsResponse);

  // Sends a data share.
  rpc SendDataShareTestNotice(SendDataShareTestNoticeRequest) returns (SendDataShareTestNoticeResponse);

  // Returns a data share.
  rpc GetDataSharePreferences(GetDataSharePreferencesRequest) returns (GetDataSharePreferencesResponse);
}

// The request of `SubscribeDataShareUpdates`.
message SubscribeDataShareUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  SubscribeDataShareUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDataShareUpdates`.
message SubscribeDataShareUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  SubscribeDataShareUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDataShareUpdates`.
message UnsubscribeDataShareUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  UnsubscribeDataShareUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDataShareUpdates`.
message UnsubscribeDataShareUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  UnsubscribeDataShareUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDataShareWatchers`.
message NotifyDataShareWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  NotifyDataShareWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyDataShareWatchers`.
message NotifyDataShareWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  NotifyDataShareWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDataShareSubscriptions`.
message ListDataShareSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDataShareSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDataShareSubscriptions`.
message ListDataShareSubscriptionsResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendDataShareTestNotice`.
message SendDataShareTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  SendDataShareTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendDataShareTestNotice`.
message SendDataShareTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  SendDataShareTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDataSharePreferences`.
message GetDataSharePreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDataSharePreferences`.
message GetDataSharePreferencesResponse {
  DataShare data_share = 1;
  acme.common.v1.OperationResult result = 2;
}
