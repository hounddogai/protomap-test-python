syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareQueryServiceProto";
option java_package = "com.acme.datahub.v1";

// Answers read-only questions about data shares, for screens and reports.
service DataShareQueryService {
  // Returns a data share.
  rpc LookupDataShare(LookupDataShareRequest) returns (LookupDataShareResponse);

  // Lists data shares a page at a time.
  rpc BrowseDataShares(BrowseDataSharesRequest) returns (BrowseDataSharesResponse);

  // Lists data shares a page at a time.
  rpc FindDataShares(FindDataSharesRequest) returns (FindDataSharesResponse);

  // Counts data shares by status.
  rpc CountDataShares(CountDataSharesRequest) returns (CountDataSharesResponse);

  // Returns several data shares at once.
  rpc ResolveDataShares(ResolveDataSharesRequest) returns (ResolveDataSharesResponse);

  // Streams every matching data share.
  rpc ExportDataShares(ExportDataSharesRequest) returns (stream ExportDataSharesResponse);

  // Summarizes a data share.
  rpc SummarizeDataShares(SummarizeDataSharesRequest) returns (SummarizeDataSharesResponse);

  // Lists data shares a page at a time.
  rpc SuggestDataShares(SuggestDataSharesRequest) returns (SuggestDataSharesResponse);

  // Returns a data share.
  rpc PeekDataShare(PeekDataShareRequest) returns (PeekDataShareResponse);
}

// The request of `LookupDataShare`.
message LookupDataShareRequest {
  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDataShare`.
message LookupDataShareResponse {
  DataShare data_share = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDataShares`.
message BrowseDataSharesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDataSharesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDataShares`.
message BrowseDataSharesResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDataShares`.
message FindDataSharesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDataSharesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDataShares`.
message FindDataSharesResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDataShares`.
message CountDataSharesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDataSharesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDataShares`.
message CountDataSharesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDataShares`.
message ResolveDataSharesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string data_share_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDataShares`.
message ResolveDataSharesResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDataShares`.
message ExportDataSharesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDataSharesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDataShares`.
message ExportDataSharesResponse {
  DataShare data_share = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDataShares`.
message SummarizeDataSharesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  SummarizeDataSharesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDataShares`.
message SummarizeDataSharesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDataShares`.
message SuggestDataSharesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDataSharesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDataShares`.
message SuggestDataSharesResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekDataShare`.
message PeekDataShareRequest {
  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDataShare`.
message PeekDataShareResponse {
  DataShare data_share = 1;
  acme.common.v1.OperationResult result = 2;
}
