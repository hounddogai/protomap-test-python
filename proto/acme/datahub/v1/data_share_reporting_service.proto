syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareReportingServiceProto";
option java_package = "com.acme.datahub.v1";

// Builds and schedules reports about data shares.
service DataShareReportingService {
  // Generates a data share.
  rpc GenerateDataShareReport(GenerateDataShareReportRequest) returns (GenerateDataShareReportResponse);

  // Returns a data share.
  rpc FetchDataShareReport(FetchDataShareReportRequest) returns (FetchDataShareReportResponse);

  // Schedules a data share.
  rpc ScheduleDataShareReport(ScheduleDataShareReportRequest) returns (ScheduleDataShareReportResponse);

  // Streams the changes of data shares as they happen.
  rpc StreamDataShareMetrics(StreamDataShareMetricsRequest) returns (stream StreamDataShareMetricsResponse);

  // Lists data shares a page at a time.
  rpc ListDataShareReports(ListDataShareReportsRequest) returns (ListDataShareReportsResponse);

  // Shares a data share.
  rpc ShareDataShareReport(ShareDataShareReportRequest) returns (ShareDataShareReportResponse);

  // Counts data shares by status.
  rpc CountDataShareTotals(CountDataShareTotalsRequest) returns (CountDataShareTotalsResponse);

  // Deletes a data share.
  rpc DeleteDataShareReport(DeleteDataShareReportRequest) returns (DeleteDataShareReportResponse);
}

// The request of `GenerateDataShareReport`.
message GenerateDataShareReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  GenerateDataShareReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDataShareReport`.
message GenerateDataShareReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDataShareReport`.
message FetchDataShareReportRequest {
  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDataShareReport`.
message FetchDataShareReportResponse {
  DataShare data_share = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDataShareReport`.
message ScheduleDataShareReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  ScheduleDataShareReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDataShareReport`.
message ScheduleDataShareReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDataShareMetrics`.
message StreamDataShareMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDataShareMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDataShareMetrics`.
message StreamDataShareMetricsResponse {
  DataShare data_share = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDataShareReports`.
message ListDataShareReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDataShareReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDataShareReports`.
message ListDataShareReportsResponse {
  repeated DataShare data_shares = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDataShareReport`.
message ShareDataShareReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  ShareDataShareReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDataShareReport`.
message ShareDataShareReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  ShareDataShareReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDataShareTotals`.
message CountDataShareTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DataShareStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDataShareTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDataShareTotals`.
message CountDataShareTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDataShareReport`.
message DeleteDataShareReportRequest {
  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDataShareReport`.
message DeleteDataShareReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
