syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareValidationServiceProto";
option java_package = "com.acme.datahub.v1";

// Checks data shares against the rules before anything acts on them.
service DataShareValidationService {
  // Validates a data share.
  rpc ValidateDataShare(ValidateDataShareRequest) returns (ValidateDataShareResponse);

  // Previews a data share.
  rpc PreviewDataShare(PreviewDataShareRequest) returns (PreviewDataShareResponse);

  // Checks a data share.
  rpc CheckDataShareEligibility(CheckDataShareEligibilityRequest) returns (CheckDataShareEligibilityResponse);

  // Normalizes a data share.
  rpc NormalizeDataShare(NormalizeDataShareRequest) returns (NormalizeDataShareResponse);

  // Explains a data share.
  rpc ExplainDataShareDecision(ExplainDataShareDecisionRequest) returns (ExplainDataShareDecisionResponse);

  // Scores a data share.
  rpc ScoreDataShare(ScoreDataShareRequest) returns (ScoreDataShareResponse);

  // Lints a data share.
  rpc LintDataShares(LintDataSharesRequest) returns (LintDataSharesResponse);
}

// The request of `ValidateDataShare`.
message ValidateDataShareRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  DataShare data_share = 3;
  ValidateDataShareRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDataShare`.
message ValidateDataShareResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  ValidateDataShareResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

