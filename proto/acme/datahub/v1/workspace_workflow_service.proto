option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "WorkspaceWorkflowServiceProto";
option java_package = "com.acme.datahub.v1";

// Runs the long-lived workflow that takes a workspace from start to finish.
service WorkspaceWorkflowService {
  // Starts a workspace.
  rpc StartWorkspaceWorkflow(StartWorkspaceWorkflowRequest) returns (StartWorkspaceWorkflowResponse);

  // Advances a workspace.
  rpc AdvanceWorkspaceWorkflow(AdvanceWorkspaceWorkflowRequest) returns (AdvanceWorkspaceWorkflowResponse);

  // Cancels a workspace.
  rpc CancelWorkspaceWorkflow(CancelWorkspaceWorkflowRequest) returns (CancelWorkspaceWorkflowResponse);

  // Retrys a workspace.
  rpc RetryWorkspaceWorkflow(RetryWorkspaceWorkflowRequest) returns (RetryWorkspaceWorkflowResponse);

  // Pauses a workspace.
  rpc PauseWorkspaceWorkflow(PauseWorkspaceWorkflowRequest) returns (PauseWorkspaceWorkflowResponse);

  // Resumes a workspace.
  rpc ResumeWorkspaceWorkflow(ResumeWorkspaceWorkflowRequest) returns (ResumeWorkspaceWorkflowResponse);

  // Returns a workspace.
  rpc InspectWorkspaceWorkflow(InspectWorkspaceWorkflowRequest) returns (InspectWorkspaceWorkflowResponse);

  // Lists workspaces a page at a time.
  rpc ListWorkspaceWorkflows(ListWorkspaceWorkflowsRequest) returns (ListWorkspaceWorkflowsResponse);

  // Signals a workspace.
  rpc SignalWorkspaceWorkflow(SignalWorkspaceWorkflowRequest) returns (SignalWorkspaceWorkflowResponse);
}

// The request of `StartWorkspaceWorkflow`.
message StartWorkspaceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  Workspace workspace = 3;
  StartWorkspaceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWorkspaceWorkflow`.
message StartWorkspaceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  StartWorkspaceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

