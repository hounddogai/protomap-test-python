syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "NotebookServiceProto";
option java_package = "com.acme.datahub.v1";

// Manages notebooks: creates, reads, changes, and lists them.
service NotebookService {
  // Creates a notebook.
  rpc CreateNotebook(CreateNotebookRequest) returns (CreateNotebookResponse);

  // Returns a notebook.
  rpc GetNotebook(GetNotebookRequest) returns (GetNotebookResponse);

  // Changes a notebook.
  rpc UpdateNotebook(UpdateNotebookRequest) returns (UpdateNotebookResponse);

  // Deletes a notebook.
  rpc DeleteNotebook(DeleteNotebookRequest) returns (DeleteNotebookResponse);

  // Lists notebooks a page at a time.
  rpc ListNotebooks(ListNotebooksRequest) returns (ListNotebooksResponse);

  // Streams the changes of notebooks as they happen.
  rpc WatchNotebooks(WatchNotebooksRequest) returns (stream WatchNotebooksResponse);

  // Takes a stream of notebooks and answers once at the end.
  rpc BatchCreateNotebooks(stream BatchCreateNotebooksRequest) returns (BatchCreateNotebooksResponse);

  // Creates a notebook.
  rpc CloneNotebook(CloneNotebookRequest) returns (CloneNotebookResponse);
}

// The request of `CreateNotebook`.
message CreateNotebookRequest {
  acme.common.v1.RequestContext context = 1;
  Notebook notebook = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CreateNotebook`.
message CreateNotebookResponse {
  Notebook notebook = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `GetNotebook`.
message GetNotebookRequest {
  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotebook`.
message GetNotebookResponse {
  Notebook notebook = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `UpdateNotebook`.
message UpdateNotebookRequest {
  acme.common.v1.RequestContext context = 1;
  Notebook notebook = 2;
  google.protobuf.FieldMask update_mask = 3;
  bool allow_missing = 4;
}

// The response of `UpdateNotebook`.
message UpdateNotebookResponse {
  Notebook notebook = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `DeleteNotebook`.
message DeleteNotebookRequest {
  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteNotebook`.
message DeleteNotebookResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ListNotebooks`.
message ListNotebooksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotebookStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotebooksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotebooks`.
message ListNotebooksResponse {
  repeated Notebook notebooks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `WatchNotebooks`.
message WatchNotebooksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotebookStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  WatchNotebooksRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `WatchNotebooks`.
message WatchNotebooksResponse {
  Notebook notebook = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `BatchCreateNotebooks`.
message BatchCreateNotebooksRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    BatchCreateNotebooksRequest.StreamHeader header = 2;
    Notebook record = 3;
  }
  int64 sequence = 4;
}

// The response of `BatchCreateNotebooks`.
message BatchCreateNotebooksResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string notebook_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated BatchCreateNotebooksResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `CloneNotebook`.
message CloneNotebookRequest {
  acme.common.v1.RequestContext context = 1;
  Notebook notebook = 2;
  string request_id = 3;
  bool validate_only = 4;
}

// The response of `CloneNotebook`.
message CloneNotebookResponse {
  Notebook notebook = 1;
  acme.common.v1.OperationResult result = 2;
}
