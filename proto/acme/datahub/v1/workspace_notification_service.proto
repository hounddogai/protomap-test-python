  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  SendWorkspaceTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendWorkspaceTestNotice`.
message SendWorkspaceTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  SendWorkspaceTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetWorkspacePreferences`.
message GetWorkspacePreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetWorkspacePreferences`.
message GetWorkspacePreferencesResponse {
  Workspace workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamWorkspaceNotices`.
message StreamWorkspaceNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamWorkspaceNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamWorkspaceNotices`.
message StreamWorkspaceNoticesResponse {
  Workspace workspace = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
