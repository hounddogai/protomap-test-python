syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "WorkspaceNotificationServiceProto";
option java_package = "com.acme.datahub.v1";

// Tells the people who follow a workspace what changed.
service WorkspaceNotificationService {
  // Subscribes a workspace.
  rpc SubscribeWorkspaceUpdates(SubscribeWorkspaceUpdatesRequest) returns (SubscribeWorkspaceUpdatesResponse);

  // Unsubscribes a workspace.
  rpc UnsubscribeWorkspaceUpdates(UnsubscribeWorkspaceUpdatesRequest) returns (UnsubscribeWorkspaceUpdatesResponse);

  // Notifys a workspace.
  rpc NotifyWorkspaceWatchers(NotifyWorkspaceWatchersRequest) returns (NotifyWorkspaceWatchersResponse);

  // Lists workspaces a page at a time.
  rpc ListWorkspaceSubscriptions(ListWorkspaceSubscriptionsRequest) returns (ListWorkspaceSubscriptionsResponse);

  // Sends a workspace.
  rpc SendWorkspaceTestNotice(SendWorkspaceTestNoticeRequest) returns (SendWorkspaceTestNoticeResponse);

  // Returns a workspace.
  rpc GetWorkspacePreferences(GetWorkspacePreferencesRequest) returns (GetWorkspacePreferencesResponse);

  // Streams the changes of workspaces as they happen.
  rpc StreamWorkspaceNotices(StreamWorkspaceNoticesRequest) returns (stream StreamWorkspaceNoticesResponse);
}

// The request of `SubscribeWorkspaceUpdates`.
message SubscribeWorkspaceUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  SubscribeWorkspaceUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeWorkspaceUpdates`.
message SubscribeWorkspaceUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  SubscribeWorkspaceUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeWorkspaceUpdates`.
message UnsubscribeWorkspaceUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  UnsubscribeWorkspaceUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeWorkspaceUpdates`.
message UnsubscribeWorkspaceUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  UnsubscribeWorkspaceUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyWorkspaceWatchers`.
message NotifyWorkspaceWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string workspace_id = 2;
  NotifyWorkspaceWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyWorkspaceWatchers`.
message NotifyWorkspaceWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Workspace workspace = 1;
  NotifyWorkspaceWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListWorkspaceSubscriptions`.
message ListWorkspaceSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWorkspaceSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWorkspaceSubscriptions`.
message ListWorkspaceSubscriptionsResponse {
  repeated Workspace workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendWorkspaceTestNotice`.
message SendWorkspaceTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
