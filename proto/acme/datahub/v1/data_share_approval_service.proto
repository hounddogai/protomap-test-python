syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "DataShareApprovalServiceProto";
option java_package = "com.acme.datahub.v1";

// Routes data shares through approval, with escalation and delegation.
service DataShareApprovalService {
  // Submits a data share.
  rpc SubmitDataShare(SubmitDataShareRequest) returns (SubmitDataShareResponse);

  // Approves a data share.
  rpc ApproveDataShare(ApproveDataShareRequest) returns (ApproveDataShareResponse);

  // Rejects a data share.
  rpc RejectDataShare(RejectDataShareRequest) returns (RejectDataShareResponse);

  // Escalates a data share.
  rpc EscalateDataShare(EscalateDataShareRequest) returns (EscalateDataShareResponse);

  // Lists data shares a page at a time.
  rpc ListPendingDataShares(ListPendingDataSharesRequest) returns (ListPendingDataSharesResponse);

  // Delegates a data share.
  rpc DelegateDataShareApproval(DelegateDataShareApprovalRequest) returns (DelegateDataShareApprovalResponse);

  // Recalls a data share.
  rpc RecallDataShare(RecallDataShareRequest) returns (RecallDataShareResponse);

  // Comments a data share.
  rpc CommentDataShareApproval(CommentDataShareApprovalRequest) returns (CommentDataShareApprovalResponse);
}

// The request of `SubmitDataShare`.
message SubmitDataShareRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string data_share_id = 2;
  DataShare data_share = 3;
  SubmitDataShareRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDataShare`.
message SubmitDataShareResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DataShare data_share = 1;
  SubmitDataShareResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

