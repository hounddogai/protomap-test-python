syntax = "proto3";

package acme.datahub.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/datahub/v1/datahub.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Datahub.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/datahub/v1;datahubv1";
option java_multiple_files = true;
option java_outer_classname = "NotebookApprovalServiceProto";
option java_package = "com.acme.datahub.v1";

// Routes notebooks through approval, with escalation and delegation.
service NotebookApprovalService {
  // Submits a notebook.
  rpc SubmitNotebook(SubmitNotebookRequest) returns (SubmitNotebookResponse);

  // Approves a notebook.
  rpc ApproveNotebook(ApproveNotebookRequest) returns (ApproveNotebookResponse);

  // Rejects a notebook.
  rpc RejectNotebook(RejectNotebookRequest) returns (RejectNotebookResponse);

  // Escalates a notebook.
  rpc EscalateNotebook(EscalateNotebookRequest) returns (EscalateNotebookResponse);

  // Lists notebooks a page at a time.
  rpc ListPendingNotebooks(ListPendingNotebooksRequest) returns (ListPendingNotebooksResponse);

  // Delegates a notebook.
  rpc DelegateNotebookApproval(DelegateNotebookApprovalRequest) returns (DelegateNotebookApprovalResponse);

  // Recalls a notebook.
  rpc RecallNotebook(RecallNotebookRequest) returns (RecallNotebookResponse);

  // Returns a notebook.
  rpc GetNotebookApprovalStatus(GetNotebookApprovalStatusRequest) returns (GetNotebookApprovalStatusResponse);

  // Comments a notebook.
  rpc CommentNotebookApproval(CommentNotebookApprovalRequest) returns (CommentNotebookApprovalResponse);
}

// The request of `SubmitNotebook`.
message SubmitNotebookRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notebook_id = 2;
  Notebook notebook = 3;
  SubmitNotebookRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitNotebook`.
message SubmitNotebookResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notebook notebook = 1;
  SubmitNotebookResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

