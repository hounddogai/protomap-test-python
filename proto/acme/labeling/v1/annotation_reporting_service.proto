syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationReportingServiceProto";
option java_package = "com.acme.labeling.v1";

// Builds and schedules reports about annotations.
service AnnotationReportingService {
  // Generates an annotation.
  rpc GenerateAnnotationReport(GenerateAnnotationReportRequest) returns (GenerateAnnotationReportResponse);

  // Returns an annotation.
  rpc FetchAnnotationReport(FetchAnnotationReportRequest) returns (FetchAnnotationReportResponse);

  // Streams the changes of annotations as they happen.
  rpc StreamAnnotationMetrics(StreamAnnotationMetricsRequest) returns (stream StreamAnnotationMetricsResponse);

  // Lists annotations a page at a time.
  rpc ListAnnotationReports(ListAnnotationReportsRequest) returns (ListAnnotationReportsResponse);

  // Shares an annotation.
  rpc ShareAnnotationReport(ShareAnnotationReportRequest) returns (ShareAnnotationReportResponse);

  // Counts annotations by status.
  rpc CountAnnotationTotals(CountAnnotationTotalsRequest) returns (CountAnnotationTotalsResponse);

  // Deletes an annotation.
  rpc DeleteAnnotationReport(DeleteAnnotationReportRequest) returns (DeleteAnnotationReportResponse);
}

// The request of `GenerateAnnotationReport`.
message GenerateAnnotationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  GenerateAnnotationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateAnnotationReport`.
message GenerateAnnotationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchAnnotationReport`.
message FetchAnnotationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchAnnotationReport`.
message FetchAnnotationReportResponse {
  Annotation annotation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamAnnotationMetrics`.
message StreamAnnotationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAnnotationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAnnotationMetrics`.
message StreamAnnotationMetricsResponse {
  Annotation annotation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAnnotationReports`.
message ListAnnotationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAnnotationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAnnotationReports`.
message ListAnnotationReportsResponse {
  repeated Annotation annotations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAnnotationReport`.
message ShareAnnotationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  ShareAnnotationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAnnotationReport`.
message ShareAnnotationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Annotation annotation = 1;
  ShareAnnotationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAnnotationTotals`.
message CountAnnotationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAnnotationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAnnotationTotals`.
message CountAnnotationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteAnnotationReport`.
message DeleteAnnotationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAnnotationReport`.
message DeleteAnnotationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
