syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "LabelSetReportingServiceProto";
option java_package = "com.acme.labeling.v1";

// Builds and schedules reports about label sets.
service LabelSetReportingService {
  // Generates a label set.
  rpc GenerateLabelSetReport(GenerateLabelSetReportRequest) returns (GenerateLabelSetReportResponse);

  // Returns a label set.
  rpc FetchLabelSetReport(FetchLabelSetReportRequest) returns (FetchLabelSetReportResponse);

  // Schedules a label set.
  rpc ScheduleLabelSetReport(ScheduleLabelSetReportRequest) returns (ScheduleLabelSetReportResponse);

  // Streams the changes of label sets as they happen.
  rpc StreamLabelSetMetrics(StreamLabelSetMetricsRequest) returns (stream StreamLabelSetMetricsResponse);

  // Lists label sets a page at a time.
  rpc ListLabelSetReports(ListLabelSetReportsRequest) returns (ListLabelSetReportsResponse);

  // Shares a label set.
  rpc ShareLabelSetReport(ShareLabelSetReportRequest) returns (ShareLabelSetReportResponse);

  // Counts label sets by status.
  rpc CountLabelSetTotals(CountLabelSetTotalsRequest) returns (CountLabelSetTotalsResponse);

  // Deletes a label set.
  rpc DeleteLabelSetReport(DeleteLabelSetReportRequest) returns (DeleteLabelSetReportResponse);
}

// The request of `GenerateLabelSetReport`.
message GenerateLabelSetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  GenerateLabelSetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateLabelSetReport`.
message GenerateLabelSetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchLabelSetReport`.
message FetchLabelSetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchLabelSetReport`.
message FetchLabelSetReportResponse {
  LabelSet label_set = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleLabelSetReport`.
message ScheduleLabelSetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  ScheduleLabelSetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleLabelSetReport`.
message ScheduleLabelSetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamLabelSetMetrics`.
message StreamLabelSetMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LabelSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamLabelSetMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamLabelSetMetrics`.
message StreamLabelSetMetricsResponse {
  LabelSet label_set = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListLabelSetReports`.
message ListLabelSetReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LabelSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLabelSetReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLabelSetReports`.
message ListLabelSetReportsResponse {
  repeated LabelSet label_sets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareLabelSetReport`.
message ShareLabelSetReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  ShareLabelSetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareLabelSetReport`.
message ShareLabelSetReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelSet label_set = 1;
  ShareLabelSetReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLabelSetTotals`.
message CountLabelSetTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LabelSetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLabelSetTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLabelSetTotals`.
message CountLabelSetTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteLabelSetReport`.
message DeleteLabelSetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLabelSetReport`.
message DeleteLabelSetReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
