syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "LabelSetValidationServiceProto";
option java_package = "com.acme.labeling.v1";

// Checks label sets against the rules before anything acts on them.
service LabelSetValidationService {
  // Validates a label set.
  rpc ValidateLabelSet(ValidateLabelSetRequest) returns (ValidateLabelSetResponse);

  // Previews a label set.
  rpc PreviewLabelSet(PreviewLabelSetRequest) returns (PreviewLabelSetResponse);

  // Checks a label set.
  rpc CheckLabelSetEligibility(CheckLabelSetEligibilityRequest) returns (CheckLabelSetEligibilityResponse);

  // Normalizes a label set.
  rpc NormalizeLabelSet(NormalizeLabelSetRequest) returns (NormalizeLabelSetResponse);

  // Explains a label set.
  rpc ExplainLabelSetDecision(ExplainLabelSetDecisionRequest) returns (ExplainLabelSetDecisionResponse);

  // Scores a label set.
  rpc ScoreLabelSet(ScoreLabelSetRequest) returns (ScoreLabelSetResponse);

  // Lints a label set.
  rpc LintLabelSets(LintLabelSetsRequest) returns (LintLabelSetsResponse);

  // Returns a label set.
  rpc GetLabelSetRules(GetLabelSetRulesRequest) returns (GetLabelSetRulesResponse);
}

// The request of `ValidateLabelSet`.
message ValidateLabelSetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  LabelSet label_set = 3;
  ValidateLabelSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLabelSet`.
message ValidateLabelSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelSet label_set = 1;
  ValidateLabelSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

