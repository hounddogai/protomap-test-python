syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationWorkflowServiceProto";
option java_package = "com.acme.labeling.v1";

// Runs the long-lived workflow that takes an annotation from start to finish.
service AnnotationWorkflowService {
  // Starts an annotation.
  rpc StartAnnotationWorkflow(StartAnnotationWorkflowRequest) returns (StartAnnotationWorkflowResponse);

  // Advances an annotation.
  rpc AdvanceAnnotationWorkflow(AdvanceAnnotationWorkflowRequest) returns (AdvanceAnnotationWorkflowResponse);

  // Cancels an annotation.
  rpc CancelAnnotationWorkflow(CancelAnnotationWorkflowRequest) returns (CancelAnnotationWorkflowResponse);

  // Retrys an annotation.
  rpc RetryAnnotationWorkflow(RetryAnnotationWorkflowRequest) returns (RetryAnnotationWorkflowResponse);

  // Pauses an annotation.
  rpc PauseAnnotationWorkflow(PauseAnnotationWorkflowRequest) returns (PauseAnnotationWorkflowResponse);

  // Resumes an annotation.
  rpc ResumeAnnotationWorkflow(ResumeAnnotationWorkflowRequest) returns (ResumeAnnotationWorkflowResponse);

  // Returns an annotation.
  rpc InspectAnnotationWorkflow(InspectAnnotationWorkflowRequest) returns (InspectAnnotationWorkflowResponse);

  // Lists annotations a page at a time.
  rpc ListAnnotationWorkflows(ListAnnotationWorkflowsRequest) returns (ListAnnotationWorkflowsResponse);

  // Signals an annotation.
  rpc SignalAnnotationWorkflow(SignalAnnotationWorkflowRequest) returns (SignalAnnotationWorkflowResponse);
}

// The request of `StartAnnotationWorkflow`.
message StartAnnotationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  Annotation annotation = 3;
  StartAnnotationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAnnotationWorkflow`.
message StartAnnotationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Annotation annotation = 1;
  StartAnnotationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

