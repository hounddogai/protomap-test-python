syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "LabelingTaskWorkflowServiceProto";
option java_package = "com.acme.labeling.v1";

// Runs the long-lived workflow that takes a labeling task from start to finish.
service LabelingTaskWorkflowService {
  // Starts a labeling task.
  rpc StartLabelingTaskWorkflow(StartLabelingTaskWorkflowRequest) returns (StartLabelingTaskWorkflowResponse);

  // Advances a labeling task.
  rpc AdvanceLabelingTaskWorkflow(AdvanceLabelingTaskWorkflowRequest) returns (AdvanceLabelingTaskWorkflowResponse);

  // Cancels a labeling task.
  rpc CancelLabelingTaskWorkflow(CancelLabelingTaskWorkflowRequest) returns (CancelLabelingTaskWorkflowResponse);

  // Retrys a labeling task.
  rpc RetryLabelingTaskWorkflow(RetryLabelingTaskWorkflowRequest) returns (RetryLabelingTaskWorkflowResponse);

  // Pauses a labeling task.
  rpc PauseLabelingTaskWorkflow(PauseLabelingTaskWorkflowRequest) returns (PauseLabelingTaskWorkflowResponse);

  // Resumes a labeling task.
  rpc ResumeLabelingTaskWorkflow(ResumeLabelingTaskWorkflowRequest) returns (ResumeLabelingTaskWorkflowResponse);

  // Returns a labeling task.
  rpc InspectLabelingTaskWorkflow(InspectLabelingTaskWorkflowRequest) returns (InspectLabelingTaskWorkflowResponse);

  // Lists labeling tasks a page at a time.
  rpc ListLabelingTaskWorkflows(ListLabelingTaskWorkflowsRequest) returns (ListLabelingTaskWorkflowsResponse);

  // Signals a labeling task.
  rpc SignalLabelingTaskWorkflow(SignalLabelingTaskWorkflowRequest) returns (SignalLabelingTaskWorkflowResponse);
}

// The request of `StartLabelingTaskWorkflow`.
message StartLabelingTaskWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string labeling_task_id = 2;
  LabelingTask labeling_task = 3;
  StartLabelingTaskWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLabelingTaskWorkflow`.
message StartLabelingTaskWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelingTask labeling_task = 1;
  StartLabelingTaskWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

