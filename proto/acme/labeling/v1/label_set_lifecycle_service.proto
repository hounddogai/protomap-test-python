option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "LabelSetLifecycleServiceProto";
option java_package = "com.acme.labeling.v1";

// Moves a label set between the states of its lifecycle.
service LabelSetLifecycleService {
  // Activates a label set.
  rpc ActivateLabelSet(ActivateLabelSetRequest) returns (ActivateLabelSetResponse);

  // Suspends a label set.
  rpc SuspendLabelSet(SuspendLabelSetRequest) returns (SuspendLabelSetResponse);

  // Reinstates a label set.
  rpc ReinstateLabelSet(ReinstateLabelSetRequest) returns (ReinstateLabelSetResponse);

  // Terminates a label set.
  rpc TerminateLabelSet(TerminateLabelSetRequest) returns (TerminateLabelSetResponse);

  // Renews a label set.
  rpc RenewLabelSet(RenewLabelSetRequest) returns (RenewLabelSetResponse);

  // Expires a label set.
  rpc ExpireLabelSet(ExpireLabelSetRequest) returns (ExpireLabelSetResponse);

  // Returns a label set.
  rpc GetLabelSetLifecycle(GetLabelSetLifecycleRequest) returns (GetLabelSetLifecycleResponse);

  // Schedules a label set.
  rpc ScheduleLabelSetExpiry(ScheduleLabelSetExpiryRequest) returns (ScheduleLabelSetExpiryResponse);
}

// The request of `ActivateLabelSet`.
message ActivateLabelSetRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  ActivateLabelSetRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLabelSet`.
message ActivateLabelSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelSet label_set = 1;
  ActivateLabelSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

