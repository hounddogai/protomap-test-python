syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationLifecycleServiceProto";
option java_package = "com.acme.labeling.v1";

// Moves an annotation between the states of its lifecycle.
service AnnotationLifecycleService {
  // Activates an annotation.
  rpc ActivateAnnotation(ActivateAnnotationRequest) returns (ActivateAnnotationResponse);

  // Suspends an annotation.
  rpc SuspendAnnotation(SuspendAnnotationRequest) returns (SuspendAnnotationResponse);

  // Reinstates an annotation.
  rpc ReinstateAnnotation(ReinstateAnnotationRequest) returns (ReinstateAnnotationResponse);

  // Terminates an annotation.
  rpc TerminateAnnotation(TerminateAnnotationRequest) returns (TerminateAnnotationResponse);

  // Renews an annotation.
  rpc RenewAnnotation(RenewAnnotationRequest) returns (RenewAnnotationResponse);

  // Expires an annotation.
  rpc ExpireAnnotation(ExpireAnnotationRequest) returns (ExpireAnnotationResponse);

  // Returns an annotation.
  rpc GetAnnotationLifecycle(GetAnnotationLifecycleRequest) returns (GetAnnotationLifecycleResponse);

  // Schedules an annotation.
  rpc ScheduleAnnotationExpiry(ScheduleAnnotationExpiryRequest) returns (ScheduleAnnotationExpiryResponse);
}

// The request of `ActivateAnnotation`.
message ActivateAnnotationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  ActivateAnnotationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAnnotation`.
message ActivateAnnotationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Annotation annotation = 1;
  ActivateAnnotationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

