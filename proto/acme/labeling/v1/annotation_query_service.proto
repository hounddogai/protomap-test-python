syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationQueryServiceProto";
option java_package = "com.acme.labeling.v1";

// Answers read-only questions about annotations, for screens and reports.
service AnnotationQueryService {
  // Returns an annotation.
  rpc LookupAnnotation(LookupAnnotationRequest) returns (LookupAnnotationResponse);

  // Lists annotations a page at a time.
  rpc BrowseAnnotations(BrowseAnnotationsRequest) returns (BrowseAnnotationsResponse);

  // Counts annotations by status.
  rpc CountAnnotations(CountAnnotationsRequest) returns (CountAnnotationsResponse);

  // Streams every matching annotation.
  rpc ExportAnnotations(ExportAnnotationsRequest) returns (stream ExportAnnotationsResponse);

  // Summarizes an annotation.
  rpc SummarizeAnnotations(SummarizeAnnotationsRequest) returns (SummarizeAnnotationsResponse);

  // Lists annotations a page at a time.
  rpc SuggestAnnotations(SuggestAnnotationsRequest) returns (SuggestAnnotationsResponse);

  // Returns an annotation.
  rpc PeekAnnotation(PeekAnnotationRequest) returns (PeekAnnotationResponse);
}

// The request of `LookupAnnotation`.
message LookupAnnotationRequest {
  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupAnnotation`.
message LookupAnnotationResponse {
  Annotation annotation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseAnnotations`.
message BrowseAnnotationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseAnnotationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseAnnotations`.
message BrowseAnnotationsResponse {
  repeated Annotation annotations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAnnotations`.
message CountAnnotationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAnnotationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAnnotations`.
message CountAnnotationsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportAnnotations`.
message ExportAnnotationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportAnnotationsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportAnnotations`.
message ExportAnnotationsResponse {
  Annotation annotation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeAnnotations`.
message SummarizeAnnotationsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  SummarizeAnnotationsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeAnnotations`.
message SummarizeAnnotationsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestAnnotations`.
message SuggestAnnotationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AnnotationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestAnnotationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestAnnotations`.
message SuggestAnnotationsResponse {
  repeated Annotation annotations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekAnnotation`.
message PeekAnnotationRequest {
  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekAnnotation`.
message PeekAnnotationResponse {
  Annotation annotation = 1;
  acme.common.v1.OperationResult result = 2;
}
