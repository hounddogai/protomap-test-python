option java_multiple_files = true;
option java_outer_classname = "LabelSetWorkflowServiceProto";
option java_package = "com.acme.labeling.v1";

// Runs the long-lived workflow that takes a label set from start to finish.
service LabelSetWorkflowService {
  // Starts a label set.
  rpc StartLabelSetWorkflow(StartLabelSetWorkflowRequest) returns (StartLabelSetWorkflowResponse);

  // Advances a label set.
  rpc AdvanceLabelSetWorkflow(AdvanceLabelSetWorkflowRequest) returns (AdvanceLabelSetWorkflowResponse);

  // Cancels a label set.
  rpc CancelLabelSetWorkflow(CancelLabelSetWorkflowRequest) returns (CancelLabelSetWorkflowResponse);

  // Retrys a label set.
  rpc RetryLabelSetWorkflow(RetryLabelSetWorkflowRequest) returns (RetryLabelSetWorkflowResponse);

  // Pauses a label set.
  rpc PauseLabelSetWorkflow(PauseLabelSetWorkflowRequest) returns (PauseLabelSetWorkflowResponse);

  // Resumes a label set.
  rpc ResumeLabelSetWorkflow(ResumeLabelSetWorkflowRequest) returns (ResumeLabelSetWorkflowResponse);

  // Returns a label set.
  rpc InspectLabelSetWorkflow(InspectLabelSetWorkflowRequest) returns (InspectLabelSetWorkflowResponse);

  // Lists label sets a page at a time.
  rpc ListLabelSetWorkflows(ListLabelSetWorkflowsRequest) returns (ListLabelSetWorkflowsResponse);

  // Signals a label set.
  rpc SignalLabelSetWorkflow(SignalLabelSetWorkflowRequest) returns (SignalLabelSetWorkflowResponse);
}

// The request of `StartLabelSetWorkflow`.
message StartLabelSetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  LabelSet label_set = 3;
  StartLabelSetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLabelSetWorkflow`.
message StartLabelSetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelSet label_set = 1;
  StartLabelSetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

