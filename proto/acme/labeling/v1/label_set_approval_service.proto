syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "LabelSetApprovalServiceProto";
option java_package = "com.acme.labeling.v1";

// Routes label sets through approval, with escalation and delegation.
service LabelSetApprovalService {
  // Submits a label set.
  rpc SubmitLabelSet(SubmitLabelSetRequest) returns (SubmitLabelSetResponse);

  // Approves a label set.
  rpc ApproveLabelSet(ApproveLabelSetRequest) returns (ApproveLabelSetResponse);

  // Rejects a label set.
  rpc RejectLabelSet(RejectLabelSetRequest) returns (RejectLabelSetResponse);

  // Escalates a label set.
  rpc EscalateLabelSet(EscalateLabelSetRequest) returns (EscalateLabelSetResponse);

  // Lists label sets a page at a time.
  rpc ListPendingLabelSets(ListPendingLabelSetsRequest) returns (ListPendingLabelSetsResponse);

  // Delegates a label set.
  rpc DelegateLabelSetApproval(DelegateLabelSetApprovalRequest) returns (DelegateLabelSetApprovalResponse);

  // Recalls a label set.
  rpc RecallLabelSet(RecallLabelSetRequest) returns (RecallLabelSetResponse);

  // Comments a label set.
  rpc CommentLabelSetApproval(CommentLabelSetApprovalRequest) returns (CommentLabelSetApprovalResponse);
}

// The request of `SubmitLabelSet`.
message SubmitLabelSetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string label_set_id = 2;
  LabelSet label_set = 3;
  SubmitLabelSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLabelSet`.
message SubmitLabelSetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LabelSet label_set = 1;
  SubmitLabelSetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

