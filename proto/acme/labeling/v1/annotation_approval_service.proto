syntax = "proto3";

package acme.labeling.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/labeling/v1/labeling.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Labeling.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/labeling/v1;labelingv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationApprovalServiceProto";
option java_package = "com.acme.labeling.v1";

// Routes annotations through approval, with escalation and delegation.
service AnnotationApprovalService {
  // Submits an annotation.
  rpc SubmitAnnotation(SubmitAnnotationRequest) returns (SubmitAnnotationResponse);

  // Approves an annotation.
  rpc ApproveAnnotation(ApproveAnnotationRequest) returns (ApproveAnnotationResponse);

  // Rejects an annotation.
  rpc RejectAnnotation(RejectAnnotationRequest) returns (RejectAnnotationResponse);

  // Escalates an annotation.
  rpc EscalateAnnotation(EscalateAnnotationRequest) returns (EscalateAnnotationResponse);

  // Lists annotations a page at a time.
  rpc ListPendingAnnotations(ListPendingAnnotationsRequest) returns (ListPendingAnnotationsResponse);

  // Recalls an annotation.
  rpc RecallAnnotation(RecallAnnotationRequest) returns (RecallAnnotationResponse);

  // Returns an annotation.
  rpc GetAnnotationApprovalStatus(GetAnnotationApprovalStatusRequest) returns (GetAnnotationApprovalStatusResponse);

  // Comments an annotation.
  rpc CommentAnnotationApproval(CommentAnnotationApprovalRequest) returns (CommentAnnotationApprovalResponse);
}

// The request of `SubmitAnnotation`.
message SubmitAnnotationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string annotation_id = 2;
  Annotation annotation = 3;
  SubmitAnnotationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAnnotation`.
message SubmitAnnotationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Annotation annotation = 1;
  SubmitAnnotationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

