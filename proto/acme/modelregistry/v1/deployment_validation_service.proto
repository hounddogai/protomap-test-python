syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "DeploymentValidationServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Checks deployments against the rules before anything acts on them.
service DeploymentValidationService {
  // Validates a deployment.
  rpc ValidateDeployment(ValidateDeploymentRequest) returns (ValidateDeploymentResponse);

  // Previews a deployment.
  rpc PreviewDeployment(PreviewDeploymentRequest) returns (PreviewDeploymentResponse);

  // Checks a deployment.
  rpc CheckDeploymentEligibility(CheckDeploymentEligibilityRequest) returns (CheckDeploymentEligibilityResponse);

  // Normalizes a deployment.
  rpc NormalizeDeployment(NormalizeDeploymentRequest) returns (NormalizeDeploymentResponse);

  // Explains a deployment.
  rpc ExplainDeploymentDecision(ExplainDeploymentDecisionRequest) returns (ExplainDeploymentDecisionResponse);

  // Scores a deployment.
  rpc ScoreDeployment(ScoreDeploymentRequest) returns (ScoreDeploymentResponse);

  // Lints a deployment.
  rpc LintDeployments(LintDeploymentsRequest) returns (LintDeploymentsResponse);

  // Returns a deployment.
  rpc GetDeploymentRules(GetDeploymentRulesRequest) returns (GetDeploymentRulesResponse);
}

// The request of `ValidateDeployment`.
message ValidateDeploymentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  ValidateDeploymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDeployment`.
message ValidateDeploymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  ValidateDeploymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

