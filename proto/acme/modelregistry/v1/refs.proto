syntax = "proto3";

package acme.modelregistry.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.modelregistry.v1";

// A reference to a registered model of the modelregistry domain.
message RegisteredModelRef {
  string registered_model_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a model version of the modelregistry domain.
message ModelVersionRef {
  string model_version_id = 1;
  string display_name = 2;
  string kind = 3;
}

// A reference to a deployment of the modelregistry domain.
message DeploymentRef {
  string deployment_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}
