syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "RegisteredModelReportingServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Builds and schedules reports about registered models.
service RegisteredModelReportingService {
  // Generates a registered model.
  rpc GenerateRegisteredModelReport(GenerateRegisteredModelReportRequest) returns (GenerateRegisteredModelReportResponse);

  // Returns a registered model.
  rpc FetchRegisteredModelReport(FetchRegisteredModelReportRequest) returns (FetchRegisteredModelReportResponse);

  // Schedules a registered model.
  rpc ScheduleRegisteredModelReport(ScheduleRegisteredModelReportRequest) returns (ScheduleRegisteredModelReportResponse);

  // Streams the changes of registered models as they happen.
  rpc StreamRegisteredModelMetrics(StreamRegisteredModelMetricsRequest) returns (stream StreamRegisteredModelMetricsResponse);

  // Lists registered models a page at a time.
  rpc ListRegisteredModelReports(ListRegisteredModelReportsRequest) returns (ListRegisteredModelReportsResponse);

  // Counts registered models by status.
  rpc CountRegisteredModelTotals(CountRegisteredModelTotalsRequest) returns (CountRegisteredModelTotalsResponse);

  // Deletes a registered model.
  rpc DeleteRegisteredModelReport(DeleteRegisteredModelReportRequest) returns (DeleteRegisteredModelReportResponse);
}

// The request of `GenerateRegisteredModelReport`.
message GenerateRegisteredModelReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  GenerateRegisteredModelReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRegisteredModelReport`.
message GenerateRegisteredModelReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRegisteredModelReport`.
message FetchRegisteredModelReportRequest {
  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRegisteredModelReport`.
message FetchRegisteredModelReportResponse {
  RegisteredModel registered_model = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRegisteredModelReport`.
message ScheduleRegisteredModelReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  ScheduleRegisteredModelReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRegisteredModelReport`.
message ScheduleRegisteredModelReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRegisteredModelMetrics`.
message StreamRegisteredModelMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RegisteredModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRegisteredModelMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRegisteredModelMetrics`.
message StreamRegisteredModelMetricsResponse {
  RegisteredModel registered_model = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRegisteredModelReports`.
message ListRegisteredModelReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RegisteredModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRegisteredModelReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRegisteredModelReports`.
message ListRegisteredModelReportsResponse {
  repeated RegisteredModel registered_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRegisteredModelTotals`.
message CountRegisteredModelTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RegisteredModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRegisteredModelTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRegisteredModelTotals`.
message CountRegisteredModelTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRegisteredModelReport`.
message DeleteRegisteredModelReportRequest {
  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRegisteredModelReport`.
message DeleteRegisteredModelReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
