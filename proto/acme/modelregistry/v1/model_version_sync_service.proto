syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "ModelVersionSyncServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Keeps model versions in step with the systems of record in other regions.
service ModelVersionSyncService {
  // Syncs a model version.
  rpc SyncModelVersions(SyncModelVersionsRequest) returns (SyncModelVersionsResponse);

  // Pushs a model version.
  rpc PushModelVersion(PushModelVersionRequest) returns (PushModelVersionResponse);

  // Pulls a model version.
  rpc PullModelVersions(PullModelVersionsRequest) returns (PullModelVersionsResponse);

  // Reconciles a model version.
  rpc ReconcileModelVersions(ReconcileModelVersionsRequest) returns (ReconcileModelVersionsResponse);

  // Exchanges changes of model versions with a peer.
  rpc StreamModelVersionChanges(stream StreamModelVersionChangesRequest) returns (stream StreamModelVersionChangesResponse);

  // Resolves a model version.
  rpc ResolveModelVersionConflict(ResolveModelVersionConflictRequest) returns (ResolveModelVersionConflictResponse);

  // Returns a model version.
  rpc GetModelVersionSyncState(GetModelVersionSyncStateRequest) returns (GetModelVersionSyncStateResponse);

  // Lists model versions a page at a time.
  rpc ListModelVersionConflicts(ListModelVersionConflictsRequest) returns (ListModelVersionConflictsResponse);
}

// The request of `SyncModelVersions`.
message SyncModelVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  SyncModelVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncModelVersions`.
message SyncModelVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  SyncModelVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushModelVersion`.
message PushModelVersionRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  PushModelVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushModelVersion`.
message PushModelVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  PushModelVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullModelVersions`.
message PullModelVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  PullModelVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullModelVersions`.
message PullModelVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  PullModelVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileModelVersions`.
message ReconcileModelVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  ReconcileModelVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileModelVersions`.
message ReconcileModelVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
