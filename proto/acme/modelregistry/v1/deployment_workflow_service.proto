syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "DeploymentWorkflowServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Runs the long-lived workflow that takes a deployment from start to finish.
service DeploymentWorkflowService {
  // Starts a deployment.
  rpc StartDeploymentWorkflow(StartDeploymentWorkflowRequest) returns (StartDeploymentWorkflowResponse);

  // Advances a deployment.
  rpc AdvanceDeploymentWorkflow(AdvanceDeploymentWorkflowRequest) returns (AdvanceDeploymentWorkflowResponse);

  // Cancels a deployment.
  rpc CancelDeploymentWorkflow(CancelDeploymentWorkflowRequest) returns (CancelDeploymentWorkflowResponse);

  // Pauses a deployment.
  rpc PauseDeploymentWorkflow(PauseDeploymentWorkflowRequest) returns (PauseDeploymentWorkflowResponse);

  // Lists deployments a page at a time.
  rpc ListDeploymentWorkflows(ListDeploymentWorkflowsRequest) returns (ListDeploymentWorkflowsResponse);

  // Signals a deployment.
  rpc SignalDeploymentWorkflow(SignalDeploymentWorkflowRequest) returns (SignalDeploymentWorkflowResponse);
}

// The request of `StartDeploymentWorkflow`.
message StartDeploymentWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  StartDeploymentWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDeploymentWorkflow`.
message StartDeploymentWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  StartDeploymentWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

