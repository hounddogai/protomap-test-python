option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "ModelVersionWorkflowServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Runs the long-lived workflow that takes a model version from start to finish.
service ModelVersionWorkflowService {
  // Starts a model version.
  rpc StartModelVersionWorkflow(StartModelVersionWorkflowRequest) returns (StartModelVersionWorkflowResponse);

  // Advances a model version.
  rpc AdvanceModelVersionWorkflow(AdvanceModelVersionWorkflowRequest) returns (AdvanceModelVersionWorkflowResponse);

  // Cancels a model version.
  rpc CancelModelVersionWorkflow(CancelModelVersionWorkflowRequest) returns (CancelModelVersionWorkflowResponse);

  // Retrys a model version.
  rpc RetryModelVersionWorkflow(RetryModelVersionWorkflowRequest) returns (RetryModelVersionWorkflowResponse);

  // Pauses a model version.
  rpc PauseModelVersionWorkflow(PauseModelVersionWorkflowRequest) returns (PauseModelVersionWorkflowResponse);

  // Resumes a model version.
  rpc ResumeModelVersionWorkflow(ResumeModelVersionWorkflowRequest) returns (ResumeModelVersionWorkflowResponse);

  // Returns a model version.
  rpc InspectModelVersionWorkflow(InspectModelVersionWorkflowRequest) returns (InspectModelVersionWorkflowResponse);

  // Lists model versions a page at a time.
  rpc ListModelVersionWorkflows(ListModelVersionWorkflowsRequest) returns (ListModelVersionWorkflowsResponse);

  // Signals a model version.
  rpc SignalModelVersionWorkflow(SignalModelVersionWorkflowRequest) returns (SignalModelVersionWorkflowResponse);
}

// The request of `StartModelVersionWorkflow`.
message StartModelVersionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  StartModelVersionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartModelVersionWorkflow`.
message StartModelVersionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  StartModelVersionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

