syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "DeploymentImportServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Takes deployments in bulk from partners and legacy systems.
service DeploymentImportService {
  // Takes a stream of deployments and answers once at the end.
  rpc ImportDeployments(stream ImportDeploymentsRequest) returns (ImportDeploymentsResponse);

  // Returns a deployment.
  rpc GetDeploymentImportStatus(GetDeploymentImportStatusRequest) returns (GetDeploymentImportStatusResponse);

  // Cancels a deployment.
  rpc CancelDeploymentImport(CancelDeploymentImportRequest) returns (CancelDeploymentImportResponse);

  // Validates a deployment.
  rpc ValidateDeploymentImport(ValidateDeploymentImportRequest) returns (ValidateDeploymentImportResponse);

  // Lists deployments a page at a time.
  rpc ListDeploymentImports(ListDeploymentImportsRequest) returns (ListDeploymentImportsResponse);

  // Retrys a deployment.
  rpc RetryDeploymentImport(RetryDeploymentImportRequest) returns (RetryDeploymentImportResponse);

  // Maps a deployment.
  rpc MapDeploymentImportColumns(MapDeploymentImportColumnsRequest) returns (MapDeploymentImportColumnsResponse);
}

// The request of `ImportDeployments`.
message ImportDeploymentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportDeploymentsRequest.StreamHeader header = 2;
    Deployment record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportDeployments`.
message ImportDeploymentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string deployment_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportDeploymentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetDeploymentImportStatus`.
message GetDeploymentImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDeploymentImportStatus`.
message GetDeploymentImportStatusResponse {
  Deployment deployment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDeploymentImport`.
message CancelDeploymentImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  CancelDeploymentImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDeploymentImport`.
message CancelDeploymentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  CancelDeploymentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateDeploymentImport`.
message ValidateDeploymentImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  ValidateDeploymentImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDeploymentImport`.
message ValidateDeploymentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  ValidateDeploymentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDeploymentImports`.
message ListDeploymentImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeploymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDeploymentImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDeploymentImports`.
message ListDeploymentImportsResponse {
  repeated Deployment deployments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryDeploymentImport`.
message RetryDeploymentImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  RetryDeploymentImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDeploymentImport`.
message RetryDeploymentImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  RetryDeploymentImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapDeploymentImportColumns`.
message MapDeploymentImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  MapDeploymentImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapDeploymentImportColumns`.
message MapDeploymentImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  MapDeploymentImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
