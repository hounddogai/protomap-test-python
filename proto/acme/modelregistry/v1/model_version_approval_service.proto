syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "ModelVersionApprovalServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Routes model versions through approval, with escalation and delegation.
service ModelVersionApprovalService {
  // Submits a model version.
  rpc SubmitModelVersion(SubmitModelVersionRequest) returns (SubmitModelVersionResponse);

  // Approves a model version.
  rpc ApproveModelVersion(ApproveModelVersionRequest) returns (ApproveModelVersionResponse);

  // Escalates a model version.
  rpc EscalateModelVersion(EscalateModelVersionRequest) returns (EscalateModelVersionResponse);

  // Delegates a model version.
  rpc DelegateModelVersionApproval(DelegateModelVersionApprovalRequest) returns (DelegateModelVersionApprovalResponse);

  // Recalls a model version.
  rpc RecallModelVersion(RecallModelVersionRequest) returns (RecallModelVersionResponse);

  // Returns a model version.
  rpc GetModelVersionApprovalStatus(GetModelVersionApprovalStatusRequest) returns (GetModelVersionApprovalStatusResponse);
}

// The request of `SubmitModelVersion`.
message SubmitModelVersionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  SubmitModelVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitModelVersion`.
message SubmitModelVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  SubmitModelVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

