syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "ModelVersionValidationServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Checks model versions against the rules before anything acts on them.
service ModelVersionValidationService {
  // Validates a model version.
  rpc ValidateModelVersion(ValidateModelVersionRequest) returns (ValidateModelVersionResponse);

  // Previews a model version.
  rpc PreviewModelVersion(PreviewModelVersionRequest) returns (PreviewModelVersionResponse);

  // Checks a model version.
  rpc CheckModelVersionEligibility(CheckModelVersionEligibilityRequest) returns (CheckModelVersionEligibilityResponse);

  // Normalizes a model version.
  rpc NormalizeModelVersion(NormalizeModelVersionRequest) returns (NormalizeModelVersionResponse);

  // Explains a model version.
  rpc ExplainModelVersionDecision(ExplainModelVersionDecisionRequest) returns (ExplainModelVersionDecisionResponse);

  // Scores a model version.
  rpc ScoreModelVersion(ScoreModelVersionRequest) returns (ScoreModelVersionResponse);

  // Lints a model version.
  rpc LintModelVersions(LintModelVersionsRequest) returns (LintModelVersionsResponse);

  // Returns a model version.
  rpc GetModelVersionRules(GetModelVersionRulesRequest) returns (GetModelVersionRulesResponse);
}

// The request of `ValidateModelVersion`.
message ValidateModelVersionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ModelVersion model_version = 3;
  ValidateModelVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateModelVersion`.
message ValidateModelVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  ValidateModelVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

