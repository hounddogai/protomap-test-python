syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "RegisteredModelValidationServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Checks registered models against the rules before anything acts on them.
service RegisteredModelValidationService {
  // Validates a registered model.
  rpc ValidateRegisteredModel(ValidateRegisteredModelRequest) returns (ValidateRegisteredModelResponse);

  // Previews a registered model.
  rpc PreviewRegisteredModel(PreviewRegisteredModelRequest) returns (PreviewRegisteredModelResponse);

  // Checks a registered model.
  rpc CheckRegisteredModelEligibility(CheckRegisteredModelEligibilityRequest) returns (CheckRegisteredModelEligibilityResponse);

  // Normalizes a registered model.
  rpc NormalizeRegisteredModel(NormalizeRegisteredModelRequest) returns (NormalizeRegisteredModelResponse);

  // Explains a registered model.
  rpc ExplainRegisteredModelDecision(ExplainRegisteredModelDecisionRequest) returns (ExplainRegisteredModelDecisionResponse);

  // Scores a registered model.
  rpc ScoreRegisteredModel(ScoreRegisteredModelRequest) returns (ScoreRegisteredModelResponse);

  // Lints a registered model.
  rpc LintRegisteredModels(LintRegisteredModelsRequest) returns (LintRegisteredModelsResponse);

  // Returns a registered model.
  rpc GetRegisteredModelRules(GetRegisteredModelRulesRequest) returns (GetRegisteredModelRulesResponse);
}

// The request of `ValidateRegisteredModel`.
message ValidateRegisteredModelRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  RegisteredModel registered_model = 3;
  ValidateRegisteredModelRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRegisteredModel`.
message ValidateRegisteredModelResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RegisteredModel registered_model = 1;
  ValidateRegisteredModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

