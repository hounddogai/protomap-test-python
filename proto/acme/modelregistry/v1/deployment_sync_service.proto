syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "DeploymentSyncServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Keeps deployments in step with the systems of record in other regions.
service DeploymentSyncService {
  // Syncs a deployment.
  rpc SyncDeployments(SyncDeploymentsRequest) returns (SyncDeploymentsResponse);

  // Pushs a deployment.
  rpc PushDeployment(PushDeploymentRequest) returns (PushDeploymentResponse);

  // Pulls a deployment.
  rpc PullDeployments(PullDeploymentsRequest) returns (PullDeploymentsResponse);

  // Exchanges changes of deployments with a peer.
  rpc StreamDeploymentChanges(stream StreamDeploymentChangesRequest) returns (stream StreamDeploymentChangesResponse);

  // Resolves a deployment.
  rpc ResolveDeploymentConflict(ResolveDeploymentConflictRequest) returns (ResolveDeploymentConflictResponse);

  // Returns a deployment.
  rpc GetDeploymentSyncState(GetDeploymentSyncStateRequest) returns (GetDeploymentSyncStateResponse);

  // Lists deployments a page at a time.
  rpc ListDeploymentConflicts(ListDeploymentConflictsRequest) returns (ListDeploymentConflictsResponse);
}

// The request of `SyncDeployments`.
message SyncDeploymentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  SyncDeploymentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncDeployments`.
message SyncDeploymentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  SyncDeploymentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushDeployment`.
message PushDeploymentRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  PushDeploymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushDeployment`.
message PushDeploymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  PushDeploymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullDeployments`.
message PullDeploymentsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  PullDeploymentsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullDeployments`.
message PullDeploymentsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  PullDeploymentsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamDeploymentChanges`.
message StreamDeploymentChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Deployment change = 2;
    StreamDeploymentChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamDeploymentChanges`.
message StreamDeploymentChangesResponse {
  Deployment deployment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolveDeploymentConflict`.
message ResolveDeploymentConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  Deployment deployment = 3;
  ResolveDeploymentConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveDeploymentConflict`.
message ResolveDeploymentConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  ResolveDeploymentConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDeploymentSyncState`.
message GetDeploymentSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDeploymentSyncState`.
message GetDeploymentSyncStateResponse {
  Deployment deployment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDeploymentConflicts`.
message ListDeploymentConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeploymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDeploymentConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDeploymentConflicts`.
message ListDeploymentConflictsResponse {
  repeated Deployment deployments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
