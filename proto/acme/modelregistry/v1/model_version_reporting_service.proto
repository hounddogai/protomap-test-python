syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "ModelVersionReportingServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Builds and schedules reports about model versions.
service ModelVersionReportingService {
  // Generates a model version.
  rpc GenerateModelVersionReport(GenerateModelVersionReportRequest) returns (GenerateModelVersionReportResponse);

  // Returns a model version.
  rpc FetchModelVersionReport(FetchModelVersionReportRequest) returns (FetchModelVersionReportResponse);

  // Schedules a model version.
  rpc ScheduleModelVersionReport(ScheduleModelVersionReportRequest) returns (ScheduleModelVersionReportResponse);

  // Streams the changes of model versions as they happen.
  rpc StreamModelVersionMetrics(StreamModelVersionMetricsRequest) returns (stream StreamModelVersionMetricsResponse);

  // Lists model versions a page at a time.
  rpc ListModelVersionReports(ListModelVersionReportsRequest) returns (ListModelVersionReportsResponse);

  // Shares a model version.
  rpc ShareModelVersionReport(ShareModelVersionReportRequest) returns (ShareModelVersionReportResponse);

  // Counts model versions by status.
  rpc CountModelVersionTotals(CountModelVersionTotalsRequest) returns (CountModelVersionTotalsResponse);
}

// The request of `GenerateModelVersionReport`.
message GenerateModelVersionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  GenerateModelVersionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateModelVersionReport`.
message GenerateModelVersionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchModelVersionReport`.
message FetchModelVersionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchModelVersionReport`.
message FetchModelVersionReportResponse {
  ModelVersion model_version = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleModelVersionReport`.
message ScheduleModelVersionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ScheduleModelVersionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleModelVersionReport`.
message ScheduleModelVersionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamModelVersionMetrics`.
message StreamModelVersionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ModelVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamModelVersionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamModelVersionMetrics`.
message StreamModelVersionMetricsResponse {
  ModelVersion model_version = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListModelVersionReports`.
message ListModelVersionReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ModelVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListModelVersionReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListModelVersionReports`.
message ListModelVersionReportsResponse {
  repeated ModelVersion model_versions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareModelVersionReport`.
message ShareModelVersionReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string model_version_id = 2;
  ShareModelVersionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareModelVersionReport`.
message ShareModelVersionReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ModelVersion model_version = 1;
  ShareModelVersionReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountModelVersionTotals`.
message CountModelVersionTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ModelVersionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountModelVersionTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountModelVersionTotals`.
message CountModelVersionTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
