  }

  RegisteredModel registered_model = 1;
  ApproveRegisteredModelResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RejectRegisteredModel`.
message RejectRegisteredModelRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
