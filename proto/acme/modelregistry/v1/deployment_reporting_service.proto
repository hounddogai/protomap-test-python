syntax = "proto3";

package acme.modelregistry.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/modelregistry/v1/modelregistry.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Modelregistry.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/modelregistry/v1;modelregistryv1";
option java_multiple_files = true;
option java_outer_classname = "DeploymentReportingServiceProto";
option java_package = "com.acme.modelregistry.v1";

// Builds and schedules reports about deployments.
service DeploymentReportingService {
  // Generates a deployment.
  rpc GenerateDeploymentReport(GenerateDeploymentReportRequest) returns (GenerateDeploymentReportResponse);

  // Returns a deployment.
  rpc FetchDeploymentReport(FetchDeploymentReportRequest) returns (FetchDeploymentReportResponse);

  // Schedules a deployment.
  rpc ScheduleDeploymentReport(ScheduleDeploymentReportRequest) returns (ScheduleDeploymentReportResponse);

  // Streams the changes of deployments as they happen.
  rpc StreamDeploymentMetrics(StreamDeploymentMetricsRequest) returns (stream StreamDeploymentMetricsResponse);

  // Lists deployments a page at a time.
  rpc ListDeploymentReports(ListDeploymentReportsRequest) returns (ListDeploymentReportsResponse);

  // Shares a deployment.
  rpc ShareDeploymentReport(ShareDeploymentReportRequest) returns (ShareDeploymentReportResponse);

  // Counts deployments by status.
  rpc CountDeploymentTotals(CountDeploymentTotalsRequest) returns (CountDeploymentTotalsResponse);

  // Deletes a deployment.
  rpc DeleteDeploymentReport(DeleteDeploymentReportRequest) returns (DeleteDeploymentReportResponse);
}

// The request of `GenerateDeploymentReport`.
message GenerateDeploymentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  GenerateDeploymentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDeploymentReport`.
message GenerateDeploymentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDeploymentReport`.
message FetchDeploymentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDeploymentReport`.
message FetchDeploymentReportResponse {
  Deployment deployment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDeploymentReport`.
message ScheduleDeploymentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  ScheduleDeploymentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDeploymentReport`.
message ScheduleDeploymentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDeploymentMetrics`.
message StreamDeploymentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeploymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDeploymentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDeploymentMetrics`.
message StreamDeploymentMetricsResponse {
  Deployment deployment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDeploymentReports`.
message ListDeploymentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeploymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDeploymentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDeploymentReports`.
message ListDeploymentReportsResponse {
  repeated Deployment deployments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDeploymentReport`.
message ShareDeploymentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  ShareDeploymentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDeploymentReport`.
message ShareDeploymentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deployment deployment = 1;
  ShareDeploymentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDeploymentTotals`.
message CountDeploymentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeploymentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDeploymentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDeploymentTotals`.
message CountDeploymentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDeploymentReport`.
message DeleteDeploymentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string deployment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDeploymentReport`.
message DeleteDeploymentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
