message ResolveRegisteredModelConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string registered_model_id = 2;
  RegisteredModel registered_model = 3;
  ResolveRegisteredModelConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveRegisteredModelConflict`.
message ResolveRegisteredModelConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RegisteredModel registered_model = 1;
  ResolveRegisteredModelConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRegisteredModelConflicts`.
message ListRegisteredModelConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RegisteredModelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRegisteredModelConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRegisteredModelConflicts`.
message ListRegisteredModelConflictsResponse {
  repeated RegisteredModel registered_models = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
