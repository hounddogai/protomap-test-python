[build-system]
requires = ["setuptools==84.0.0", "grpcio-tools==1.84.0", "protobuf==7.36.2"]
build-backend = "build_backend"
backend-path = ["tools"]

[project]
name = "acme-data-services"
version = "0.1.0"
description = "Acme's data products, analytics, and machine learning services"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "SQLAlchemy[asyncio]==2.1.5",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = ["grpcio-tools==1.84.0", "mypy==2.4.0"]

[project.scripts]
acme-data = "acme_data.server:main"
acme-data-admin = "acme_data.programs.admin:main"
acme-data-reconcile = "acme_data.programs.reconcile:main"
acme-data-index = "acme_data.programs.indexer:main"

[tool.mypy]
python_version = "3.12"
files = ["src/acme_data"]
mypy_path = ["src", "build/generated"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["acme.*", "grpc.*", "google.protobuf.*"]
follow_imports = "skip"
ignore_missing_imports = true
